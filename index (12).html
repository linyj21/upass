<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 應用規劃師考古題</title>
<meta name="description" content="初級 AI 應用規劃師能力鑑定：人工智慧基礎概論、生成式 AI 應用與規劃 考古題與模擬題線上測驗">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --paper:#fffdf8; --ink:#1f2320; --ink2:#575d58; --ink3:#8a8f88;
  --line:#e2ddd1; --line2:#cfc8b8;
  --accent:#1f5c4f; --accent-soft:#e3eee9; --accent-ink:#fff;
  --ok:#2e7d4f; --ok-soft:#e4f2e8; --bad:#b4442f; --bad-soft:#f8e6e1; --warn:#a86b12; --warn-soft:#f8eed9;
  --shadow:0 1px 2px rgba(40,35,20,.06),0 4px 16px rgba(40,35,20,.06);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151816; --paper:#1d211f; --ink:#e8e6df; --ink2:#a9aea7; --ink3:#7c827b;
    --line:#2d332f; --line2:#3b423d;
    --accent:#6fbfa8; --accent-soft:#1f3530; --accent-ink:#0f1a17;
    --ok:#6cc58f; --ok-soft:#1c3324; --bad:#ec8a73; --bad-soft:#3a221d; --warn:#e2b25c; --warn-soft:#3a2f1a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#151816; --paper:#1d211f; --ink:#e8e6df; --ink2:#a9aea7; --ink3:#7c827b;
  --line:#2d332f; --line2:#3b423d;
  --accent:#6fbfa8; --accent-soft:#1f3530; --accent-ink:#0f1a17;
  --ok:#6cc58f; --ok-soft:#1c3324; --bad:#ec8a73; --bad-soft:#3a221d; --warn:#e2b25c; --warn-soft:#3a2f1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.serif{font-family:"Noto Serif TC",serif}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;cursor:pointer;background:none;border:0;padding:0}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;font-family:"JetBrains Mono",monospace}
.top .sp{flex:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;height:34px;padding:0 10px;color:var(--ink2);font-size:14px}
.iconbtn:hover{border-color:var(--line2);color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;border:1px solid var(--line2);background:var(--paper);padding:9px 16px;font-weight:500;font-size:15px;transition:.15s}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:14px}

/* home */
.hero{padding:44px 0 18px}
.hero .eyebrow{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.12em}
.hero h1{font-family:"Noto Serif TC",serif;font-size:clamp(28px,5vw,40px);line-height:1.25;margin:8px 0 10px}
.hero p{color:var(--ink2);margin:0;max-width:640px}
.rules{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font-size:13px;color:var(--ink2);border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 11px}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin:26px 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.subj{padding:24px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.subj .num{position:absolute;right:18px;top:6px;font-family:"Noto Serif TC",serif;font-size:84px;line-height:1;color:var(--line);font-weight:700;pointer-events:none}
.subj .k{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.08em}
.subj h2{margin:2px 0 0;font-family:"Noto Serif TC",serif;font-size:24px;position:relative}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--bg);border-radius:9px;padding:8px 10px}
.stat b{display:block;font-family:"JetBrains Mono",monospace;font-size:19px}
.stat span{font-size:12px;color:var(--ink3)}
.subj .actions{display:flex;flex-wrap:wrap;gap:8px}
.bankinfo{font-size:13px;color:var(--ink3)}
.section-h{display:flex;align-items:baseline;gap:10px;margin:34px 0 12px}
.section-h h3{margin:0;font-size:18px}
.section-h .sp{flex:1}
.datatools{padding:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.datatools p{margin:0;flex:1 1 260px;color:var(--ink2);font-size:14px}
footer{color:var(--ink3);font-size:13px;padding:30px 0 50px}

/* exam */
.exambar{position:sticky;top:58px;z-index:15;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.exambar .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.exambar .title{font-weight:700}
.exambar .sub{color:var(--ink3);font-size:13px}
.timer{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;padding:4px 12px;border-radius:9px;background:var(--paper);border:1px solid var(--line)}
.timer.low{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.timer.crit{color:var(--bad);border-color:var(--bad);background:var(--bad-soft);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.progress{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.examgrid{display:grid;grid-template-columns:1fr 230px;gap:20px;margin:20px auto 40px;align-items:start}
.qcard{padding:26px}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;color:var(--ink3);font-size:13px;margin-bottom:10px}
.qno{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--accent);font-size:15px}
.flagbtn{margin-left:auto;background:none;border:1px solid var(--line);border-radius:7px;padding:2px 10px;font-size:13px;color:var(--ink2)}
.flagbtn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.qtext{font-size:17px;white-space:pre-line;margin:0 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;transition:.12s}
.opt:hover{border-color:var(--line2);background:color-mix(in srgb,var(--accent-soft) 35%,var(--paper))}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line2);font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;color:var(--ink2);margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.side{position:sticky;top:150px;padding:16px}
.side h4{margin:0 0 10px;font-size:14px;color:var(--ink2);font-weight:500}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dot{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:var(--bg);font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink3);padding:0;position:relative}
.dot.ans{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.dot.flag::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink3);margin:12px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.side .btn{width:100%;margin-top:6px}
.kbd{font-size:12px;color:var(--ink3);margin-top:10px}

/* result */
.result-head{padding:28px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin:24px 0 18px}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-family:"JetBrains Mono",monospace;font-size:40px;line-height:1}
.ring .v span{display:block;font-size:12px;color:var(--ink3)}
.verdict{display:inline-block;font-weight:700;border-radius:8px;padding:3px 12px;font-size:15px}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}
.verdict.fail{background:var(--bad-soft);color:var(--bad)}
.result-head h2{margin:8px 0 6px;font-family:"Noto Serif TC",serif}
.kv{display:flex;flex-wrap:wrap;gap:18px;color:var(--ink2);font-size:14px;margin:8px 0 14px}
.kv b{color:var(--ink);font-family:"JetBrains Mono",monospace}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 16px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--ink2);font-weight:500}
.tab.on{color:var(--accent);border-color:var(--accent)}
.review{padding:20px 22px;margin-bottom:12px;border-left:4px solid var(--line2)}
.review.wrong{border-left-color:var(--bad)}
.review.right{border-left-color:var(--ok)}
.review .qtext{font-size:16px;margin-bottom:12px}
.ropt{display:flex;gap:10px;padding:7px 10px;border-radius:8px;font-size:15px;margin-bottom:4px}
.ropt .L{font-family:"JetBrains Mono",monospace;font-weight:700;flex:none;width:20px}
.ropt.correct{background:var(--ok-soft);color:var(--ok)}
.ropt.picked{background:var(--bad-soft);color:var(--bad)}
.ropt .tag{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.expl{margin-top:12px;background:var(--bg);border-radius:9px;padding:12px 14px;font-size:15px;color:var(--ink2)}
.expl b{color:var(--ink)}
.src{font-size:12px;color:var(--ink3)}
.badge{white-space:nowrap;font-size:11px;border-radius:5px;padding:1px 7px;border:1px solid var(--line);color:var(--ink2)}
.badge.mock{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent)}
.badge.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));color:var(--bad)}
.empty{padding:40px;text-align:center;color:var(--ink3)}

/* history */
table.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th,.hist td{white-space:nowrap;padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
.hist th{color:var(--ink3);font-weight:500;font-size:13px}
.hist td.mono{white-space:nowrap}
.tablewrap{overflow-x:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:6px 14px;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--paper);border-radius:14px;max-width:440px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px}
.modal p{margin:0 0 18px;color:var(--ink2)}
.modal .btns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow)}

@media (max-width:760px){
  .examgrid{grid-template-columns:1fr}
  .side{position:static}
  .dots{grid-template-columns:repeat(10,1fr)}
  .qcard{padding:18px}
  .result-head{grid-template-columns:1fr;justify-items:center;text-align:center}
  .result-head .kv{justify-content:center}
  .stats{grid-template-columns:repeat(2,1fr)}
  .exambar{top:58px}
  .timer{font-size:18px}
  .side .kbd{display:none}
}
@media (max-width:420px){ .dots{grid-template-columns:repeat(8,1fr)} .brand .full{display:none} }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" onclick="App.go('home')" aria-label="回首頁"><span class="mark">AI</span><span><span class="full">AI 應用規劃師 · </span>考古題測驗</span></button>
    <span class="sp"></span>
    <button class="iconbtn" id="histBtn" onclick="App.go('history')">紀錄與錯題本</button>
    <button class="iconbtn" id="themeBtn" onclick="App.toggleTheme()" aria-label="切換深淺色" title="切換深淺色"><svg width="16" height="16" viewBox="0 0 16 16" style="display:block"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>

</header>

<script>
const BANK = {"ai":[{"id":"ai-114-4-01","s":"ai","q":"在人工智慧系統的決策流程中，下列哪一種情境最符合「人在迴圈上(Human-over-the-loop)」所強調的監督機制？","o":["AI 系統只能提供建議，人類需主動下達命令才能進行決策","人類對 AI 的運行進行日常監督，必要時可立即介入修正或干預","人類平時不參與 AI 的運作，僅在發生異常或重大錯誤時才接手控制","AI 的所有判斷與行動在執行前，皆須經過人類逐一審核與批准"],"a":1,"e":"「人在迴圈上」指 AI 可自主運作，但人類持續監督、隨時可介入修正或中止，故「日常監督、必要時立即介入」最貼切。「AI 只提供建議、人類下令才決策」與「每項行動執行前皆須人類逐一核准」屬於「人在迴圈中」；「平時不參與、出事才接手」則趨近「人在迴圈外」，缺乏持續監督。","src":"114年第四次 第1題"},{"id":"ai-114-4-02","s":"ai","q":"下列哪一種特徵工程技巧，最適合將「星期幾」和「24 小時制時間」這兩個欄位結合，以預測通勤時間？","o":["One-hot 編碼(One-hot encoding)","正規化(Normalization)","特徵交叉(Feature Cross)","寬深模型(Wide and Deep)"],"a":2,"e":"特徵交叉是把兩個以上特徵組合成新特徵（如「週一×早上8點」），讓模型學到單一欄位無法表達的交互作用，正適合結合星期與時段預測通勤時間。One-hot 編碼只是把單一類別欄位轉成數值；正規化僅調整數值尺度；寬深模型是模型架構而非特徵工程技巧（其寬部分本身就是在使用交叉特徵）。","src":"114年第四次 第2題"},{"id":"ai-114-4-03","s":"ai","q":"關於 ETL(Extract-Transform-Load)，下列敘述何者為正確？","o":["E 表示將資料直接儲存至目標儲存庫","ETL 的處理順序可以自由調整為 TEL","L 表示將目標儲存庫經過反加密處理載入資料","T 包括資料的清理與排序"],"a":3,"e":"ETL 的 T（Transform，轉換）負責資料清理、格式轉換、排序、彙總等處理，敘述正確。E 是從來源「擷取」資料，而非直接存入目標庫；L 是把轉換後資料「載入」目標儲存庫，與「反加密」無關；ETL 順序有其邏輯，雖有 ELT 變形，但不能隨意改成 TEL。","src":"114年第四次 第3題"},{"id":"ai-114-4-04","s":"ai","q":"關於資料正則化(Regularization) L1、L2 方法，下列敘述何者正確？","o":["L1 權重個數愈多，愈可以提升模型的正確率","L2 稱為 Lasso 正則化","L1 運用減少權重的絕對值來控制模型的複雜度","L2 較 L1 正則化方法會將特徵權重趨近於零"],"a":2,"e":"L1 正則化（Lasso）在損失函數加入權重絕對值總和作為懲罰，藉此壓低權重、控制模型複雜度，敘述正確。L2 稱為 Ridge 而非 Lasso；容易把權重壓到恰為零（產生稀疏性）的是 L1 而非 L2；權重個數越多反而越易過度擬合，並不保證提升正確率。","src":"114年第四次 第4題"},{"id":"ai-114-4-05","s":"ai","q":"在機器學習中，「偏差與變異權衡(Bias-Variance Tradeoff)」主要用來解決下列哪一類型的問題？","o":["因資料來源或收集方式限制，導致模型學習到的資訊不足","測試資料樣本與訓練資料高度重複，造成模型泛化能力評估失準","訓練資料中類別分布不均，使模型在少數類別上表現不佳","如何在模型偏差與變異之間取得平衡，以避免過度擬合或欠擬合"],"a":3,"e":"偏差與變異權衡描述模型複雜度的兩難：模型太簡單偏差高、易欠擬合，太複雜變異高、易過度擬合，目的就是在兩者間取得平衡。「資料資訊不足」屬資料蒐集問題；「測試與訓練資料重複」屬資料洩漏與評估設計問題；「類別分布不均」屬類別不平衡問題，皆非此權衡的核心。","src":"114年第四次 第5題"},{"id":"ai-114-4-06","s":"ai","q":"在 Lasso 模型中，L1 正則化(Regularization)導致參數收斂為零的原因為何？","o":["L1 正則化忽略目標變數","L1 對梯度有平滑作用","L1 對大係數懲罰較強，促使稀疏解","L1 會轉換損失函數為非凸形"],"a":2,"e":"L1 懲罰項為權重絕對值，其次梯度在零點附近仍維持固定大小，會持續把小權重推向恰好為零，因此產生稀疏解、具特徵選擇效果。L1 並未忽略目標變數；它在零點不可微，談不上「平滑梯度」；L1 懲罰為凸函數，加入後損失函數仍是凸的。（註：嚴格來說，對大係數懲罰較重的是 L2（平方項），L1 稀疏的原因在於對各大小係數施加固定斜率的懲罰，官方答案的措辭不夠精確，但相較其他選項最接近。）","src":"114年第四次 第6題"},{"id":"ai-114-4-07","s":"ai","q":"貝氏分類器(Naive Bayes Classifier)常被應用於文字分類、垃圾郵件過濾等場景。依據模型特性，它最適合歸類於下列哪一類？","o":["透過直接學習輸入特徵與目標標籤之間的邊界或關係來進行分類的模型","透過建構資料的整體分布，並利用條件關係進行推斷和分類的模型","側重探索資料中樣本間的相似性，將資料自動分成不同群組的模型","透過試錯學習，根據行動結果的獎勵或懲罰來優化決策策略的模型"],"a":1,"e":"單純貝氏分類器屬於生成式模型：它估計先驗機率 P(類別) 與條件機率 P(特徵|類別)，建構資料分布後用貝氏定理推斷類別。「直接學習特徵與標籤的邊界」描述的是鑑別式模型（如邏輯迴歸、SVM）；「依相似性自動分群」是非監督式分群；「試錯與獎懲優化策略」則是強化式學習。","src":"114年第四次 第7題"},{"id":"ai-114-4-08","s":"ai","q":"為提升生成式 AI 系統回應的語境一致性，常會結合哪類模型技術？","o":["決策樹分類器(Decision Tree Classifier)","條件語言模型(Conditional Language Model)","強化學習 Q-learning 函數模型","基因演算法(Genetic Algorithm)"],"a":1,"e":"條件語言模型會依據前文、對話歷史或指定條件來生成下一個詞，因此能維持回應與上下文的語境一致，是生成式 AI 對話系統的核心。決策樹是分類模型；Q-learning 用於強化學習中的行動價值估計；基因演算法是最佳化搜尋方法，三者都不直接負責語言生成的上下文一致性。","src":"114年第四次 第8題"},{"id":"ai-114-4-09","s":"ai","q":"根據 2025 年 9 月行政院通過之《人工智慧基本法》草案，政府推動人工智慧之「創新實驗環境」制度，主要參考歐盟的何種制度？","o":["Data Protection Impact Assessment","Regulatory Sandbox","AI Trust Label","AI Ethics Review Board"],"a":1,"e":"草案中的「創新實驗環境」概念源自監理沙盒（Regulatory Sandbox），歐盟 AI 法也設有 AI 監理沙盒，讓新技術在受控環境中先行測試。資料保護影響評估是 GDPR 的隱私風險評估機制；AI 信任標章屬認證標示；倫理審查委員會屬內部審查機制，都不是「實驗環境」制度。","src":"114年第四次 第9題"},{"id":"ai-114-4-10","s":"ai","q":"根據《金融機構運用人工智慧技術作業規範》，金融機構須建立內部治理架構，並指定專責單位或人員負責推動及管理人工智慧事務，下列何者並非規範所明訂須落實的治理措施？","o":["辦理人工智慧人才培育","清楚了解生成式 AI 技術之運作模式","每日公布人工智慧系統運作狀況","指派高階主管或委員會進行監督管理"],"a":2,"e":"金管會的作業規範要求金融機構建立 AI 治理架構，包括指派高階主管或委員會監督、辦理 AI 人才培育、了解生成式 AI 的運作模式與風險等，但並未要求「每日公布 AI 系統運作狀況」，這既不實際也非規範所載，故為答案。其餘三項均屬規範明訂的治理措施。","src":"114年第四次 第10題"},{"id":"ai-114-4-11","s":"ai","q":"下列哪一類問題最適合使用非監督式學習(Unsupervised Learning)來處理？","o":["根據已標記的醫療影像訓練模型診斷疾病","根據使用者行為將用戶分群，以優化行銷策略","透過已知交通事故記錄預測未來事故發生機率","根據歷史股價預測未來股市的走勢"],"a":1,"e":"非監督式學習處理沒有標籤的資料，依使用者行為相似性自動分群（客群區隔）正是典型應用。以已標記醫療影像診斷疾病屬監督式分類；用已知事故記錄預測事故機率、用歷史股價預測走勢，則屬監督式的分類或迴歸（時間序列預測），皆有明確目標值可學習。","src":"114年第四次 第11題"},{"id":"ai-114-4-12","s":"ai","q":"下列哪一種圖表最適合用來呈現並分析「兩個數值型變數」之間的關係，例如觀察身高與體重的相關性？","o":["散佈圖(Scatter Plot)","折線圖(Line Chart)","直方圖(Histogram)","長條圖(Bar Chart)"],"a":0,"e":"散佈圖以兩軸分別代表兩個數值變數，每個點代表一筆觀測，最適合觀察身高與體重這類變數間的相關方向與強弱。折線圖主要呈現隨時間或順序的變化趨勢；直方圖呈現單一數值變數的分布；長條圖用於比較不同類別的數量，皆不適合分析兩數值變數關係。","src":"114年第四次 第12題"},{"id":"ai-114-4-14","s":"ai","q":"某企業分析團隊正在處理一組近兩年的營運與銷售數據，共有四個部門提出了各自的分析需求，請判斷哪一個最接近「預測性分析(Predictive Analysis)」的特性？","o":["視覺化所有產品線過去月銷售走勢與標準差，觀察其分佈情況與波動程度","藉由資料比對分析，找出去年母親節促銷失效的地區與品類組合","建構模型推算下一季的主力商品銷量，以規劃備貨與倉儲資源配置","透過熱圖分析廣告投放成本與訂單轉換率之間的潛在關聯性"],"a":2,"e":"預測性分析是利用歷史資料建立模型，推估未來可能結果，「建模推算下一季主力商品銷量以規劃備貨」正符合。視覺化過去銷售走勢與標準差屬描述性分析；找出去年促銷失效原因屬診斷性分析；用熱圖觀察廣告成本與轉換率的關聯，屬探索或描述性分析，並未預測未來。","src":"114年第四次 第14題"},{"id":"ai-114-4-15","s":"ai","q":"某模型使用 K-近鄰演算法(KNN)進行分類，K 設為 3。 一筆新的測試資料輸入後，與其最接近的 3 筆資料的類別如下：鄰近樣本 1：類別A；鄰近樣本 2：類別 B；鄰近樣本 3：類別 A。請問模型會將這筆資料預測為哪一類別？","o":["類別 A","類別 B","類別 A 與 B 各一半，無法分類","類別 A 或 B，視距離遠近加權而定"],"a":0,"e":"KNN 分類以最近 K 個鄰居多數決決定類別。K=3 時鄰居為 A、B、A，A 佔兩票，因此預測為類別 A。K 取奇數正是為避免平手，所以不會「各一半無法分類」；距離加權是 KNN 的變形設定，題目未指定，以標準多數決判斷即可。","src":"114年第四次 第15題"},{"id":"ai-114-4-16","s":"ai","q":"某團隊想採用循環神經網路(Recurrent Neural Network, RNN)建構長期氣候數據的預測模型，以下哪一項敘述最符合使用 RNN 可能會遇到的挑戰？","o":["RNN 無法處理可變長度的序列輸入，因此在實務上限制極大","RNN 在長序列訓練中可能出現梯度消失，影響模型效果","RNN 無法捕捉時間上的依賴關係，因此預測準確度低","RNN 只能用於分類任務，不能應用於時間序列預測"],"a":1,"e":"RNN 透過時間反向傳播訓練，序列很長時梯度在多次連乘後容易趨近於零（梯度消失），使模型難以學到長期依賴，這是處理長期氣候資料的主要挑戰，也是 LSTM、GRU 被提出的原因。RNN 本就能處理可變長度序列、能捕捉時間依賴，也可用於時間序列預測，其餘說法皆錯。","src":"114年第四次 第16題"},{"id":"ai-114-4-17","s":"ai","q":"一間金融科技公司設計一款智慧投資系統，該系統會根據市場變化自動決定「買進」、「持有」或「賣出」的行動，並根據每次交易後的盈虧結果，逐步優化下一次的投資策略。整個過程中，系統不依賴事先標記的資料，而是根據歷次行動獲得的獎勵進行調整。請問此系統最可能採用哪一種學習方法？","o":["強化式學習(Reinforcement Learning)","監督式學習(Supervised Learning)","非監督式學習(Unsupervised Learning)","遷移學習(Transfer Learning)"],"a":0,"e":"系統依市場狀態選擇買進、持有或賣出等行動，並根據盈虧（獎勵）持續調整策略，不依賴事先標記資料，完全符合強化式學習的「代理人—環境—獎勵」架構。監督式學習需要標記資料；非監督式學習著重找出資料結構；遷移學習是把既有模型知識轉用到新任務，皆不符題意。","src":"114年第四次 第17題"},{"id":"ai-114-4-18","s":"ai","q":"關於 Q-Learning 與 Deep Q-Learning，下列敘述何者最正確？","o":["Q-Learning 與 Deep Q-Learning 的差異在於是否使用標記資料作為學習基礎","Q-Learning 可處理任意維度的狀態空間，因此比 Deep Q-Learning更靈活","Deep Q-Learning 透過深度神經網路近似 Q 值，避免了 Q 表在高維空間中難以擴展的問題","Deep Q-Learning 無法搭配經驗回放(Experience Replay)，因為會導致樣本順序被打亂"],"a":2,"e":"傳統 Q-Learning 以 Q 表記錄每個狀態與行動的價值，狀態空間一大就難以存放與學習；Deep Q-Learning 改用深度神經網路近似 Q 函數，解決高維擴展問題。兩者都不依賴標記資料；Q 表反而難以處理高維狀態；DQN 正是靠經驗回放打亂樣本順序來降低相關性、穩定訓練。","src":"114年第四次 第18題"},{"id":"ai-114-4-19","s":"ai","q":"在訓練機器學習模型時，若任務為預測房價，應選用下列哪一種損失函數(Loss Function)來衡量預測誤差？","o":["均方誤差(MSE)","交叉熵損失(Cross-Entropy Loss)","Hinge 損失(Hinge Loss)","KL 散度(Kullback-Leibler Divergence)"],"a":0,"e":"房價是連續數值，屬迴歸問題，最常用均方誤差（MSE）衡量預測值與實際值差距的平方平均。交叉熵損失用於分類任務的機率輸出；Hinge 損失主要用於 SVM 等最大間隔分類器；KL 散度用來衡量兩個機率分布的差異，皆不適合直接衡量房價的數值誤差。","src":"114年第四次 第19題"},{"id":"ai-114-4-20","s":"ai","q":"某醫院希望開發一個系統，根據患者的年齡、血壓與 BMI 等資訊，預測其罹患糖尿病的機率(0~1)，並依據預測值是否超過 0.5 做出風險警示。下列哪一種模型最適合用於此分類任務？","o":["邏輯迴歸(Logistic Regression)","支援向量機(Support Vector Machine)","決策樹(Decision Tree)","K 平均演算法(K-means)"],"a":0,"e":"邏輯迴歸透過 Sigmoid 函數輸出 0 到 1 的機率，再以 0.5 等門檻值做二元分類，正好符合「預測罹病機率並依門檻發出警示」的需求，且係數易於解釋。SVM 預設輸出的是分類邊界距離而非機率；決策樹的機率輸出較粗略；K-means 是非監督式分群，不能做有標籤的分類。","src":"114年第四次 第20題"},{"id":"ai-114-4-21","s":"ai","q":"某金融科技公司正開發一套違約風險預測系統，需大量處理不同客戶的財務特徵資料。考量到資料特徵數量眾多，且希望提升預測的穩定性與泛化能力，下列哪一種鑑別式 AI 模型最適合？","o":["邏輯迴歸(Logistic Regression)","支援向量機(Support Vector Machine)","決策樹(Decision Tree)","隨機森林(Random Forest)"],"a":3,"e":"隨機森林是集成多棵決策樹的鑑別式模型，透過資料與特徵的隨機抽樣降低變異，能處理大量特徵、提升穩定性與泛化能力，適合違約風險預測。單一決策樹容易過度擬合、穩定性差；邏輯迴歸偏向線性關係，面對大量複雜特徵表現有限；SVM 在大資料量時計算成本高且調參較繁瑣。","src":"114年第四次 第21題"},{"id":"ai-114-4-22","s":"ai","q":"關於變分自編碼器(Variational Autoencoder, VAE)的運作流程，下列何者敘述最為正確？","o":["解碼器的任務是將低維壓縮向量分類為不同類別","編碼器將輸入資料轉換為可視化圖像以利模型學習","編碼器將資料轉換為潛在空間表示，解碼器再重建資料","編碼器利用最大邊際機率對資料進行異常點偵測"],"a":2,"e":"VAE 的編碼器把輸入映射到潛在空間的機率分布（平均值與變異數），再由解碼器從潛在向量取樣並重建資料，也可藉此生成新樣本。解碼器任務是重建而非分類；編碼器輸出的是潛在表示而非可視化圖像；「最大邊際」是 SVM 的概念，VAE 雖可用於異常偵測，但並非靠此機制。","src":"114年第四次 第22題"},{"id":"ai-114-4-23","s":"ai","q":"下列何者不是我國數位發展部 AI 產品與系統評測中心對生成式 AI 的評測項目?","o":["當責性","可靠性","隱私及資安","互動性"],"a":3,"e":"數位發展部 AI 評測中心對生成式 AI 的評測面向包括安全性、可解釋性、韌性、公平性、準確性、透明性、當責性、可靠性、隱私及資安等，重點在可信任 AI。「互動性」屬使用體驗層面，不在評測項目之列；「當責性」、「可靠性」、「隱私及資安」都是明列的評測項目。","src":"114年第四次 第23題"},{"id":"ai-114-4-24","s":"ai","q":"在保持 GPT-OSS 模型架構不變的前提下，如果將模型參數量從 20 億提升至 120 億，並假設有足夠的訓練資料支撐，下列敘述何者最正確？","o":["模型參數增加會線性提升效能，且即使訓練資料不變也不會遇到瓶頸","參數越多模型推理越快，因為每層可以並行計算更多參數","較大的參數量能提升模型的表達能力與預測效能，但需足夠訓練資料支持","增加參數量不影響記憶體使用，只會影響計算速度"],"a":2,"e":"在資料充足的前提下，擴大參數量能提升模型表達能力與預測效能，這也是縮放定律（Scaling Law）的觀察，但仍需足量資料支撐。效能提升並非線性，資料不足會遇瓶頸；參數越多推理越慢而非越快；參數量增加會直接提高記憶體需求，不只影響計算速度。","src":"114年第四次 第24題"},{"id":"ai-114-4-25","s":"ai","q":"在自然語言處理任務中，為了減少訓練語料中偏見對模型的影響，下列哪種資料處理策略屬於常見的「資料去偏(Data Debiasing)」做法？","o":["讓模型在訓練時隨機替換輸出，以抵消資料中存在的系統性偏差","增加模型的參數量，依賴更大的模型自動消除原始資料中的偏見","調整或擴充訓練語料，使不同群體或類型資料的比例更加平衡，避免模型過度偏向出現頻率高的類別","對訓練資料施加額外正則化或噪音，使模型在學習過程中對偏見敏感度降低"],"a":2,"e":"資料去偏的常見做法是從資料端著手，例如調整取樣比例、擴充弱勢群體語料、反事實資料增強，讓不同群體比例更平衡。「隨機替換輸出」會破壞學習目標，無法抵消系統性偏差；「加大模型參數」反而可能放大偏見；正則化或加噪音主要用於防止過度擬合，無法針對偏見去除。","src":"114年第四次 第25題"},{"id":"ai-114-4-26","s":"ai","q":"在深度學習模型的微調(Fine-tuning)過程中，可能出現所謂的「災難性遺忘(Catastrophic Forgetting)」。此現象最可能造成哪種情況？","o":["由於計算資源或訓練步驟不足，模型在微調過程中無法完整收斂，導致學習效果受限","微調後模型的表現變得隨機，無法有效記憶新學到的模式與知識","微調後模型的部分權重產生偏移，導致模型無法針對較長的文字進行回應","模型過度適應微調的資料分佈，逐漸遺忘先前預訓練所獲得的廣泛知識，在原有任務或廣泛領域上表現變差"],"a":3,"e":"災難性遺忘指模型在新資料上微調時權重被大幅改寫，過度適應新任務分布，以致遺忘預訓練學到的廣泛知識，在原有任務上表現明顯下滑。「訓練不足無法收斂」是欠擬合問題；「表現變得隨機」並非此現象的特徵；「無法回應長文字」與上下文長度限制有關，不是災難性遺忘。","src":"114年第四次 第26題"},{"id":"ai-114-4-27","s":"ai","q":"在大型 Transformer 模型的效能優化過程中，常見的方法之一是「剪枝(Pruning)」。下列哪一項最符合該方法的核心概念？","o":["將模型中所有權重按比例縮小，使其值更接近零，以降低計算量","移除模型中影響較小或冗餘的部分權重參數，以減少模型大小並提升推理效率","在訓練時僅更新部分權重而將其他權重凍結，從而減少需要調整的參數數量","根據注意力分數動態跳過處理部分輸入 Token，以減少每次前向傳播的計算"],"a":1,"e":"剪枝是移除對輸出影響小或冗餘的權重、神經元或注意力頭，以縮小模型、加快推理。「所有權重按比例縮小」並不會減少計算量，較接近權重衰減；「只更新部分權重、凍結其餘」是參數高效微調的概念；「依注意力分數跳過 Token」屬動態 Token 剪除或稀疏注意力，不是典型的權重剪枝。","src":"114年第四次 第27題"},{"id":"ai-114-4-28","s":"ai","q":"對非常長的輸入序列進行推理(Inference)，Transformer 模型推理的主要計算瓶頸通常是什麼？","o":["模型輸出層產生文本的過程，因為每生成一個詞都必須重新訓練整個模型一次","詞嵌入 (Embedding) 查找操作，因為其時間複雜度隨詞彙表大小指數級增長","Softmax 函數的計算，因為對每個 Token 都需要執行繁重的運算","自注意力層的計算和其記憶體使用，因為注意力矩陣的大小隨序列長度呈平方級增長"],"a":3,"e":"自注意力需計算每個 Token 與所有 Token 的關聯，注意力矩陣大小隨序列長度 n 呈 n² 成長，長序列時計算量與記憶體都成為主要瓶頸。推理時生成每個詞不需要重新訓練模型；詞嵌入查找是查表操作，成本很低；Softmax 本身運算不重，其負擔也是來自注意力矩陣的大小。","src":"114年第四次 第28題"},{"id":"ai-114-4-29","s":"ai","q":"在「可解釋人工智慧(Explainable AI, XAI)」領域中，LIME(Local Interpretable Model-agnostic Explanations)方法最核心的應用目的是什麼？","o":["解釋單一樣本(局部預測)的黑箱模型決策過程","全面提升黑箱模型整體的預測準確度","將黑箱模型轉換成完全可解釋的模型作為替代","用於生成大量擬真數據來替代訓練集"],"a":0,"e":"LIME 在單一樣本附近擾動輸入，並以簡單可解釋模型（如線性模型）局部擬合黑箱模型行為，用來解釋「這一筆」預測的依據，且不限模型類型。它不會提升原模型準確度；只提供局部近似解釋，不會把黑箱整個轉成可解釋模型；也不是用來生成擬真資料取代訓練集的工具。","src":"114年第四次 第29題"},{"id":"ai-114-4-30","s":"ai","q":"在醫療診斷決策支援系統等高風險領域中，「可解釋人工智慧(Explainable AI, XAI)」的核心價值最主要呈現在哪個面向？","o":["透過提供可理解的決策依據，促進患者與醫療專業人員對系統診斷結果的信任與接受度","以可解釋性方法優化臨床資料蒐集與管理流程，從而降低整體醫療作業成本","利用解釋機制增強模型預測的統計顯著性與準確度，使其在研究及實務應用中更具科學性","透過提供透明化的運作過程，進而減輕臨床人員負擔，並提升醫療服務的整體效率"],"a":0,"e":"高風險醫療領域最重視責任與信任，XAI 提供可理解的決策依據，讓醫師能驗證判斷、向病患說明，進而提升對系統診斷的信任與接受度。降低作業成本、減輕人員負擔屬附帶效益，並非核心價值；可解釋性方法本身不會提高模型的統計顯著性或預測準確度。","src":"114年第四次 第30題"},{"id":"ai-114-4-31","s":"ai","q":"在金融科技公司的信貸決策系統中，導入反事實解釋(Counterfactual Explanation)時，實際部署往往伴隨技術與監管挑戰。下列哪一項最符合該情境下的核心挑戰？","o":["需要建立完整的客戶行為預測模型來估算建議改變的實施成本，並整合到現有的風險管理系統架構中","必須使用聯邦學習技術保護客戶隱私，同時在分散式環境中計算跨機構的反事實解釋結果","需要建構時間序列因果圖來處理客戶信用狀況的動態變化，並預測未來可能的信用評分軌跡","生成的反事實樣本必須滿足特徵間的因果約束和業務邏輯約束，同時確保建議的改變在現實中具有可操作性且符合公平放貸法規"],"a":3,"e":"反事實解釋回答「客戶需改變哪些條件才能核貸」，實務上最大挑戰是建議必須合理可行：要符合特徵間因果關係（例如年齡不能變小）、業務邏輯，並遵守公平放貸法規、避免以受保護特徵作為建議。建立行為預測模型估算成本、聯邦學習、時間序列因果圖都不是反事實解釋的必要核心挑戰。","src":"114年第四次 第31題"},{"id":"ai-114-4-32","s":"ai","q":"在統計推論中，若樣本來自母體但呈現明顯偏態分布，且樣本數有限，下列哪一項策略最能減少推估母體參數的偏誤？","o":["直接使用樣本平均數與變異數估計母體參數，不做任何調整","增加樣本數並考慮使用分位數或中位數作為中心趨勢估計","將樣本隨機重新排列後，多次計算平均值以消除偏態影響","完全依賴樣本標準差來估計母體參數，忽略分布形態"],"a":1,"e":"偏態分布中，平均數易被長尾極端值拉偏，中位數或分位數較穩健；同時增加樣本數可降低抽樣誤差，因此最能減少推估偏誤。直接用樣本平均數與變異數會受偏態影響；隨機重新排列不會改變資料內容，重算平均值結果相同；只依賴樣本標準差且忽略分布形態同樣不恰當。","src":"114年第四次 第32題"},{"id":"ai-114-4-33","s":"ai","q":"在工業物聯網架構中，進行設備預測性維護(Predictive Maintenance)時，若面對異常事件發生頻率極低、樣本高度不平衡的時間序列資料，下列哪一種方法最能兼顧模型穩定性與異常偵測效能？","o":["將每筆異常事件資料複製多次以提升模型對異常的辨識敏感度，搭配全序列訓練模型(如 LSTM)","對時間序列進行差分與標準化後，使用傳統監督式學習模型(如SVM)進行分類訓練","使用經過時間序列特化的 SMOTE 技術生成異常樣本，以平衡異常與正常資料比例","採 用 基 於 重 建 誤 差 的 自 編 碼 器 模 型 ( Sequence-to-Sequence Autoencoder)進行異常偵測，並僅使用正常資料進行訓練"],"a":3,"e":"異常極少時，以正常資料訓練序列自編碼器學習「正常型態」，再用重建誤差偏高判定異常，不需大量異常樣本，兼顧穩定性與偵測效能。直接複製異常樣本易造成過度擬合；監督式 SVM 在極度不平衡下難以學好少數類別；SMOTE 合成時間序列樣本可能破壞時間結構、產生不真實資料。","src":"114年第四次 第33題"},{"id":"ai-114-4-34","s":"ai","q":"在零售業進行客戶行為分析時，資料倉儲中發現多個欄位儲存相同的購買金額資訊(例如：amount_usd、total_price、transaction_value)，但其單位、命名慣例及格式不一致，進而導致特徵工程階段混淆模型輸入。針對此種跨欄位語義重疊與結構冗餘問題，下列哪一種資料處理策略最合適且具實務可行性？","o":["利用資料探勘技術自動選擇資料集中對目標變數最敏感的欄位，其他欄位捨棄即可，避免過度清理干擾原始結構","保留所有相似欄位，交由高階模型(如 Gradient Boosting 或 Deep Learning)自動學習特徵關聯，無需手動處理","建立欄位命名標準，統一金額單位與格式，進行欄位正規化與語義合併，減少重複資訊影響特徵重要性估計","將重複欄位視為類別欄位，進行 One-hot 編碼(One-hot encoding)後輸入模型，以避免數值誤導模型學習過程"],"a":2,"e":"多個欄位語義重疊但單位與格式不一，應先建立命名標準、統一單位格式，再進行語義合併，從資料治理根本消除冗餘，也避免特徵重要性被分散。自動挑欄位而捨棄其他，可能丟失資訊且未解決不一致；全交給模型學習會造成共線性並影響可解釋性；把數值金額做 One-hot 編碼則完全不合理。","src":"114年第四次 第34題"},{"id":"ai-114-4-35","s":"ai","q":"某大型零售企業準備將商品推薦模型上線，專案團隊在檢視訓練資料時，發現部分商品類別(例如高價商品)樣本數量極少，而多數樣本集中於低價商品。若此不平衡問題未妥善處理，下列何種狀況最可能在實際推薦結果中發生？","o":["模型在預測時傾向輸出稀有類別，導致雖能捕捉到少數樣本，但精確率(Precision)顯著下降","模型由於類別分布不均，難以建立有效的線性分離邊界，進而無法收斂","模型過度聚焦於稀有類別樣本，導致對多數類別的預測能力下降，整體效能受損","模型學到的決策邊界主要由多數類別主導，忽視了稀有類別，造成該類別的召回率(Recall)大幅降低"],"a":3,"e":"類別不平衡時，模型為降低整體損失會偏向多數類別，決策邊界由多數類別主導，稀有類別（高價商品）常被忽略，使其召回率大幅下降。模型實際上不會偏向輸出稀有類別，也不會過度聚焦稀有類別；類別不均通常也不會導致模型無法收斂，問題在於預測偏差。","src":"114年第四次 第35題"},{"id":"ai-114-4-36","s":"ai","q":"某電商資料團隊要協助行銷部門規劃再行銷策略。目前取得資料包含使用者點擊、購買紀錄、流量來源與轉換率。若資料團隊希望先進行探索性資料分析(EDA)，下列哪一項最符合 EDA 的做法？","o":["建立隨機森林模型，預測使用者是否會完成購買","使用 K-means 對使用者群進行分群並立即制定對應促銷策略","繪製各類流量來源對轉換率的關聯圖，尋找潛在關係","對不同購物路徑設定統計假設並進行雙樣本 t 檢定"],"a":2,"e":"探索性資料分析是在建模前透過統計摘要與視覺化了解資料、發現潛在關係，繪製流量來源與轉換率的關聯圖正屬於 EDA。建立隨機森林預測購買屬於建模階段；用 K-means 分群並立即制定策略已超出探索範疇；設定假設進行 t 檢定屬驗證性分析，而非探索性分析。","src":"114年第四次 第36題"},{"id":"ai-114-4-37","s":"ai","q":"某金融科技公司在利用歷史交易資料建立風險控管模型時，嘗試推估整體詐騙交易比例。近期發現，樣本間存在明顯的時間序列相關性，導致模型在實際偵測新交易時誤判率升高。若希望同時改善詐騙比例推估的準確性並提升模型的穩健性，下列哪一種做法最為合適？","o":["擴充樣本數量，以涵蓋更多潛在的詐騙型態，但維持既有的隨機抽樣方式不變","採取時間序列敏感的抽樣策略，例如依據交易時間區間進行分層，以保存原始的時間結構特性","將資料完全隨機打散，以降低序列相關性對模型訓練造成的影響","在模型評估時，針對相鄰時間區段進行誤差合併，以便用整體估計方式修正詐騙比例"],"a":1,"e":"樣本具時間相關性時，依交易時間區間分層抽樣能保留時間結構，避免未來資訊滲入訓練、讓評估更貼近實際，同時提升比例推估準確性與模型穩健性。只增加樣本但維持隨機抽樣無法處理時序相關；完全打散資料會造成時間上的資料洩漏；合併相鄰區段誤差只是掩蓋問題，並非真正修正。","src":"114年第四次 第37題"},{"id":"ai-114-4-38","s":"ai","q":"某公司建置基於檢索增強生成(RAG)的知識查詢系統，需同時兼顧查詢效能與資料的即時更新。近期發現回應內容偶爾過時，且每次更新文件都需完整重建索引，導致系統在更新期間無法服務。若要解決此問題並提升整體穩健性，下列哪項做法最適合？","o":["調整生成模型的回應隨機性參數，以降低答案偏差並提升一致性","提升檢索與索引的運算效能，以縮短查詢與更新所需時間","採用索引的增量或分段更新方式，使新資料能即時納入而不需全部重建","建立常見問題的標準答案集，透過快速檢索回應以降低模型負擔"],"a":2,"e":"問題根源在於每次更新都要完整重建索引，改採增量或分段更新，只處理新增或異動文件，就能即時納入新資料且不中斷服務。調整生成隨機性無法解決內容過時；單純提升運算效能只是縮短重建時間，仍需全量重建；建立標準答案集無法涵蓋新文件，也未解決索引更新問題。","src":"114年第四次 第38題"},{"id":"ai-114-4-39","s":"ai","q":"某醫院計畫開發住院日數預測模型，以協助病房調度。多數病人的住院日數集中在 3–7 天，但仍有少數重症患者因治療需求而住院日數明顯偏長。醫院希望採用一種合適的評估方式，既能兼顧大部分病人的預測準確度，也能確保對重症個案的預測維持穩健。下列哪一種方法最符合此需求？","o":["在模型檢核時，同時呈現平均絕對誤差(MAE)與重症子群的誤差指標","僅針對一般病人樣本進行交叉驗證，以避免重症個案拉高誤差","將所有病人的住院日數進行標準化處理，以減少數值範圍差異的影響","只採用單一的整體決定係數 (R²) 作為模型優劣的判斷依據"],"a":0,"e":"同時呈現整體 MAE 與重症子群的誤差指標，既能評估大多數病人的預測準確度，又能監控長住院個案的表現，符合「兼顧多數且確保重症穩健」的需求。排除重症樣本會讓模型對重症失去評估依據；標準化只是資料前處理，並非評估方式；單一 R² 無法反映子群差異。","src":"114年第四次 第39題"},{"id":"ai-114-4-40","s":"ai","q":"關 於 監 督 式 學 習 ( Supervised Learning ) 與 非 監 督 式 學 習(Unsupervised Learning)的目標，下列敘述何者錯誤？\n1.非監督式學習的核心在於發掘資料內在結構，例如分群、關聯規則與降維，而不依賴外部標籤。\n2.監督式學習的典型應用為分類與迴歸，通常不適合應用於異常偵測任務。\n3.非監督式學習若搭配少量標註資料，即會完全轉化為監督式學習。\n4.監督式學習仰賴已標註的資料集，透過最小化輸出與真實標籤之間的差距，學習輸入與目標之間的對應函數。\n5.所有監督式學習任務都必須要有大量完整標註資料，否則無法進行任何有效的模型訓練。\n6.非監督式學習不需要目標變數，僅透過輸入資料本身的特徵分布進行模式學習。","o":["3、5、6","1、4、6","2、4、6","2、3、5"],"a":3,"e":"錯誤敘述為 2、3、5：監督式學習可用已標記的異常樣本做異常偵測，並非不適合；非監督式搭配少量標註資料會成為半監督式學習，不是「完全轉化」為監督式；監督式學習在資料有限時仍可藉遷移學習、資料增強等方式訓練，並非一定要大量完整標註。1、4、6 皆為正確描述。","src":"114年第四次 第40題"},{"id":"ai-114-4-41","s":"ai","q":"一家旅遊平台希望建立模型，預測顧客下次是否會再次透過該平台訂房。資料包含：顧客 ID、年齡、旅遊次數、平均花費金額、主要交通方式(火車/飛機/自駕/公車)、會員等級(普通/進階/白金)、是否為海外旅遊等。下列哪一種特徵工程方法最適合處理「主要交通方式」欄位？","o":["布林轉換(Boolean Conversion)","序數編碼(Ordinal Encoding)","數值標準化(Numerical Standardization)","One-hot 編碼(One-hot Encoding)"],"a":3,"e":"「主要交通方式」是無順序關係的名目類別，最適合 One-hot 編碼，把每種方式轉成獨立的 0/1 欄位，避免模型誤以為類別間有大小關係。序數編碼適用於有等級順序的欄位（如會員等級）；布林轉換只適用二元欄位（如是否海外旅遊）；數值標準化適用於連續數值欄位。","src":"114年第四次 第41題"},{"id":"ai-114-4-42","s":"ai","q":"一家跨國醫療研究機構希望利用各地醫院的病患資料，建立一個能夠預測疾病早期風險的機器學習模型。由於各國法規限制，病患的原始資料無法集中到單一伺服器。在此情境下，下列哪一種方法最能同時滿足「各醫院保留資料不外流」與「模型仍能跨院學習」的需求？","o":["資料匿名化(Data Anonymization)","差分隱私(Differential Privacy)","聯邦學習(Federated Learning)","交叉驗證(Cross-validation)"],"a":2,"e":"聯邦學習讓各醫院在本地訓練模型，只上傳模型參數或梯度彙整成共同模型，原始資料不必離開醫院，正好兼顧資料不外流與跨院學習。資料匿名化仍需把資料集中；差分隱私是加入雜訊保護個體隱私的技術，本身不解決資料無法集中的問題；交叉驗證只是模型評估方法。","src":"114年第四次 第42題"},{"id":"ai-114-4-43","s":"ai","q":"某公司欲建立員工離職風險預測模型，資料集中包含「年度績效分數」、「平均每月加班時數」、「年齡」等數值型特徵。由於各特徵的數值範圍差異極大(例如績效分數 1–5、加班時數 0–80、年齡 20–65)，若直接輸入至使用梯度下降的邏輯迴歸(Logistic Regression)模型，可能導致模型收斂緩慢或權重偏斜。為提升模型訓練效率與準確度，下列哪一種特徵工程方法最適合應用於這些數值特徵？","o":["布林轉換(Boolean Conversion)","時間序列分解(Time Series Decomposition)","One-hot 編碼(One-hot Encoding)","數值標準化(Numerical Standardization)"],"a":3,"e":"各數值特徵尺度差異很大時，梯度下降會因等高線狹長而收斂緩慢、權重偏斜；數值標準化（如 Z-score）把特徵轉為平均 0、標準差 1，使尺度一致，最能改善。布林轉換會損失數值資訊；時間序列分解用於拆解趨勢與季節性；One-hot 編碼適用於類別特徵而非連續數值。","src":"114年第四次 第43題"},{"id":"ai-114-4-44","s":"ai","q":"在機器學習中，「叢集(Clustering)」方法最典型的應用情境是下列何者？","o":["根據歷史交易紀錄與已標註的詐欺案例，訓練模型來偵測未來的詐欺交易","使用醫療數據與病患的診斷標籤，建立模型以預測病人是否罹患特定疾病","根據顧客的消費行為與特徵，將顧客自動劃分為數個群組，以便進行差異化行銷","透過大量已標註影像，訓練深度學習模型來辨識照片中的物件種類"],"a":2,"e":"叢集屬於非監督式學習，依資料相似度自動分群而不需標籤，「依消費行為把顧客分群做差異化行銷」是最典型應用。用已標註詐欺案例偵測詐欺、用診斷標籤預測疾病、用已標註影像辨識物件，三者都依賴標籤資料訓練，屬監督式分類任務。","src":"114年第四次 第44題"},{"id":"ai-114-4-45","s":"ai","q":"某醫院研究團隊蒐集了大量病患的「收縮壓」數據，經檢驗後顯示此數值大致呈現常態分布。在進行後續模型分析前，研究人員希望妥善處理可能存在的極端血壓數值。下列哪一種做法最為合適？","o":["將所有極端偏高或偏低的血壓數據直接刪除，以保留最具代表性的病患樣本","使用對數轉換(Log Transformation)，將數據壓縮至更接近常態，以降低極端值的影響","透過 Z 分數(Z-score)或標準差範圍檢測異常值，並依研究需求決定是否調整或移除","將檢測到的離群值以 Label Encoding 編碼，轉換為序號標籤以避免影響原始分布"],"a":2,"e":"資料近似常態時，以 Z 分數或標準差範圍（如 ±3 個標準差）檢測異常值是標準做法，再依研究需求與醫療合理性決定調整或移除。直接刪除所有極端值可能丟失真實的重要病例；對數轉換適用於右偏資料，已近常態的資料不需要；把離群值做 Label Encoding 毫無統計意義。","src":"114年第四次 第45題"},{"id":"ai-114-4-46","s":"ai","q":"某電商公司想預測用戶是否會購買特定商品，資料中包含多種用戶屬性與行為特徵。分析師希望選出對購買結果最有預測價值的特徵，以提升模型效能。下列哪一種描述最符合監督式特徵選擇(Supervised Feature Selection)的概念？","o":["根據特徵的整體分布、變異度或資訊量進行篩選，而不直接參考目標變數","評估每個特徵與目標變數之間的相關性，選擇對預測結果貢獻最大的特徵","使用模型評估特徵對預測結果的重要性，並保留對目標變數影響較大的欄位","將特徵透過降維方法(如 PCA)轉換為新特徵，再用於模型訓練"],"a":1,"e":"監督式特徵選擇的核心是「參考目標變數」，評估每個特徵與目標的相關性或關聯程度，挑出最具預測力者，這是最典型的定義（過濾法）。只看分布、變異度而不參考目標屬於非監督式特徵選擇；PCA 降維是轉換出新特徵的特徵萃取，且不參考目標變數。（註：利用模型評估特徵重要性屬嵌入法或包裝法，其實同樣是監督式特徵選擇，該選項也說得通，此題以最基本定義為準。）","src":"114年第四次 第46題"},{"id":"ai-114-4-47","s":"ai","q":"在訓練神經網路時，為了提升模型收斂速度與穩定性，避免梯度消失或梯度爆炸，下列哪一種做法最常被使用？","o":["對輸入資料進行隨機旋轉或水平翻轉，以增加資料多樣性","選用 ReLU 或其變體作為隱藏層的啟動函數，以改善梯度傳播","減少樣本量提升訓練速度","對目標變數或特徵進行標準化"],"a":1,"e":"Sigmoid、tanh 在輸入過大或過小時梯度趨近於零，深層網路易梯度消失；ReLU 在正區間梯度恆為 1，其變體（如 Leaky ReLU）也能改善負區間問題，是最常用的做法。旋轉、翻轉屬資料增強，用於提升泛化；減少樣本量會降低學習效果；標準化有助收斂，但不是針對梯度消失或爆炸最直接常用的手段。","src":"114年第四次 第47題"},{"id":"ai-114-4-48","s":"ai","q":"若希望檢視某一連續型數據的分布情形(如集中程度、偏態或是否呈現多峰)，下列哪一種應用情境最適合使用直方圖(Histogram) 來進行分析？","o":["探討顧客年齡資料的整體分布特徵，並檢視是否存在異常集中或分散現象","比較不同商品在各月份的銷售額變化趨勢，以觀察季節性波動","追蹤公司近一年營收的時間序列變化，以了解整體成長趨勢","檢視產品價格與月銷售量之間的關聯性，以評估是否具線性相關"],"a":0,"e":"直方圖把單一連續變數切成區間並計算次數，可看出集中程度、偏態與是否多峰，最適合檢視顧客年齡的整體分布。比較各月份銷售變化與追蹤營收時間序列，應使用折線圖或長條圖；檢視價格與銷售量是否線性相關，應使用散佈圖。","src":"114年第四次 第48題"},{"id":"ai-114-4-49","s":"ai","q":"下列何者並非我國數位發展部 AI 產品與評測中心在評估大型語言模型安全性時，所指出的常見使用指標？","o":["資料複雜性","事實正確性","偏見與歧視","惡意與濫用可能性"],"a":0,"e":"數位發展部 AI 評測中心評估大型語言模型安全性時，常見指標包含事實正確性（是否產生幻覺）、偏見與歧視、惡意與濫用可能性等，都直接關係到輸出內容的風險。「資料複雜性」描述的是資料本身的特性，並非評估模型安全性的指標，故為答案。","src":"114年第四次 第49題"},{"id":"ai-114-4-50","s":"ai","q":"某雲端服務公司計畫將大型語言模型部署於線上系統，並以批次推論(Batch Inference)方式處理每日上百萬筆用戶請求。專案團隊在評估可能遇到的挑戰時，下列哪一項通常不會被視為批次推論階段的主要難題？","o":["如何確保訓練語料的涵蓋性與標註品質，以避免模型偏差影響輸出","當批次規模增大時，如何降低推論延遲並保持即時回應能力","在推論過程中，有效管理與分配龐大的輸入資料量以避免資源壅塞","在叢集環境中精確安排推論任務，以提升 GPU/TPU 等硬體資源的利用率《以下空白》"],"a":0,"e":"批次推論是模型已訓練完成後的部署階段，主要難題在於推論延遲、大量輸入資料的管理分配，以及 GPU/TPU 叢集排程與資源利用率。「確保訓練語料的涵蓋性與標註品質」屬於訓練前的資料準備階段，不是批次推論階段要面對的挑戰，故為答案。","src":"114年第四次 第50題"},{"id":"ai-115-1-01","s":"ai","q":"下列何者不屬於資料整合(Data Integration)的主要目的？","o":["統一不同來源資料的格式與欄位定義，以確保分析一致性","識別並處理重複資料，避免影響模型訓練結果","整併多來源資料，以提升資料完整性與應用價值","依資料保存政策延長原始資料留存期限，以利未來可能的分析需求"],"a":3,"e":"資料整合的目的在於把多來源資料合併成一致可用的資料集，包括統一格式與欄位定義、識別處理重複資料、整併以提升完整性與應用價值。「依保存政策延長原始資料留存期限」屬於資料生命週期管理或資料保存政策的範疇，與整合無直接關係，故為答案。","src":"115年第一次 第1題"},{"id":"ai-115-1-02","s":"ai","q":"某智慧城市專案導入 AI 技術，以優化垃圾收集路線調度並即時監測空氣品質變化。系統需持續蒐集環境數據(如 PM2.5、氣體濃度)與設備狀態(如垃圾桶滿溢度)。下列何種技術最直接支援上述需求？","o":["專家系統(Expert System)","決策支援系統(Decision Support System)","啟發式決策引擎(Heuristic Decision Engine)","感知器網路(Sensor Network)"],"a":3,"e":"需求核心是「持續蒐集」PM2.5、氣體濃度與垃圾桶滿溢度等即時數據，最直接支援的是感測器網路，透過分散的感測節點連續回傳環境與設備狀態。專家系統以規則推理；決策支援系統與啟發式決策引擎著重分析與決策，都必須先有感測資料輸入，並非資料蒐集的直接技術。","src":"115年第一次 第2題"},{"id":"ai-115-1-03","s":"ai","q":"下列何者不符合非監督式學習(Unsupervised Learning)的典型特徵？","o":["模型可依據資料中的特徵相似性進行自動分群","訓練過程中不需仰賴事先定義的標籤資料","常用於探索資料的潛在結構或隱含模式","模型主要學習輸入特徵與既定目標標記之間的對應關係"],"a":3,"e":"「學習輸入特徵與既定目標標記之間的對應關係」是監督式學習的定義，不符合非監督式學習特徵，故為答案。非監督式學習不需事先定義標籤，常依特徵相似性自動分群，並用於探索資料的潛在結構或隱含模式，其餘三項都是它的典型特徵。","src":"115年第一次 第3題"},{"id":"ai-115-1-04","s":"ai","q":"某保險公司建立 AI 理賠金額預測模型。歷史理賠資料經檢定後呈近似常態分佈，但仍存在少數極端高額案件。資料科學團隊在不破壞整體分佈特性的前提下，規劃進行離群值處理。下列何者最不適當？","o":["依統計準則(如 Z-score 或 IQR)評估後，再決定是否調整或處理極端值","採用截尾(Trimming)處理極端值，以提升模型穩定性","使用 One-hot 編碼(One-hot Encoding)將離群值轉換為類別特徵以改善數值穩定性","結合領域知識評估其合理性，再決定保留或修正"],"a":2,"e":"One-hot 編碼是把類別特徵轉成 0/1 欄位的方法，用來處理連續的理賠金額離群值毫無意義，還會破壞數值關係，是最不適當的做法。依 Z-score 或 IQR 評估後再處理、以截尾處理極端值、結合領域知識判斷保留或修正，都是處理離群值的合理方法。","src":"115年第一次 第4題"},{"id":"ai-115-1-05","s":"ai","q":"某銀行建立 AI 詐欺交易偵測模型。歷史交易資料中，詐欺樣本比例極低，導致模型訓練時偏向預測為「正常交易」。資料科學團隊評估採用 SMOTE(Synthetic Minority Over-sampling Technique)改善訓練資料分佈。下列何者最符合 SMOTE技術的主要功能？","o":["透過隨機刪除部分正常交易資料，以降低類別失衡程度","依據少數類別樣本的特徵空間，合成產生新的少數類別樣本","調整模型的損失函數(Loss Function)權重，使誤判少數類別時的懲罰提高","以交叉驗證(Cross-validation)方式重新分割資料集，使各折資料類別比例一致"],"a":1,"e":"SMOTE 在少數類別樣本與其最近鄰之間的特徵空間做插值，合成新的少數類別樣本，以平衡類別比例。隨機刪除正常交易屬於欠抽樣；提高誤判少數類別的懲罰屬於成本敏感學習或類別權重調整；讓各折類別比例一致是分層交叉驗證，都不是 SMOTE 的功能。","src":"115年第一次 第5題"},{"id":"ai-115-1-06","s":"ai","q":"資料科學團隊在模型訓練前，需對數值特徵進行正規化(Normalization)或標準化(Standardization)。為確保模型評估結果具真實性並避免資料洩漏(Data Leakage)，下列何者為最適當的作法？","o":["於資料分割前，先對完整資料集計算統計量並進行標準化處理","先分割訓練資料(Training Data)和測試資料(Test Data)，並各自獨立計算統計量後進行標準化","先分割訓練資料(Training Data)和測試資料(Test Data)，僅以訓練資料計算統計量，再套用至測試資料","僅對訓練資料(Training Data)進行標準化處理，測試資料(Test Data)保持原始數值"],"a":2,"e":"為避免資料洩漏，應先切分資料，只用訓練資料計算平均數、標準差等統計量，再以同一組參數轉換測試資料，模擬真實上線時看不到未來資料的情境。分割前就對全資料標準化會讓測試資訊洩漏；測試資料各自計算統計量會造成轉換基準不一致；測試資料不處理則尺度與訓練資料不符。","src":"115年第一次 第6題"},{"id":"ai-115-1-07","s":"ai","q":"某電信公司建立機器學習模型預測用戶流失風險。資料中包含多個類別型特徵(Categorical Features)，例如「資費方案類型」與「客戶地區」。為使模型能有效使用這些特徵，下列何者最直接用於將類別型特徵轉換為模型可處理的數值格式？","o":["資料分群(Data Clustering)","特徵交叉(Feature Cross)","One-hot 編碼(One-hot Encoding)","寬深模型(Wide and Deep)"],"a":2,"e":"One-hot 編碼把每個類別值轉成獨立的 0/1 欄位，是將資費方案、地區等名目類別特徵轉為數值格式最直接的方法。資料分群是非監督式學習方法；特徵交叉是組合多個特徵產生新特徵，通常在編碼之後使用；寬深模型是模型架構，並非轉換類別特徵的方法。","src":"115年第一次 第7題"},{"id":"ai-115-1-08","s":"ai","q":"某零售企業在建置機器學習模型預測顧客購買機率時， 資料同時包含大量稀疏類別特徵與數值型特徵。 團隊希望模型既能學習過去已出現的特徵組合規律，也能對未出現的特徵組合做出合理預測。 下列哪一種模型架構最適合此類需求？","o":["線性迴歸(Linear Regression)","決策樹(Decision Tree)","支援向量機(Support Vector Machine, SVM)","寬深模型(Wide and Deep)"],"a":3,"e":"寬深模型結合「寬」的線性部分（擅長記憶已出現的稀疏特徵組合）與「深」的神經網路部分（透過嵌入向量泛化到未見過的組合），正好兼顧記憶與泛化，常用於推薦系統。線性迴歸、決策樹與 SVM 都沒有同時針對大量稀疏特徵記憶與泛化的設計。","src":"115年第一次 第8題"},{"id":"ai-115-1-09","s":"ai","q":"某影音串流平台建立神經網路模型，用於預測使用者最可能感興趣的影片類型。模型輸出層需將結果轉換為各類別的機率分佈，以便系統依機率高低推薦內容。下列哪一種函數最適合用於模型輸出層？","o":["Softmax 函數(Softmax Function)","Sigmoid 函數(Sigmoid Function)","線性函數(Linear Function)","ReLU 函數(Rectified Linear Unit Function)"],"a":0,"e":"多類別分類的輸出層使用 Softmax，可把各類別分數轉成總和為 1 的機率分布，便於依機率排序推薦。Sigmoid 適用二元或多標籤分類，各輸出獨立、總和不為 1；線性函數常用於迴歸輸出；ReLU 多用於隱藏層，輸出不是機率。","src":"115年第一次 第9題"},{"id":"ai-115-1-10","s":"ai","q":"某設計公司導入生成式 AI(Generative AI)工具，用於自動產生產品概念圖與風格草圖。為了讓系統能依據既有圖像資料產生具有變化且風格一致的新圖像，模型必須具備學習資料特性並生成新樣本的能力。下列哪一種模型技術或方法最符合上述需求？","o":["隱變量自編碼器(Variational Autoencoder, VAE)","隨機森林(Random Forest)","K-近鄰演算法(K-Nearest Neighbors, KNN)","貝氏網路(Bayesian Network)"],"a":0,"e":"變分自編碼器學習資料在潛在空間中的機率分布，從潛在空間取樣即可生成具變化又保有原資料風格的新圖像，屬生成式模型。隨機森林與 KNN 是分類或迴歸用的鑑別式方法，無法生成新圖像；貝氏網路雖能表達變數間的機率關係，但不適合生成高維度的影像。","src":"115年第一次 第10題"},{"id":"ai-115-1-11","s":"ai","q":"某企業導入生成式 AI(Generative AI)系統自動產出會議摘要，並規劃額外建置一套 AI 系統，用於評估摘要內容的正確性與完整性。下列何者為此 AI 系統的核心目標？","o":["自動新增專業名詞與技術指標","判斷摘要是否遺漏關鍵資訊或出現語意錯誤","調整語音轉文字結果","自動標註摘要的關鍵字與主題標籤"],"a":1,"e":"評估摘要「正確性與完整性」的 AI 系統，核心任務就是判斷摘要是否遺漏關鍵資訊或出現語意錯誤（如幻覺、曲解原意）。自動新增專業名詞屬內容生成或改寫；調整語音轉文字結果屬前處理；自動標註關鍵字與主題標籤屬資訊萃取，都不是評估正確性與完整性的核心目標。","src":"115年第一次 第11題"},{"id":"ai-115-1-12","s":"ai","q":"ChatGPT、Gemini 等對話型生成式 AI 工具所依據的基礎模型技術，下列何者正確？","o":["決策樹(Decision Tree)","大型語言模型(Large Language Model, LLM)","生成對抗網路(Generative Adversarial Network, GAN)","圖卷積網路(Graph Convolutional Network, GCN)"],"a":1,"e":"ChatGPT、Gemini 等對話型工具的基礎是大型語言模型，以 Transformer 架構在大量文本上預訓練，再經指令微調與人類反饋強化學習而成。決策樹是傳統分類模型；GAN 主要用於影像生成；圖卷積網路用於處理圖結構資料，都不是對話式生成 AI 的基礎技術。","src":"115年第一次 第12題"},{"id":"ai-115-1-13","s":"ai","q":"根據《金融機構運用人工智慧技術作業規範》，金融機構於使用人工智慧提供金融服務並直接與消費者互動時，下列何者非必要揭露之資訊？","o":["該服務之 AI 模型原始程式碼","服務適用對象與用途範圍","該服務是否為 AI 自動完成","該服務是否提供替代方案"],"a":0,"e":"作業規範要求直接面對消費者的 AI 服務應揭露是否由 AI 自動完成、適用對象與用途範圍，以及是否提供替代方案等，以保障消費者知情權。AI 模型原始程式碼屬營業秘密與資安敏感資訊，消費者也難以理解，並非必要揭露事項，故為答案。","src":"115年第一次 第13題"},{"id":"ai-115-1-14","s":"ai","q":"下列哪一項「AI 技術應用與產業領域」的對應最為恰當？","o":["利用 AI 分析商場顧客購買紀錄以預測股票市場波動—智慧交通","使用 AI 進行設備故障預測與預防性維護—智慧製造","以 AI 模型融合即時氣象資料與乘客消費行為特徵，推薦會員升級優惠方案—智慧醫療","利用 AI 分析社群媒體互動以提升臨床診斷準確度—金融服務業"],"a":1,"e":"設備故障預測與預防性維護是智慧製造的典型應用，透過感測資料預先發現異常、減少停機。分析商場購買紀錄預測股市與智慧交通無關；依氣象與消費行為推薦會員升級方案較屬零售或行銷，不是智慧醫療；分析社群互動提升臨床診斷屬醫療，而非金融服務業。","src":"115年第一次 第14題"},{"id":"ai-115-1-15","s":"ai","q":"在資料處理中，下列何者屬於「結構化數據」的例子？","o":["儲存在 MySQL 資料庫中的訂單記錄","以 JSON 格式儲存的商品訂單資訊","用 XML 標註的產品目錄","儲存在純文字檔案中的客服對話紀錄"],"a":0,"e":"結構化資料具固定欄位與資料型別，可存放在關聯式資料表中，MySQL 資料庫的訂單記錄就是典型例子。JSON 與 XML 有標籤或鍵值結構但欄位彈性，屬半結構化資料；純文字客服對話紀錄沒有固定格式，屬非結構化資料。","src":"115年第一次 第15題"},{"id":"ai-115-1-16","s":"ai","q":"關於敘述性統計指標，下列敘述何者最為正確？","o":["中位數(Median)能有效反映極端值對資料分佈的影響","標準差(Standard Deviation)越大，代表資料越集中","百分位數(Percentile)主要用於衡量資料在整體分布中的相對位置","平均值(Mean)適合描述偏態且包含離群值(Outliers)的資料"],"a":2,"e":"百分位數表示某數值在整體資料中的相對位置，例如第 90 百分位代表有 90% 的資料小於或等於它，敘述正確。中位數的特性是「不受」極端值影響；標準差越大代表資料越分散而非越集中；平均值易被離群值拉偏，偏態資料應改用中位數描述。","src":"115年第一次 第16題"},{"id":"ai-115-1-17","s":"ai","q":"某企業資料分析人員需針對不同型態的數據選擇合適的視覺化工具。下列哪一種情境最適合使用直方圖(Histogram)？","o":["檢視顧客年齡資料在不同區間的集中情形","分析產品售價與銷售量之間的關聯程度","比較各產品類別的年度銷售總額","在地圖上標示各縣市加盟店的地理分布位置"],"a":0,"e":"直方圖把連續變數切成區間並統計次數，最適合檢視顧客年齡在不同區間的集中情形。分析售價與銷量的關聯應使用散佈圖；比較各產品類別的年度銷售總額應使用長條圖；呈現各縣市加盟店的地理分布則應使用地圖類視覺化。","src":"115年第一次 第17題"},{"id":"ai-115-1-18","s":"ai","q":"某電商平台工程師需在已排序的價格清單中，快速定位指定價格是否存在，給定排序後陣列：arr = [3, 8, 14, 19, 21, 27, 33, 45, 52]。若搜尋目標值為 27，且採用標準二分搜尋(Binary Search)流程(每次比較後排除中位數)，請問最多需要比較幾次即可找到目標？","o":["2 次","3 次","4 次","5 次"],"a":1,"e":"陣列共 9 筆（索引 0–8）。第 1 次取中間索引 4，值為 21，27 較大，往右找索引 5–8；第 2 次取索引 6，值為 33，27 較小，縮小到索引 5；第 3 次取索引 5，值為 27，找到。因此共需 3 次比較，2 次不足以找到，4 次、5 次則多於實際所需。","src":"115年第一次 第18題"},{"id":"ai-115-1-19","s":"ai","q":"某物流公司導入強化式學習(Reinforcement Learning)優化車隊調度。模型在系統運行過程中，會依據不同配送狀態動態調整行動選擇方式，使決策結果逐步朝較佳績效收斂。上述模型在學習過程中的調整行為，最符合下列哪一項強化式學習核心機制？","o":["調整策略函數以改變行動選擇機率","更新訓練資料分布以降低模型偏差","重新分群狀態資料以識別決策類型","建立正確決策標籤進行誤差修正"],"a":0,"e":"強化式學習透過與環境互動獲得獎勵，持續調整策略函數，改變在各狀態下選擇各行動的機率，使累積報酬最大化，這正是「動態調整行動選擇方式」的核心機制。更新訓練資料分布、重新分群狀態資料、建立正確決策標籤做誤差修正，分別屬資料處理、非監督式與監督式學習的概念。","src":"115年第一次 第19題"},{"id":"ai-115-1-20","s":"ai","q":"某團隊訓練影像分類模型，發現模型在訓練資料上的準確率達 98%，但在測試資料上僅有 72%。若團隊希望提升模型對新資料的適應能力，並增加訓練資料的多樣性，下列何者最適合？","o":["增加模型的深度與參數量，使模型學習更多細節","對訓練影像進行旋轉、翻轉等隨機變化","提高訓練速度，使模型更快完成學習","僅保留模型表現較好的訓練資料"],"a":1,"e":"訓練 98%、測試 72% 是典型的過度擬合。對訓練影像做旋轉、翻轉等資料增強，可增加資料多樣性、提升模型對新資料的泛化能力，完全符合需求。增加深度與參數量會讓過度擬合更嚴重；提高訓練速度與泛化無關；只保留表現好的資料會降低多樣性，使問題惡化。","src":"115年第一次 第20題"},{"id":"ai-115-1-21","s":"ai","q":"某時尚品牌導入生成式 AI(Generative AI)技術，建立服裝設計輔助系統。系統需根據設計師輸入的風格條件，自動產生具有高度視覺品質、細節穩定且風格變化自然的服裝草圖。團隊特別重視生成結果的穩定性與多樣性控制能力。在此需求下，下列哪一種模型技術或方法較為適合？","o":["支援向量機(Support Vector Machine, SVM)","生成對抗網路(Generative Adversarial Network, GAN)","決策樹(Decision Tree)","擴散模型(Diffusion Model)"],"a":3,"e":"擴散模型透過逐步加噪再學習去噪的過程生成影像，訓練穩定、細節品質高、多樣性佳，也容易用文字或風格條件控制生成，最符合需求。GAN 雖能生成高品質影像，但訓練不穩定，且容易發生模式崩潰使多樣性不足；SVM 與決策樹是鑑別式模型，無法生成影像。","src":"115年第一次 第21題"},{"id":"ai-115-1-22","s":"ai","q":"某製造業工廠規劃導入 AI 監控系統，持續分析設備感測數據(如溫度、震動與壓力)。系統需能在缺乏完整異常標註資料的情況下，辨識與一般運作型態顯著不同的狀態，並發出預警。在此需求下，下列何種技術較為適合？","o":["使用支援向量機(Support Vector Machine, SVM)建立異常分類模型","以決策樹(Decision Tree)學習異常類型的判斷規則","採用變分自編碼器(Variational Autoencoder, VAE)學習正常資料分佈","使用生成對抗網路(Generative Adversarial Network, GAN)直接預測異常標籤"],"a":2,"e":"缺乏完整異常標註時，可用變分自編碼器只學習正常資料的分布，遇到重建誤差或機率顯著偏離的樣本即判定為異常，屬於非監督式異常偵測。以 SVM 或決策樹建立異常分類模型、學習異常判斷規則，都需要足夠的異常標註資料；GAN 是生成模型，本身不會「直接預測異常標籤」。","src":"115年第一次 第22題"},{"id":"ai-115-1-23","s":"ai","q":"在 AI 推論服務架構設計中，「批次推論(Batch Inference)」與「即時推論(Real-time Inference)」常依任務特性選擇不同機制。下列關於兩者特性的敘述何者最正確？","o":["批次推論通常以同步請求方式回傳結果，以確保資料一致性；即時推論則多採非同步機制以提升系統吞吐量(Throughput)","批次推論多用於延遲容忍度較高的大規模資料處理，通常以吞吐量(Throughput)最佳化為優先；即時推論則著重於請求回應時間的穩定性與低延遲特性","批次推論因計算資源需求高，僅適用於影像類模型；即時推論則主要應用於結構化資料模型","即時推論為確保回應速度，通常限制為單筆資料輸入；批次推論則可支援同步多筆資料即時回傳"],"a":1,"e":"批次推論適合延遲容忍度高的大量資料處理（如每日報表），重視吞吐量；即時推論則重視每個請求的低延遲與回應穩定。實際上批次推論多為非同步、即時推論多為同步，與「批次同步、即時非同步」的說法相反；兩者都不限定特定資料類型；即時推論也可接受小批量輸入，並非限單筆。","src":"115年第一次 第23題"},{"id":"ai-115-1-24","s":"ai","q":"某企業導入大型語言模型作為客服助理。模型已具備穩定語言能力，但在回覆偏好一致性與組織規範遵循方面仍需優化，團隊因此規劃導入人類反饋強化學習(RLHF)流程，下列何者最不屬於 RLHF 階段的典型技術活動？","o":["透過人工評估方式建立偏好資料，使模型的不同候選輸出可反映人類主觀品質差異","訓練一個能依據人類偏好判斷輸出品質的模型，作為模型優化過程中的回饋依據","依據品質評估結果，調整模型生成策略，使其輸出更符合偏好導向的行為表現","以未標註語料為主進行長週期表示學習訓練，以提升模型基礎語言建模能力"],"a":3,"e":"RLHF 包含三項典型活動：人工比較候選輸出建立偏好資料、訓練獎勵模型反映人類偏好、再以強化學習（如 PPO）依獎勵調整生成策略。「以未標註語料進行長週期表示學習」是提升基礎語言能力的預訓練階段，不屬 RLHF，故為答案。","src":"115年第一次 第24題"},{"id":"ai-115-1-25","s":"ai","q":"在大型語言模型(LLM)的推論服務中，常透過請求批次處理(Batching)來提升系統效能。關於批次處理(Batching)機制的影響，下列敘述何者最正確？","o":["Batching 可提升加速器資源使用效率並增加整體吞吐量(Throughput)，但在部分情境下可能對單筆請求延遲造成影響","Batching 主要用於加快單筆請求回應時間","Batching 的效益主要來自降低記憶體使用量，對於吞吐量(Throughput)與延遲表現影響有限","Batching 在低併發(Concurrency)請求下，仍能明顯提升系統效能"],"a":0,"e":"批次處理把多個請求合併計算，可提升 GPU 等加速器的使用率與整體吞吐量，但請求需等待湊批，可能增加單筆延遲，敘述最正確。批次處理的目的不是加快單筆回應；其效益來自提升平行運算效率，而非降低記憶體用量（批次越大反而越吃記憶體）；低併發時難以湊批，效益有限。","src":"115年第一次 第25題"},{"id":"ai-115-1-26","s":"ai","q":"在可解釋 AI(Explainable AI, XAI) 的分類架構中，LIME(Local Interpretable Model-agnostic Explanations)屬於哪一類解釋技術？","o":["內建可解釋模型(Intrinsic Interpretability)：模型本身具有透明的決策結構","對話式解釋系統(Conversational AI Explainer)：透過互動對話提供模型解釋","後處理模型解釋(post-hoc)：對已訓練模型提供外部解釋","代理模型技術(Surrogate Model)：訓練另一個簡單模型來完全取代原黑盒模型進行推論"],"a":2,"e":"LIME 在模型訓練完成後，從外部對個別預測進行解釋，且不限模型類型，屬於後處理（post-hoc）解釋技術。內建可解釋模型指決策樹、線性模型等本身透明的模型；LIME 並非對話式解釋系統；它雖使用局部代理模型，但只是局部近似解釋，不會「完全取代」原黑盒模型進行推論。","src":"115年第一次 第26題"},{"id":"ai-115-1-27","s":"ai","q":"SHAP(SHapley Additive exPlanations)值常用於分析機器學習模型的輸出行為。下列何者最符合 SHAP 值所提供的資訊？","o":["模型在訓練過程中，各特徵對損失函數收斂速度的影響程度","依據特徵對模型整體準確率的影響，自動篩除低重要性變數","在單一預測結果中，各輸入特徵對最終輸出所產生的貢獻分配","透過調整特徵權重，使模型在推論階段降低計算複雜度"],"a":2,"e":"SHAP 以賽局理論的 Shapley 值為基礎，把單一預測結果與基準值的差距，公平分配給各輸入特徵，顯示每個特徵貢獻多少、方向為正或負，也可彙總成整體重要性。它不分析損失函數收斂速度；本身不會自動篩除變數；也與降低推論計算複雜度無關。","src":"115年第一次 第27題"},{"id":"ai-115-1-28","s":"ai","q":"在金融業導入 AI 模型與可解釋性技術時，反事實解釋(Counterfactual Explanation)最符合下列哪一種應用？","o":["分析整體客戶群的信用風險分布，以預測未來違約率趨勢","回溯歷史呆帳案例，辨識造成違約的主要影響因素","分析在模型不變的前提下，客戶申請資料變動對授信決策結果的影響","依據客戶輪廓與行為資料，推薦最適合的金融商品以提升交叉銷售"],"a":2,"e":"反事實解釋回答「若某些條件改變，結果會如何不同」，例如收入提高多少即可通過授信，正是在模型不變的前提下，分析申請資料變動對決策結果的影響。分析整體信用風險分布屬風險建模；回溯呆帳案例找主因屬歸因分析；推薦金融商品屬推薦系統，都不是反事實解釋。","src":"115年第一次 第28題"},{"id":"ai-115-1-29","s":"ai","q":"在深度學習模型的分析與驗證過程中，研究人員有時會利用「顯著性圖(Saliency Map)」來輔助理解模型行為。下列何者最符合此技術的主要用途？","o":["量化各輸入特徵對模型整體預測準確度的平均影響程度","標示輸入資料中對單一預測結果影響較大的區域或部分","評估在不同模型參數設定下，預測結果的穩定性變化","比較不同模型架構在測試資料上的泛化能力差異"],"a":1,"e":"顯著性圖計算輸出對輸入各部分的梯度，標示影像或輸入中對「單一預測結果」影響最大的區域，用來檢查模型是否關注正確特徵。量化特徵對整體準確度的平均影響屬全域特徵重要性；評估不同參數下預測穩定性屬敏感度分析；比較不同架構泛化能力屬模型評估。","src":"115年第一次 第29題"},{"id":"ai-115-1-30","s":"ai","q":"某商業銀行想建立洗錢行為檢測系統，擁有過去 5 年的交易記錄，其中包含已確認的洗錢案例(標記為「異常」)和正常交易(標記為「正常」)。銀行希望系統能自動識別新交易是否為洗錢行為，請問使用下列哪一種機器學習方法最為適合？","o":["監督式學習的分類問題","非監督式學習的分群問題","強化式學習","非監督式學習的關聯規則挖掘"],"a":0,"e":"銀行擁有已標記「異常／正常」的歷史交易，目標是判定新交易屬於哪一類，屬監督式學習的二元分類問題。非監督式分群不使用既有標籤，無法善用已確認案例；強化式學習需要與環境互動取得獎勵；關聯規則挖掘用於找出項目間共同出現的規律，並非分類判定。","src":"115年第一次 第30題"},{"id":"ai-115-1-31","s":"ai","q":"某農場收集了大量作物葉片影像，但只有 30%的影像有病害類別標註，其餘 70%的影像沒有任何標籤。農場希望充分利用所有資料來訓練病害識別模型。這種情況最適合使用哪一種學習方法？","o":["半監督式學習(Semi-supervised Learning)","監督式學習(Supervised Learning)","非監督式學習(Unsupervised Learning)","強化式學習(Reinforcement Learning)"],"a":0,"e":"只有少部分資料有標註、大部分無標籤，又希望充分利用全部資料，正是半監督式學習的典型情境，例如以偽標籤或一致性正則化善用未標註影像。純監督式學習只能用 30% 的標註資料；純非監督式學習無法學到病害類別；強化式學習需要環境互動與獎勵，不適用此情境。","src":"115年第一次 第31題"},{"id":"ai-115-1-32","s":"ai","q":"某環保局想建立 AI 系統監測空氣品質，透過分析監測站攝影機拍攝的影像來識別煙霧。系統需要在影像中找出煙霧區域並標示其位置和範圍。這個應用主要屬於電腦視覺的哪個技術領域？","o":["影像分類，判斷影像中是否有煙霧","物件偵測，找出煙霧位置並用方框標示","影像分割，精確標示出煙霧的像素區域","人臉辨識，識別煙霧來源"],"a":2,"e":"煙霧形狀不規則、邊界模糊，要標示其位置與「範圍」，以像素層級標出煙霧區域的影像分割最能精確呈現。影像分類只判斷有無煙霧，不提供位置；人臉辨識與煙霧無關。（註：物件偵測以方框標示亦能提供位置與大致範圍，題幹未明確要求像素級精度，與影像分割之間存在一定爭議。）","src":"115年第一次 第32題"},{"id":"ai-115-1-33","s":"ai","q":"某公車系統想預測各站點的到站時間，需要考慮歷史班次資料、即時路況、天氣等因素。由於路況變化複雜，傳統循環神經網路(Recurrent Neural Network, RNN)在建模時可能難以保留較早期的重要資訊。下列哪種架構最能解決這個問題？","o":["卷積神經網路(Convolutional Neural Network, CNN)，利用卷積層捕捉局部特徵","自編碼器(Autoencoder, AE)，先進行資料壓縮再重建","全連接神經網路(Fully Connected Neural Network, FCNN)，增加隱藏層數量","長短期記憶網路(Long Short-Term Memory, LSTM)，改善 RNN 的長期記憶問題"],"a":3,"e":"LSTM 透過輸入閘、遺忘閘與輸出閘控制記憶單元的資訊保留與更新，能緩解 RNN 的梯度消失，保留較早期的重要資訊，適合處理到站時間這類長期依賴的序列預測。CNN 擅長捕捉局部特徵；自編碼器用於壓縮與重建；全連接網路缺乏時間序列記憶機制，增加層數也無法解決問題。","src":"115年第一次 第33題"},{"id":"ai-115-1-34","s":"ai","q":"某保險公司每月處理約 50 萬筆理賠申請，希望建立 AI 系統自動識別可疑的詐欺案件。由於公司內部缺乏 AI 專業人員，且需要快速上線驗證效果，IT 資訊主管正在評估不同的 AI 平台解決方案。在去識別化個人隱私資料後，下列哪一種平台類型最適合該公司的需求？","o":["從零開始建立深度學習框架並自行訓練模型","採用開源機器學習框架進行客製化模型開發","使用雲端 AutoML 平台進行自動化模型訓練","購買現成的詐欺偵測軟體套件直接部署"],"a":2,"e":"公司缺乏 AI 專業人員、又需快速上線驗證，雲端 AutoML 平台能自動完成特徵處理、模型選擇與調參，以自家理賠資料快速建模，門檻低且具彈性。從零建立框架或用開源框架客製開發，都需要專業人力與較長時間；現成套件雖能快速部署，但未必貼合公司資料與詐欺型態，彈性與準確度有限。","src":"115年第一次 第34題"},{"id":"ai-115-1-35","s":"ai","q":"某市政府規劃釋出市民用電資料供學術研究使用，資料內容包含用電紀錄與部分人口統計欄位。考量資料可能涉及可識別個人之資訊，且須符合個人資料保護相關規範，下列哪一種資料處理方式最為適當？","o":["提供完整資料集並透過合約約定研究用途與保密責任","僅保留用電數值資料，移除所有其他欄位以避免識別風險","對具識別風險的資料欄位進行轉換處理，並移除直接識別資訊","僅將資料加密後提供，確保資料在傳輸過程中的安全性"],"a":2,"e":"釋出含個資的資料應進行去識別化：移除姓名、身分證號等直接識別資訊，並對具間接識別風險的欄位做概化、遮蔽等轉換，兼顧研究價值與個資保護。完整提供只靠合約仍有外洩與再識別風險；移除所有其他欄位會喪失研究價值；加密只保護傳輸過程，解密後仍可識別個人。","src":"115年第一次 第35題"},{"id":"ai-115-1-36","s":"ai","q":"某電子製造公司建置 AI 視覺檢測系統，用於辨識 PCB 電路板製程缺陷。系統在影像判讀任務上表現穩定，但其模型設計與訓練目標皆侷限於特定應用範圍，無法直接遷移至其他營運決策任務。依人工智慧能力範疇分類，下列何者最符合該系統特性？","o":["弱 AI(Weak AI/Narrow AI)","強 AI(Strong AI)","通用人工智慧(Artificial General Intelligence, AGI)","超級人工智慧(Artificial Superintelligence, ASI)"],"a":0,"e":"系統只能執行 PCB 缺陷辨識這類特定任務，無法遷移到其他決策，正是弱 AI（狹義 AI）的特徵，也是目前絕大多數 AI 應用的型態。強 AI 與通用人工智慧指具備類似人類、可跨領域學習與推理的通用智慧；超級人工智慧則是全面超越人類的假想階段，都不符合此系統。","src":"115年第一次 第36題"},{"id":"ai-115-1-37","s":"ai","q":"某紡織製造公司導入 AI 系統進行布料瑕疵檢測，每天需處理來自 30 條產線的影像資料，包括高解析度照片、感測器數值、生產參數記錄等多種格式。該公司收集的資料量從每日 2GB 增長至 50GB，且需在布料離開產線前的 3 秒內完成瑕疵判定。近期團隊發現系統在尖峰時段容易出現判定延遲，影響製程節奏。若要優先改善此問題，下列哪一種做法最適合？","o":["擴充資料儲存容量，以因應長期資料累積需求","強化即時資料處理與推論計算資源配置，以降低延遲風險","調整資料格式標準，以降低跨來源整合複雜度","增加資料驗證與清理機制，以提升資料品質穩定性"],"a":1,"e":"問題是尖峰時段判定延遲、必須在 3 秒內完成，屬於即時處理效能問題，應優先強化即時資料處理與推論的運算資源（如邊緣運算、GPU 擴充）。擴充儲存容量解決的是長期累積；統一資料格式降低整合複雜度；加強資料驗證清理提升品質，都無法直接解決即時延遲。","src":"115年第一次 第37題"},{"id":"ai-115-1-38","s":"ai","q":"某果園管理公司計畫導入 AI 系統協助農民判斷蘋果成熟度，透過分析果實特徵資訊，評估成熟狀態並自動判斷採收時機。根據 AI 應用領域的分類，這個系統主要屬於哪一個應用領域？","o":["自然語言處理(Natural Language Processing)","電腦視覺(Computer Vision)","語音識別(Speech Recognition)","推薦系統(Recommendation System)"],"a":1,"e":"判斷蘋果成熟度主要依據果實顏色、大小、外觀紋理等視覺特徵，通常以影像分析完成，屬電腦視覺領域。自然語言處理處理文字語言；語音識別把聲音轉成文字；推薦系統依使用者偏好推薦內容，三者都與分析果實外觀判斷採收時機無關。","src":"115年第一次 第38題"},{"id":"ai-115-1-39","s":"ai","q":"某企業評估於不同業務場景導入機器學習技術。下列哪一項應用情境與機器學習類型的搭配最為適當？","o":["在醫療影像分析中，同時運用少量已標註資料與大量未標註影像進行模型訓練—監督式學習(Supervised Learning)","在智慧推薦系統中，利用顧客是否點擊的歷史標籤資料預測未來偏好—非監督式學習(Unsupervised Learning)","在詐欺交易分析中，模型透過錯誤判斷所產生的損失作為回饋訊號，持續調整策略—監督式學習(Supervised Learning)","在股價資料分析中，將歷史價格變動模式劃分為若干趨勢型態，且未使用人工標註—非監督式學習(Unsupervised Learning)"],"a":3,"e":"對歷史股價變動做型態分群且未使用人工標註，屬於非監督式學習，搭配正確。同時使用少量標註與大量未標註資料是半監督式而非監督式；利用「是否點擊」的歷史標籤預測偏好是監督式而非非監督式；以損失作為回饋訊號持續調整策略是強化式而非監督式學習。","src":"114年第四次 第13題、115年第一次 第39題"},{"id":"ai-115-1-40","s":"ai","q":"某製造業公司建置機器學習模型，用於預測產品是否為瑕疵品。實際生產資料中，瑕疵品比例極低，大多數樣本皆為正常品。模型測試時發現，即使模型多數預測為正常品，仍可獲得很高的整體準確率。在此情境下，若希望更有效衡量模型對瑕疵品的辨識能力，下列何者較適合作為主要評估指標？","o":["F1-score","均方誤差(Root Mean Squared Error, RMSE)","準確率(Accuracy)","判定係數(R², Coefficient of Determination)"],"a":0,"e":"瑕疵品極少時，即使全部預測為正常品，準確率仍會很高，無法反映辨識瑕疵的能力。F1-score 為精確率與召回率的調和平均，能聚焦少數類別的辨識表現，最適合作為主要指標。準確率正是本題的陷阱；RMSE 與 R² 都是迴歸指標，不適用於分類問題。","src":"115年第一次 第40題"},{"id":"ai-115-1-41","s":"ai","q":"在大型語言模型(LLM)的效能優化中，Flash Attention 常被用來改善 Transformer注意力機制的運算效率。關於 Flash Attention 的主要效益，下列敘述何者最正確？","o":["透過忽略影響較小的注意力權重，減少模型需要計算的關聯數量，以降低運算成本","透過調整注意力計算與資料處理方式，減少中間結果的儲存需求，進而改善速度與資源使用效率","透過增加注意力計算的並行程度，使模型可同時處理更多注意力頭部","透過將注意力結果暫存於高速快取記憶體，以避免重複計算造成延遲"],"a":1,"e":"Flash Attention 以分塊方式在 GPU 高速 SRAM 中計算注意力，不必把完整的 n×n 注意力矩陣寫回記憶體，減少讀寫，提升速度並降低記憶體用量。「忽略影響小的權重」是稀疏注意力；它不靠增加注意力頭的平行度；也不是靠暫存結果避免重複計算（反向傳播時反而重新計算）。","src":"115年第一次 第41題"},{"id":"ai-115-1-42","s":"ai","q":"某企業建置基於檢索增強生成(RAG)的法遵知識輔助系統，用於整合法規條文、內控制度與歷史函釋文件。系統運行後發現，每當法規更新或新增解釋文件時，需重新建立完整索引，導致更新期間系統暫停服務，且部分回應偶有引用舊版內容的情形。若希望在兼顧查詢效率的同時提升知識更新彈性與系統穩定性，下列何者最適合？","o":["提升模型推論資源配置，以維持高流量查詢時的回應效能","調整語言模型的輸出限制機制，以降低生成內容與法規不一致的風險","建立固定法規問答對照表，以規則化方式優先回應常見問題","導入可支援增量更新的索引管理方式，使異動文件可即時反映於檢索結果"],"a":3,"e":"根本問題在於每次異動都需完整重建索引，導入增量更新的索引管理，只處理新增或修改的文件，就能即時反映新法規，又不必停機重建。提升推論資源只改善查詢效能；調整輸出限制無法讓檢索取得新版內容；固定問答對照表難以涵蓋持續更新的法規，都無法解決索引更新的問題。","src":"115年第一次 第42題"},{"id":"ai-115-1-43","s":"ai","q":"關於機器學習不同的學習模式，下列敘述何者錯誤？\n1. 監督式學習(Supervised Learning)透過已標註資料學習輸入與目標之間的對應關係，常見任務包含分類與數值預測。\n2. 非監督式學習(Unsupervised Learning)雖不需標註資料，但通常需預先定義每筆資料的正確輸出類別以利模型收斂。\n3. 半監督式學習(Semi-supervised Learning)在訓練過程中僅利用未標註資料進行特徵學習，並不涉及標註資料。\n4. 自監督式學習(Self-supervised Learning)的訓練方式與監督式學習相同，皆需人工逐筆提供標註資料。\n5. 強化式學習(Reinforcement Learning)透過與環境互動並依據回饋訊號調整策略，以優化決策行為。\n6. 自監督式學習(Self-supervised Learning)通常利用資料本身產生訓練目標，以降低對人工標註資料的依賴。","o":["2、3、6","2、4、5","1、3、6","2、3、4"],"a":3,"e":"錯誤敘述為 2、3、4：非監督式學習本身就不需預先定義正確輸出類別；半監督式學習同時使用少量標註資料與大量未標註資料，並非只用未標註資料；自監督式學習由資料本身產生訓練目標，不需人工逐筆標註。1、5、6 均為正確描述。","src":"115年第一次 第43題"},{"id":"ai-115-1-44","s":"ai","q":"某零售業者建立顧客行為預測模型，資料集中包含「年消費金額」、「平均單筆交易金額」及「會員年資」等數值型特徵。資料分析顯示，部分金額特徵呈現高度偏態分布，少數樣本的數值顯著高於多數觀測值。為降低極端值對模型學習穩定性的影響，下列哪一種特徵工程方法最適合？","o":["對數轉換(Log Transformation)","區間化(Binning)","One-hot 編碼(One-hot Encoding)","隨機重抽樣(Random Resampling)"],"a":0,"e":"金額類特徵常呈右偏，對數轉換能壓縮大數值、拉近極端值與一般值的距離，使分布更接近對稱，降低極端值影響並保留數值順序。區間化雖可降低極端值影響，但會損失細節資訊；One-hot 編碼用於類別特徵；隨機重抽樣用於處理樣本或類別不平衡，不能改善單一特徵的偏態。","src":"115年第一次 第44題"},{"id":"ai-115-1-45","s":"ai","q":"某團隊訓練深層神經網路模型時，發現訓練誤差長時間幾乎未下降，模型參數更新幅度極小，呈現學習停滯現象。若研判問題與梯度傳遞效率有關，下列何者最適合的改善策略？","o":["延長模型訓練時間，使模型有更多機會調整參數","增加訓練樣本數量，以提升模型學習能力","調整模型中的啟動函數設定，以改善訓練過程的穩定性","簡化模型結構，以降低模型過度擬合的可能性"],"a":2,"e":"訓練誤差停滯、參數更新幅度極小，是梯度消失的典型症狀，常因使用 Sigmoid、tanh 等易飽和的啟動函數所致；改用 ReLU 等啟動函數可改善梯度傳遞。延長訓練時間無法解決梯度過小；增加樣本與梯度傳遞效率無關；簡化結構是針對過度擬合，而本題是學習停滯。","src":"115年第一次 第45題"},{"id":"ai-115-1-46","s":"ai","q":"某市政府建置城市治理資料平台，需整合交通車流偵測資料、路口監視器影像，以及民眾透過陳情系統提交的文字通報。由於各類資料格式、儲存方式與資料型態差異甚大，導致資料清理與整合成本顯著增加。就大數據特性而言，此專案最主要面臨下列哪一項挑戰？","o":["Volume","Velocity","Variety","Veracity"],"a":2,"e":"專案需整合車流數值、監視器影像與民眾陳情文字，涵蓋結構化、非結構化等多種格式與型態，這正是大數據「多樣性（Variety）」的挑戰。Volume 指資料量龐大；Velocity 指資料產生與處理的速度；Veracity 指資料的真實性與品質，都不是本題強調的格式差異問題。","src":"115年第一次 第46題"},{"id":"ai-115-1-47","s":"ai","q":"某企業規劃導入 AI 技術支援多項資料分析任務中，下列何種屬於結構化預測(Structured Prediction)問題？","o":["判斷一封電子郵件是否為垃圾郵件","預測未來一週的產品需求量","預測客戶是否可能流失","為語音內容轉換後的文字進行逐詞標註"],"a":3,"e":"結構化預測的輸出是彼此相依的結構（如序列、樹、圖），為語音轉文字後的內容逐詞標註，需考慮前後詞的關係，屬序列標註，是典型的結構化預測。判斷垃圾郵件與預測客戶流失是單一標籤的二元分類；預測產品需求量是單一數值的迴歸，輸出都不是結構。","src":"115年第一次 第47題"},{"id":"ai-115-1-48","s":"ai","q":"某物流公司想導入 AI 以提升營運效率，評估不同資料型態與模型架構。下列哪一種應用情境最適合採用卷積神經網路(Convolutional Neural Network, CNN)作為主要模型架構？","o":["依據包裹每日掃描紀錄的時間序列，預測下週各倉庫的進貨量波動","根據客服對話逐句內容的先後順序，判斷客訴是否可能升級為申訴案件","根據倉庫監視器影像，自動辨識貨架是否缺貨並標示缺貨區域位置","依據車隊 GPS 路徑點的連續軌跡，預測下一段可能行駛路線"],"a":2,"e":"CNN 擅長以卷積核擷取影像的空間局部特徵，辨識貨架影像是否缺貨並標示位置，屬影像辨識或物件偵測，最適合以 CNN 為主要架構。每日進貨量預測、客服對話先後順序判斷、GPS 連續軌跡預測，都是重視時間或順序依賴的序列資料，較適合 RNN、LSTM 或 Transformer。","src":"115年第一次 第48題"},{"id":"ai-115-1-49","s":"ai","q":"某 AI 科技公司在工業缺陷檢測領域已有成熟的辨識產品經驗。現欲與新客戶合作開發一項類似產品的表面瑕疵檢測系統，但因新產品量產不久，標註樣本極為稀少且專家標註成本高昂。在不大幅增加標註預算的前提下，下列哪一種做法最能利用該公司既有的技術優勢來提升模型表現？","o":["增加模型參數規模，使模型具備更強表達能力","透過資料增強(Data Augmentation)擴展影像變化，以提升模型穩定性","重新蒐集大量影像並進行完整人工標註","採用遷移學習(Transfer Learning)，利用既有預訓練模型進行調整"],"a":3,"e":"公司已有成熟的缺陷辨識模型，新任務類似但標註稀少，採遷移學習以既有預訓練模型為基礎，用少量新資料微調，最能發揮既有技術優勢並節省標註成本。增加參數規模在少樣本下易過度擬合；資料增強有幫助但未利用既有模型知識；重新大量標註則違反不增加預算的前提。","src":"115年第一次 第49題"},{"id":"ai-115-1-50","s":"ai","q":"某醫院使用機器學習模型篩檢癌症患者。模型預測結果會決定哪些病人需要進一步檢查。院方非常重視盡量找出所有可能的癌症患者，即希望降低漏診(Missed Diagnosis)風險，即便這可能增加一些誤判。下列哪一個評估指標最能反映模型找出癌症患者的能力？","o":["精準率(Precision)","召回率(Recall)","假陽性率(False Positive Rate)","ROC-AUC 曲線"],"a":1,"e":"召回率＝真陽性／（真陽性＋偽陰性），衡量實際患者中被模型找出的比例，最能反映降低漏診的能力。精準率衡量預測為陽性者中真正患病的比例，重點在減少誤判；假陽性率衡量誤報程度；ROC-AUC 是跨門檻的整體區辨力指標，都不直接反映找出所有患者的能力。","src":"115年第一次 第50題"},{"id":"ai-115-3-01","s":"ai","q":"某製造工廠計劃導入 AI 預測產線設備的故障風險。維護團隊整理了過去五年的設備運作資料，並由資深工程師逐一完成人工標註，將每筆資料標示為「正常運作」或「發生故障」。若要利用這批已完成標註的歷史資料訓練分類模型，下列哪一種機器學習方法最適合？","o":["監督式學習(Supervised Learning)","非監督式學習(Unsupervised Learning)","強化學習(Reinforcement Learning)","半監督式學習(Semi-supervised Learning)"],"a":0,"e":"資料已由工程師逐筆標註「正常／故障」，有明確的輸入與對應答案，正是監督式學習訓練分類模型的典型情境。非監督式學習用於無標籤資料的分群或探索；強化學習靠與環境互動的獎勵回饋學習策略；半監督式學習適用於僅少量資料有標註的情況，皆不如監督式學習貼切。","src":"115年第三次 第1題"},{"id":"ai-115-3-02","s":"ai","q":"某電商平台希望利用 AI 分析消費者行為。團隊取得過去會員交易資料，其中部分資料已標註「是否流失會員」，另一部分資料僅包含會員瀏覽、購買及搜尋紀錄，但未標註任何結果。下列何者最適合描述兩類資料的應用方式？","o":["已標註流失結果的資料適合用於監督式學習；未標註行為資料可用於非監督式學習探索消費族群特徵","已標註流失結果的資料適合用於非監督式學習；未標註行為資料需先人工分類才能進行監督式學習","兩類資料皆只能使用監督式學習，因企業應用皆需要明確預測結果","兩類資料皆屬生成式 AI 的訓練資料，因此無法用於機器學習模型"],"a":0,"e":"有「是否流失」標籤的資料可直接訓練監督式預測模型；沒有標籤的瀏覽、購買紀錄則適合用非監督式學習（如分群）探索消費族群特徵，兩者各取所長。把標註資料用於非監督、宣稱兩類都只能用監督式，或將其歸為生成式 AI 專用而無法用於機器學習，皆與資料特性不符。","src":"115年第三次 第2題"},{"id":"ai-115-3-03","s":"ai","q":"某物流公司希望導入人工智慧(AI)技術，目標是能依據即時交通路況、配送車輛位置及訂單需求，自動計算並決定最佳配送路線與車隊調度策略。下列何者最符合此智慧物流應用所採用的 AI 技術概念？","o":["利用光學字元辨識(OCR)技術，在收到新增的訂單時，自動辨識並擷取紙本單據上的收件地址以完成系統建檔","利用文字探勘(Text Mining)技術，分析配送車輛位置的 GPS 經緯度數字與即時交通路況的車速資料，據此規劃最佳配送路線","運用生成式 AI(GenerativeAI)技術，分析配送相關文件與服務紀錄，自動生成營運分析報告與改善建議","利用機器學習與路徑優化演算法分析各項即時動態資料，由系統即時且持續優化行車路線與配送調度"],"a":3,"e":"依即時路況、車輛位置與訂單動態計算最佳路線與調度，核心是機器學習結合路徑優化演算法，並持續隨新資料更新決策。OCR 只是擷取單據文字；文字探勘處理的是文本而非 GPS 與車速數值；生成式 AI 產出報告屬事後分析，都無法即時決定配送路線。","src":"115年第三次 第3題"},{"id":"ai-115-3-04","s":"ai","q":"某銀行導入 AI 信用貸款評分系統上線半年後，風險稽核部門發現，即使模型訓練資料中已不包含「職業別」欄位，仍可能透過「居住地區」與「消費類別」等高度相關特徵，對特定職業族群產生不合理差異待遇。依據 AI 治理精神，銀行應優先採取下列何種行動？","o":["增設人工複核關卡，由授信人員針對系統所有的核貸結果重新逐案審查","提高「居住地區」與「消費類別」兩項特徵的資料準確度，以強化該模型整體的預測效度","引入公平性評估指標，檢視間接關聯特徵是否造成偏誤並對模型進行調整優化","於核貸結果中另行加註該職業別標籤，以作為日後申請人提出申訴時的佐證依據"],"a":2,"e":"即使刪除敏感欄位，模型仍可能透過「居住地區」等代理變數間接造成歧視，治理上應引入公平性評估指標檢測偏誤並調整模型，從根源處理。全面人工複核成本高且未解決模型偏誤；提升代理特徵準確度反而可能強化偏誤；在結果加註職業標籤更會加深差別待遇。","src":"115年第三次 第4題"},{"id":"ai-115-3-05","s":"ai","q":"某新創公司開發三款針對特定任務設計的 AI 產品，分別為：可自動生成社群貼文的「智慧行銷助理」、透過人臉辨識進行身分驗證的「辦公室門禁系統」，以及預測客戶流失風險的「資料分析模型」。上述產品依人工智慧的分類，皆屬於下列何者？","o":["超級人工智慧(ASI)","弱人工智慧(Weak AI)","通用人工智慧(AGI)","具身人工智慧(Embodied AI)"],"a":1,"e":"生成貼文、人臉門禁、流失預測都是針對特定任務設計、只在單一領域發揮能力的系統，屬於弱人工智慧（狹義 AI）。通用人工智慧需具備跨領域、類人的通用智能；超級人工智慧是全面超越人類的假想階段；具身 AI 強調透過實體身體與環境互動，皆不符。","src":"115年第三次 第5題"},{"id":"ai-115-3-06","s":"ai","q":"某壽險公司 AI 客服助理上線後進行測試。顧客與 AI 助理對話時，全程未察覺對方並非真人，回應自然且能適當安撫顧客情緒。然而，當顧客詢問「我同時符合兩項理賠條件，應優先申請哪一項？」時，AI 助理前後提供不同建議；進一步詢問原因時，也無法說明判斷依據，只能持續提供語意通順但未能回答問題的內容。技術主管認為，既然 AI 已具備足以讓人誤認為真人的對話能力，就代表其判斷結果值得信賴。依據圖靈測試(Turing Test)的設計理念，下列何者最適合評估上述技術主管的觀點？","o":["圖靈測試主要用於評估 AI 是否具有可解釋性，因此無法說明判斷依據即代表未通過圖靈測試","圖靈測試通過後，即可合理推論 AI 在專業領域的判斷能力已達人類水準","圖靈測試的目的在驗證 AI 是否能針對各類問題提供正確且一致的答案，因此回答內容是否正確是主要評估重點","圖靈測試主要評估 AI 是否能展現近似人類的對話表現，並不能據此推論其具備可靠的專業判斷與決策能力"],"a":3,"e":"圖靈測試只檢驗機器能否在對話中讓人難以分辨其與真人，屬於行為表現層面的評估，並不代表具備正確、一致或可靠的專業判斷，因此主管的推論不成立。圖靈測試既非評估可解釋性，也不以答案正確與一致為核心，更不能推論 AI 的專業判斷已達人類水準。","src":"115年第三次 第6題"},{"id":"ai-115-3-07","s":"ai","q":"根據數位發展部《公部門人工智慧應用參考手冊》，若 AI 系統的自動決策可能對民眾權益造成重大影響，最應優先確保下列哪一項機制？","o":["演算法模型應經第三方公正機構進行技術合規檢測","建立人在迴圈內(Human-in-the-loop)的最終審核機制","系統應定期進行弱點掃描與資安檢測，以降低系統遭受攻擊的風險","系統產製的所有決策及決策軌跡皆應全程公開於政府資訊網站"],"a":1,"e":"當 AI 自動決策可能重大影響民眾權益時，手冊強調應保留人在迴圈內的最終審核，由人類對結果負責並可介入修正。第三方合規檢測與定期資安檢測雖有助品質與安全，但無法取代人的最終把關；將所有決策軌跡全程公開則可能侵害個資，也非優先機制。","src":"115年第三次 第7題"},{"id":"ai-115-3-08","s":"ai","q":"某製造企業欲建置 AI 品質檢測系統，利用生產線攝影機即時判斷零件表面是否存在細微刮痕。下列何種技術最適合用於此類應用？","o":["強化學習(Reinforcement Learning)，透過獎勵機制改善影像辨識結果","決策樹(Decision Tree)，透過人工設定規則判斷影像像素差異","分群演算法(Clustering Algorithm)，依資料距離將影像自動分類","卷積神經網路(CNN)，透過學習影像中的局部特徵進行缺陷辨識"],"a":3,"e":"偵測零件表面細微刮痕屬影像辨識任務，卷積神經網路透過卷積核擷取邊緣、紋理等局部特徵，最適合做視覺缺陷檢測。強化學習用於序列決策而非影像分類；決策樹以人工規則判斷像素難以處理高維影像；分群演算法屬非監督，無法穩定對應「有無刮痕」的類別。","src":"115年第三次 第8題"},{"id":"ai-115-3-09","s":"ai","q":"某電商平台計劃開發一個機器學習模型，目標是在每個月底自動預測哪些現有會員在下個月可能會流失(不再消費)，以便行銷團隊提前發送優惠券進行挽留。若要提升模型預測會員流失的效果，在進行特徵工程(Feature Engineering)時，下列哪一項作法最適合？","o":["為了提高預測的準確度，特徵與要預測的目標值(是否流失)之間，在統計上不需要具備任何關聯性或因果關係","可以將「會員下個月是否仍有消費紀錄」加入模型特徵，因為該資訊與會員是否流失具有高度關聯性","為了縮短模型推理(Inference)的反應時間，特徵所涵蓋的時間範圍越短越好，建議一律只保留前一天的單日行為資料","所選取的特徵，必須是在每個月底模型進行預測的當下，系統就能實際取得且掌握的已知資料"],"a":3,"e":"特徵必須是在預測當下（月底）就能取得的資訊，否則會產生資料洩漏，訓練時表現亮眼、上線卻失準。「下個月是否仍有消費」正是未來資訊，屬典型洩漏；特徵若與目標毫無關聯則無預測價值；一律只留前一天資料會丟失長期行為趨勢，並不合理。","src":"115年第三次 第9題"},{"id":"ai-115-3-10","s":"ai","q":"某零售電商平台計劃建置機器學習模型分析會員行為。在資料預處理階段，資料科學團隊發現會員的「年消費總額」與「月到訪次數」數值範圍差異較大，可能影響部分機器學習模型的訓練效果，因此決定採用 Z-Score 標準化(Standardization) 進行特徵縮放。已知該平台全體會員的「年消費總額」平均值為 30,000 元，標準差為5,000 元。若某位 VIP 會員的年消費總額為 40,000 元，下列敘述何者正確？","o":["經過 Z-Score 轉換後，該會員的年消費總額特徵值將被限制於 0 至 1 的範圍內，以利模型訓練","計算後該會員的 Z-Score 值為 2，代表其消費金額高於平均值兩個標準差，可反映其消費金額相對於整體會員的高低程度","不論原始消費資料的分布為何，只要經過 Z-Score 轉換，整組資料一定會轉換為標準常態分配","即使完成 Z-Score 轉換，由於「月到訪次數」與「年消費總額」原始計量單位不同，兩項特徵仍不適合同時作為機器學習模型的輸入"],"a":1,"e":"Z 分數＝（40,000－30,000）÷5,000＝2，表示該會員消費高於平均兩個標準差，可反映其相對位置。Z-Score 不會把數值限制在 0～1（那是最小最大正規化）；也不會改變原本分布形狀使其變成常態分配；標準化的目的正是消除單位差異，讓不同特徵可一起輸入模型。","src":"115年第三次 第10題"},{"id":"ai-115-3-11","s":"ai","q":"某健康管理 AI 系統透過智慧手環蒐集使用者的生理量測資料，資料以欄位標籤(Tag)記錄，例如「使用者 ID：H123」、「量測項目：心率」、「量測數值：75」等。不同裝置可依功能需求上傳不同欄位(如：血氧濃度)，因此各筆資料不一定具有完全相同的欄位結構。在資料格式與資料結構特徵的分類上，此類資料最屬於下列哪一種資料型態？","o":["結構化資料(Structured Data)","半結構化資料(Semi-structured Data)","高頻資料(High-frequency Data)","時序資料(Time Series Data)"],"a":1,"e":"資料以標籤（鍵值對）描述欄位，且不同裝置可上傳不同欄位、結構不固定，這正是 JSON、XML 這類半結構化資料的特徵。結構化資料要求固定欄位的表格格式；高頻資料與時序資料是依取樣頻率或時間順序的分類，並非描述欄位結構的資料型態。","src":"115年第三次 第11題"},{"id":"ai-115-3-12","s":"ai","q":"某電商平台的客服部門統計了本月 10,000 筆顧客服務評分(滿分 100 分)，發現平均分數為 72 分，中位數為 85 分，平均數顯著小於中位數。資料分析師欲初步判斷此評分資料的分配型態，下列敘述何者最合理？","o":["資料呈負偏態分配(左偏，Skewness to the Left)，代表多數顧客給予高分，但少數極低評分將平均數大幅拉低","資料呈正偏態分配(右偏，Skewness to the Right)，代表多數顧客給予低分，但少數極高評分將平均數大幅拉高","資料呈標準常態分配，平均數與中位數的些微差異屬於正常的隨機抽樣誤差","資料呈均勻分配，各分數區間出現的機率大致相同，因此平均數略低於中位數"],"a":0,"e":"平均數明顯小於中位數，代表少數極低分把平均數往左拉，分布左側拖著長尾，屬負偏態（左偏），且多數顧客其實給了高分。正偏態時平均數會大於中位數；常態分配與均勻分配的平均數與中位數應大致相等，在一萬筆樣本下 13 分的差距不能視為抽樣誤差。","src":"115年第三次 第12題"},{"id":"ai-115-3-13","s":"ai","q":"某電商平台的資料科學團隊欲建置一套 NLP 模型，用於分析顧客在社群媒體上對商品的評論情緒。在將原始貼文資料送入模型訓練前，團隊執行了以下步驟：移除貼文中夾雜的 HTML 標籤與網址、將表情符號轉換或移除、去除「的、了、啊」等對情緒判斷無實質貢獻的停用詞，並統一將文字轉換為小寫格式。請問上述步驟主要屬於機器學習專案流程中的哪一環節？","o":["模型評估(Model Evaluation)：透過移除干擾詞彙，計算模型在測試資料集上的準確率、精確率等指標表現","特徵萃取(Feature Extraction)：將文字資料轉換為數值向量，使模型能夠識別評論中與情緒相關的關鍵詞彙權重","資料清理與預處理(Data Cleaning and Preprocessing)：將原始、雜亂的文字資料轉換為格式一致、去除雜訊的乾淨資料，以利後續模型有效學習","超參數調校(Hyperparameter Tuning)：調整模型訓練過程中的學習率、批次大小等參數，以移除訓練資料中的雜訊干擾"],"a":2,"e":"移除 HTML 標籤與網址、處理表情符號、去除停用詞、統一小寫，都是把雜亂原始文字整理成乾淨、一致格式的步驟，屬資料清理與預處理。特徵萃取是將文字轉成數值向量；模型評估是計算準確率等指標；超參數調校是調整學習率等設定，皆非上述步驟的目的。","src":"115年第三次 第13題"},{"id":"ai-115-3-14","s":"ai","q":"某資料科學家利用房屋資料建立 AI 房價預測模型，資料中包含許多彼此高度相關的數值特徵(例如房屋總坪數、客廳坪數等)。為了降低資料維度並減少特徵間的重複資訊，最適合採用下列何種技術？","o":["類別編碼(Categorical Encoding)","主成分分析(PCA)降維","特徵標準化(Standardization)","異常值(Outlier)處理"],"a":1,"e":"主成分分析（PCA）能將多個高度相關的特徵轉換為少數彼此不相關的主成分，在保留大部分變異的同時降低維度、去除重複資訊。類別編碼是把類別轉成數值；標準化只是調整尺度，特徵數量不變；異常值處理針對極端值，都無法解決特徵共線與維度過高的問題。","src":"115年第三次 第14題"},{"id":"ai-115-3-15","s":"ai","q":"企業在公開去識別化的消費資料集前，為避免他人透過郵遞區號、性別等間接識別資訊交叉比對後重新識別特定個人身分，同時保留資料的分析價值，最適合採用下列哪一種隱私保護技術？","o":["差分隱私(Differential Privacy)技術","隨機抽樣(Random Sampling)技術","k-匿名化(k-Anonymity)技術","密碼雜湊(Hashing)技術"],"a":2,"e":"k-匿名化會將郵遞區號、性別等準識別欄位泛化或隱藏，讓每筆紀錄至少與其他 k－1 筆無法區分，可防止交叉比對重新識別，同時保留分析價值。差分隱私主要用於統計查詢結果加入雜訊；隨機抽樣不能防止重新識別；雜湊僅處理直接識別碼，對準識別欄位無效。","src":"115年第三次 第15題"},{"id":"ai-115-3-16","s":"ai","q":"某零售企業的資料科學團隊正在開發高價值會員預測模型。在資料前處理階段，分析師發現特徵欄位「年收入」有約 5%的遺漏值(Missing Value)。經資料探索發現，該欄位的數值分佈呈現高度正偏態(右偏分配，Skewness to the Right)。若在不刪除任何會員資料的前提下，欲選擇較適合的遺漏值填補方式，下列何者最為合適？","o":["填補該欄位的平均值(Mean)","填補該欄位的眾數(Mode)","填補該欄位的中位數(Median)","將遺漏值直接填補為「0」"],"a":2,"e":"高度右偏的資料受極大值影響，平均數會被拉高而失去代表性；中位數不受極端值影響，用來填補遺漏值最穩健。眾數適合類別型資料，連續的收入數值常無明確眾數；直接填 0 會扭曲分布並造成誤導，讓模型以為這些會員沒有收入。","src":"115年第三次 第16題"},{"id":"ai-115-3-17","s":"ai","q":"某公司準備利用智慧電表資料建立 AI 模型分析用電趨勢。為了降低資料量，將原本每秒紀錄一次的資料改為每小時統計一次。這項調整最可能造成什麼影響？","o":["因為資料維度大幅減少，AI 模型的預測準確度一定會隨之提升","保留了整體的用電趨勢，但可能失去短時間內設備啟動的用電變化資訊","將連續的用電數值轉換成每小時統計後，資料型態會自動轉變為類別資料","由於重新彙整資料，容易造成資料外洩(Data Leakage)，使模型評估結果偏高"],"a":1,"e":"由每秒彙整為每小時，資料量大減且仍能呈現整體用電趨勢，但會抹平短時間內的突波，例如設備啟動瞬間的用電變化。降維不保證準確度一定提升；彙整後仍是連續數值，不會自動變成類別資料；資料洩漏源於使用了預測當下不該知道的資訊，與彙整頻率無關。","src":"115年第三次 第17題"},{"id":"ai-115-3-18","s":"ai","q":"某公共衛生研究中心建置民眾健康資料分析平台，提供研究人員查詢各地區慢性病患者的統計資訊。為防範研究人員透過多次查詢不同條件的統計結果進行比對，而推論特定個人是否存在於資料庫中，平台在輸出統計結果時，會依據演算法加入適當的隨機雜訊(Random Noise)，使單一病患資料的新增或刪除，不會造成明顯改變統計查詢結果。下列何者最符合此系統採用的隱私保護技術？","o":["k-匿名化(k-Anonymity)","差分隱私(Differential Privacy)","假名化(Pseudonymization)","資料遮罩(Data Masking)"],"a":1,"e":"在統計輸出中依演算法加入隨機雜訊，使任一個人資料的增刪幾乎不影響結果，藉此防止差分攻擊推論個人是否在資料庫中，這正是差分隱私的定義。k-匿名化是泛化準識別欄位；假名化是以代號取代識別碼；資料遮罩是隱藏部分欄位內容，都不是對查詢結果加雜訊。","src":"115年第三次 第18題"},{"id":"ai-115-3-19","s":"ai","q":"某科技新創公司欲開發一套人臉美化濾鏡應用程式，研發團隊自網路公開的社群媒體蒐集大量個人自拍照作為模型訓練資料。這些照片皆由使用者自行公開分享，未設定瀏覽權限限制。公司法務人員在進行專案合規性評估時，針對「將公開照片作為商業 AI 模型訓練資料」提出法律風險提醒。下列哪一項敘述最符合現行個人資料保護法及 AI 倫理的原則？","o":["公開於網路的照片屬於可合法蒐集的公開資訊，因此企業可直接作為 AI 模型訓練資料，不需再考量原始蒐集目的","當事人自行公開照片，不代表同意其影像可作為商業 AI 模型訓練資料，此利用行為可能涉及個人資料目的外利用的法律風險","即使蒐集過程可能涉及法律風險，只要模型訓練完成後刪除原始照片，即可免除先前蒐集及處理可能產生的法律責任","企業只要公開揭露 AI 模型的訓練目的，即可直接蒐集公開照片作為訓練資料，而無須再考量個資法相關規範"],"a":1,"e":"當事人公開照片，不等於同意被拿去訓練商業 AI 模型；超出原本分享目的的利用，可能構成個資的目的外利用而有法律風險。認為公開資訊可任意使用、事後刪除照片即可免責，或只要揭露訓練目的就能不顧個資法，都忽略了個資蒐集、處理與利用須符合特定目的與合法要件。","src":"115年第三次 第19題"},{"id":"ai-115-3-20","s":"ai","q":"某電商平台計劃針對既有會員進行精準行銷。行銷團隊收集了所有會員的平均消費金額、每月購物頻率及瀏覽商品類別次數等特徵資料，但並未預先設定客戶類型標籤。希望透過 AI 自動將特徵相似的會員分成數個群體，作為後續規劃客製化促銷方案的依據。下列哪一種機器學習方法最適合此需求？","o":["採用監督式分類(Classification)，根據已標註的客戶類型建立分類模型","採用迴歸分析(Regression)，預測每位會員下個月的消費金額","採用叢集分析(Clustering)，依據會員特徵的相似性，自動將資料分成數個群體","採用強化學習(Reinforcement Learning)，根據會員的即時回饋持續調整促銷策略"],"a":2,"e":"沒有預先設定的客戶類型標籤，目的是依特徵相似度自動分群，這正是叢集分析（非監督式學習）的典型應用。分類需要已標註的類別；迴歸是預測連續數值（如下月消費金額）；強化學習透過回饋持續調整行動策略，都不是「把相似會員分組」的需求。","src":"115年第三次 第20題"},{"id":"ai-115-3-21","s":"ai","q":"某交通局計劃預測未來 1 小時的路口車流量，以最佳化號誌時制配置。系統需要分析過去 24 小時的車流量資料。若模型設計著重於模擬「前一階段(如前 15 分鐘)的壅塞狀況會延續並影響下一階段」，下列哪一種深度學習架構最適合作為此預測模型的核心？","o":["卷積神經網路(CNN)","生成對抗網路(GAN)","前饋神經網路(Feedforward)","循環神經網路(RNN)"],"a":3,"e":"循環神經網路會把前一時間步的隱藏狀態傳到下一步，天生適合模擬「前一階段壅塞延續影響下一階段」的時間序列依賴關係。CNN 擅長擷取影像等空間局部特徵；GAN 用於生成新資料；前饋神經網路沒有記憶前序資訊的結構，皆不適合作為車流序列預測的核心。","src":"115年第三次 第21題"},{"id":"ai-115-3-22","s":"ai","q":"某食品加工廠建立水果瑕疵檢測系統，已蒐集約 10,000 張影像，其中 2,000 張已完成「正常」、「碰傷」及「病斑」標註，其餘 8,000 張尚未完成標註。公司希望在降低人工標註成本的前提下，提升影像分類模型的辨識能力。下列何種作法最適合？","o":["引用已完成預訓練的通用影像分類模型，未經任何微調即直接用於水果瑕疵分類","先利用已標註影像建立分類模型，再搭配未標註影像進一步改善模型表現","將未標註影像進行分群，並直接將各群結果作為病害分類標籤","將已標註與未標註影像一併納入監督式學習模型訓練，不另外處理未標註資料"],"a":1,"e":"僅 2,000 張有標註、8,000 張未標註，最合適的是半監督式作法：先用標註資料訓練模型，再利用未標註影像（如偽標籤）提升表現，兼顧成本與效果。通用預訓練模型未微調難以辨識特定瑕疵；把分群結果直接當病害標籤不可靠；未標註資料無法直接放進監督式訓練。","src":"115年第三次 第22題"},{"id":"ai-115-3-23","s":"ai","q":"請問下列哪一項 AI 應用專案，最適合採用長短期記憶網路(LSTM)進行模型開發？","o":["依據顧客本月的累積消費金額，將顧客自動分類為高、中、低三個行銷客群","分析單一時間點的信用卡交易畫面截圖，判斷是否存在偽卡特徵","比對顧客本次貸款申請書上的簽名影像，與五年前開戶時留存的簽名影像，判斷是否為同一人所簽署","依據顧客過去 24 個月的每月信用卡消費金額資料，預測其下個月是否出現異常消費"],"a":3,"e":"LSTM 擅長處理具時間順序且有長期依賴的序列資料，用過去 24 個月的逐月消費金額預測下月是否異常，正是典型時序應用。依單月累積金額分群屬靜態分群；單張交易截圖判斷偽卡與比對兩張簽名影像都屬影像任務，較適合 CNN 等模型，與序列無關。","src":"115年第三次 第23題"},{"id":"ai-115-3-24","s":"ai","q":"某醫院利用 AI 模型進行癌症篩檢，目前模型的精確率(Precision)為 96%，召回率(Recall)為 71%。醫師評估後認為，希望能讓更多真正罹癌的病患在初步篩檢時被及早發現，即使因此增加部分後續複檢人數也可以接受。分析師應優先採取何種策略？","o":["調高判定癌症的門檻值，以提高精確率(Precision)，但召回率(Recall)可能會下降","調低判定癌症的門檻值，以提高召回率(Recall)，但精確率(Precision)可能會下降","調整模型參數，使精確率(Precision)與召回率(Recall)同步提升，而不需調整判定門檻","保持目前判定門檻，以維持較高的精確率(Precision)，避免增加過多後續複檢"],"a":1,"e":"醫師希望找出更多真正罹癌者，也就是降低漏診、提高召回率；做法是調低判定門檻，讓更多個案被判為陽性，代價是偽陽性增加、精確率下降。調高門檻或維持現狀都偏重精確率，與目標相反；不調門檻就要兩者同步大幅提升並不實際，兩者通常存在取捨關係。","src":"115年第三次 第24題"},{"id":"ai-115-3-25","s":"ai","q":"為了更客觀地評估 AI 模型的效能，資料科學家將資料集分成 5 等份，輪流以其中1 等份作為測試資料，其餘 4 等份作為訓練資料，重複進行 5 次訓練與評估，最後將各次評估結果取平均。上述方法稱為下列何者？","o":["隨機森林(Random Forest)","保留法(Hold-out Validation)","交叉驗證(Cross-Validation)","自助抽樣 (Bootstrapping)"],"a":2,"e":"將資料分成 5 等份、輪流以一份當測試集、其餘訓練，重複 5 次後取平均，這是 k 折交叉驗證（k=5）。保留法只切分一次訓練與測試集；自助抽樣是有放回地重複抽樣；隨機森林是一種集成學習演算法，而不是模型評估方法。","src":"115年第三次 第25題"},{"id":"ai-115-3-26","s":"ai","q":"某電商公司訓練一套深度學習模型，用來預測顧客是否會退貨。工程師觀察訓練紀錄發現：模型在第 1 個 Epoch(輪次)時預測表現不佳，隨著訓練進行，內部參數不斷被自動更新，到第 50 個 Epoch 時預測準確度已大幅提升。模型在訓練過程中，主要根據下列哪一項資訊決定模型參數的更新方向？","o":["計算損失函數(Loss Function)的梯度(Gradient)，並依梯度反方向更新模型參數","根據激活函數(Activation Function)的輸出值大小，直接決定模型參數的更新方向","根據各模型參數目前的權重大小，自動調整各參數的更新方向","根據每次 Epoch 的準確率(Accuracy)變化，直接決定模型參數的更新方向"],"a":0,"e":"深度學習透過反向傳播計算損失函數對各參數的梯度，再由優化器沿梯度反方向更新參數，使損失逐步下降。激活函數只負責引入非線性，不決定更新方向；參數目前的權重大小本身不是更新依據；準確率不可微分，只能用來監控訓練，無法直接指導參數更新。","src":"115年第三次 第26題"},{"id":"ai-115-3-27","s":"ai","q":"某集團為響應淨零排放政策，計劃引進智慧節能系統，利用歷史氣象觀測資料(如溫度、濕度)與大樓進出人數，來預測總部大樓明日的總用電量(kWh)，以利最佳化空調冰水主機的運轉排程。請問下列哪一組「任務類型／演算法／評估指標」的組合最適合此應用需求？","o":["迴歸(Regression)／極限梯度提升迴歸(XGBoost Regressor)／平均絕對百分比誤差(MAPE)","分類(Classification)／決策樹(Decision Tree)／F1 分數(F1-Score)","分群(Clustering)／K-Means／準確率(Accuracy)","迴歸(Regression)／孤立森林(Isolation Forest)／召回率(Recall)"],"a":0,"e":"預測明日總用電量（kWh）是連續數值，屬迴歸任務；XGBoost Regressor 是常用的高效迴歸演算法，MAPE 以百分比衡量預測誤差，搭配合理。F1 與準確率是分類指標；K-Means 是分群演算法；孤立森林用於異常偵測，召回率也是分類指標，與迴歸任務不符。","src":"115年第三次 第27題"},{"id":"ai-115-3-28","s":"ai","q":"某農業合作社欲根據歷年各田區的日照時數、降雨量、施肥量及土壤酸鹼值等資料，搭配各田區當季實際收穫的稻米產量(公噸)，建立模型，以預測下一季新田區的稻米產量(連續數值)。請問下列哪一組「學習類型／演算法／評估方式」的搭配最為合理？","o":["監督式學習(Supervised Learning)／K-means／準確率(Accuracy)","強化學習( Reinforcement Learning )／Q-learning ／累積報酬( Cumulative Reward)","監督式學習(Supervised Learning)／線性迴歸(Linear Regression)／平均絕對誤差(MAE)","監督式學習(Supervised Learning)／ 支援向量機分類器(SVC)／ 混淆矩陣(Confusion Matrix)"],"a":2,"e":"有歷史產量作為標籤，屬監督式學習；預測稻米產量為連續數值，用線性迴歸並以平均絕對誤差評估最為合理。K-means 是非監督分群演算法，準確率也不適用迴歸；Q-learning 屬強化學習，需與環境互動；SVC 是分類器、混淆矩陣是分類評估工具，皆不適用連續數值預測。","src":"115年第三次 第28題"},{"id":"ai-115-3-29","s":"ai","q":"某保險公司建置理賠風險預測模型，主管要求模型驗證流程需具備可重現性，以符合模型治理與稽核要求。若模型驗證採用包含隨機資料切分的 k-fold 交叉驗證，下列何者最能確保每次執行時樣本分割結果一致？","o":["增加資料集的特徵數量，以提升模型預測能力","固定隨機數種子(Random Seed)，使每次執行使用相同的亂數序列","調整交叉驗證參數，將 k 值由 5 折提高至 10 折以增加模型評估的細緻度","重複執行多次交叉驗證，並取其平均評估結果作為最終稽核依據"],"a":1,"e":"k-fold 的資料切分仰賴亂數，固定隨機種子可讓每次產生相同的亂數序列，使分割結果一致、驗證過程可重現，符合稽核要求。增加特徵數量與可重現性無關；把 k 從 5 改成 10 只是改變折數，切分仍會隨機變動；多次執行取平均能降低變異，但不保證每次分割相同。","src":"115年第三次 第29題"},{"id":"ai-115-3-30","s":"ai","q":"某製造工廠導入人工智慧系統，持續蒐集設備的溫度、振動、電流及轉速等感測資料。當系統發現設備運轉狀態出現不尋常變化時，可立即通知維護人員，以降低非預期停機的風險。下列何者最符合上述系統功能？","o":["根據設備歷史運轉與維修資料建立模型，預測設備未來一週發生故障的機率","根據設備感測資料，自動判斷異常狀況屬於軸承磨損、馬達異常或冷卻系統異常等類別，以協助安排後續檢修作業","依設備運轉特性將設備分為不同群組，作為安排保養週期的參考","即時分析設備感測資料，偵測偏離正常運轉模式的異常訊號，並立即發出警示"],"a":3,"e":"題意重點是「即時」察覺運轉狀態的「不尋常變化」並立即通知，正是異常偵測：找出偏離正常模式的訊號並發出警示。預測未來一週的故障機率屬預測性維護；判斷異常屬於哪種故障類型屬故障分類診斷；依特性分群安排保養屬分群分析，都不是即時偵測異常。","src":"115年第三次 第30題"},{"id":"ai-115-3-31","s":"ai","q":"某連鎖量販店計劃導入 AI 銷量預測系統，以優化每日進貨與庫存管理。團隊比較兩家軟體廠商提供的迴歸模型，兩個模型皆以相同的測試資料集進行評估，其中廠商甲模型的均方誤差(Mean Squared Error, MSE)為 12.5，廠商乙模型的均方誤差(MSE)為 42.0。僅依據 MSE 指標的數值與定義來評估模型表現，下列何者最適合作為模型評估結果的說明？","o":["應優先選擇廠商甲的模型，因為其 MSE 較低，代表模型預測值與實際銷量的整體誤差較小","應優先選擇廠商乙的模型，因為 MSE 較高，代表模型能涵蓋更多不同的銷售情境，因此預測能力較佳","兩個模型無法直接比較，因為 MSE 主要反映平均預測誤差，無法用來評估不同模型的預測表現","由於兩者的 MSE 皆大於 0，代表模型皆存在過擬合(Overfitting)現象，無法判定哪一個模型較佳"],"a":0,"e":"MSE 是預測值與實際值差距平方的平均，數值越小代表整體誤差越小；在同一測試集下，甲的 12.5 小於乙的 42.0，應優先選擇甲。MSE 高代表誤差大，與涵蓋情境多寡無關；MSE 正是用來比較迴歸模型表現的常用指標；MSE 大於 0 是常態，不能據此判斷過擬合。","src":"115年第三次 第31題"},{"id":"ai-115-3-32","s":"ai","q":"某證券公司開發 AI 輔助分析系統，需要分析長篇的法人說明會逐字稿。系統須有效建立逐字稿前後段落之間的長距離語意關聯，並在處理長篇文本時，能直接關聯相距較遠的文字內容，而無須依序傳遞前文資訊，以提升分析效率與準確性。下列哪一種模型架構最適合？","o":["長短期記憶網路(LSTM)","循環神經網路(RNN)","Transformer","卷積神經網路(CNN)"],"a":2,"e":"Transformer 透過自注意力機制，讓序列中任兩個位置直接計算關聯，不必像 RNN 依序逐步傳遞資訊，能有效捕捉長距離語意並可平行運算。RNN 有長期依賴與梯度消失問題；LSTM 雖改善長期記憶，但仍需依序傳遞；CNN 主要擷取局部特徵，較難建立遠距離的語意關聯。","src":"115年第三次 第32題"},{"id":"ai-115-3-33","s":"ai","q":"某製造業工廠導入 AI 模型預測設備故障風險，技術團隊向產線主管說明模型運作原理：模型在每一輪訓練中，會依據「預測故障機率」與「實際發生故障結果」之間的落差程度，產生一項量化指標，並將該數值提供給後續模型訓練流程，作為模型參數調整的重要依據。請問此敘述最符合深度學習訓練流程中哪個元件的功能？","o":["評估指標(Evaluation Metric)","損失函數(Loss Function)","優化器(Optimizer)","特徵工程(Feature Engineering)"],"a":1,"e":"依據預測值與實際結果的落差產生一個量化數值，並作為調整參數的依據，這正是損失函數的功能。評估指標用來衡量模型表現、通常不直接用於更新參數；優化器是依損失的梯度實際執行參數更新的機制；特徵工程屬資料前處理階段，與訓練時的誤差計算無關。","src":"115年第三次 第33題"},{"id":"ai-115-3-34","s":"ai","q":"某金控集團規劃導入下列四項 AI 應用。依據各項應用的主要功能特性，下列何者正確區分屬於「鑑別式 AI」與「生成式 AI」？甲、客服部門：為培訓新進客服人員，希望 AI 系統依據歷史客訴案例，自動產生不同客訴情境的對話劇本，供員工進行角色扮演演練。乙、法務部門：為加速合約審查流程，希望 AI 系統分析合約草稿，並標示屬於高風險或不符合公司規範的條款。丙、投顧部門：為提供投資建議，希望 AI 系統分析全球經濟指標與股市歷史資料，判斷下個月大盤指數可能上漲或下跌。丁、行銷部門：為提升廣告點閱率，希望 AI 系統依據產品說明，自動改寫出五種不同風格的全新宣傳文案。","o":["鑑別式 AI：乙、丙；生成式 AI：甲、丁","鑑別式 AI：甲、丁；生成式 AI：乙、丙","鑑別式 AI：乙、丁；生成式 AI：甲、丙","鑑別式 AI：丙；生成式 AI：甲、乙、丁"],"a":0,"e":"鑑別式 AI 著重判斷與分類：標示合約高風險條款（乙）、判斷大盤漲跌（丙）。生成式 AI 著重產出新內容：生成客訴對話劇本（甲）、改寫五種新文案（丁）。其他組合把「產生劇本、文案」歸為鑑別式，或把「判斷漲跌、標示條款」歸為生成式，都混淆了兩者的核心差異。","src":"115年第三次 第34題"},{"id":"ai-115-3-35","s":"ai","q":"某半導體製造廠導入 AI 視覺檢測模型，用於自動判斷晶圓表面是否存在瑕疵。隨著模型正式上線運作，品質管理部門希望了解模型在大量檢測影像中的整體判斷規律，例如哪些影像特徵通常對瑕疵判定結果影響較大，以及模型整體傾向依據哪些特徵進行分類。上述需求屬於可解釋人工智慧(ExplainableAI, XAI)中的何種解釋方式？","o":["改善模型的泛化能力並降低過適配風險","分析單一樣本的預測結果與決策過程","闡述模型整體的決策機制與行為模式","簡化模型架構以增強其透明度與理解性"],"a":2,"e":"品管部門想了解模型在大量影像中的整體規律、哪些特徵普遍影響判定，屬全域解釋，也就是闡述模型整體的決策機制與行為模式。分析單一樣本的預測屬局部解釋；改善泛化能力屬模型優化而非解釋；簡化模型架構是追求內在可解釋性，與本題需求不同。","src":"115年第三次 第35題"},{"id":"ai-115-3-36","s":"ai","q":"某銀行的信用評分模型須向主管機關說明各項資料對評分結果的影響力。分析師採用排列特徵重要性(Permutation Feature Importance)方法，逐一打亂單一特徵的數值後重新測試模型表現。下列敘述何者最符合此方法判斷特徵重要性的原則？","o":["必須先計算該特徵與信用評分結果的線性相關係數，數值越高代表越重要","打亂後模型的預測誤差完全不變，代表該特徵對模型越重要","打亂某特徵的數值後，若模型預測誤差增加越多，代表該特徵對模型越重要","特徵打亂順序後，必須將模型搭配新資料重新訓練，才能判斷其重要性"],"a":2,"e":"排列特徵重要性是打亂某特徵數值、破壞其與目標的關係，再觀察模型誤差變化；誤差增加越多，代表模型越依賴該特徵，重要性越高。若誤差完全不變，表示該特徵幾乎不重要；此方法不需計算線性相關係數，也不必重新訓練模型，直接用已訓練好的模型重新測試即可。","src":"115年第三次 第36題"},{"id":"ai-115-3-37","s":"ai","q":"某市政府建置智慧城市巡檢系統，希望利用路面監視器影像，自動分析道路、人行道及綠地等公共設施的分布情形，並進一步統計各類設施受損區域所占面積，以作為維護決策的依據。系統需將影像中的每個像素標示其所屬類別。請問最適合採用下列哪一種電腦視覺技術？","o":["影像分割(Image Segmentation)","影像分類(Image Classification)","物件偵測(Object Detection)","人臉辨識(Face Recognition)"],"a":0,"e":"需要「為影像中每個像素標示所屬類別」，並據此統計各類設施與受損區域的面積，正是影像分割（語意分割）的任務。影像分類只對整張影像給一個標籤；物件偵測以邊界框框出物件，無法精確計算面積；人臉辨識用於辨認個人身分，與公共設施分析無關。","src":"115年第三次 第37題"},{"id":"ai-115-3-38","s":"ai","q":"某企業建置長時間對話的客服機器人，發現當對話回合數持續增加、上下文變得很長時，即使對話內容仍未超過模型可支援的上下文長度上限，模型仍常「忘記」或答錯先前提及的內容，回覆準確度明顯下降。下列關於此現象的敘述，何者最正確？","o":["上下文越長，模型擷取與利用關鍵資訊的能力可能下降，因此容易忽略先前的核心內容","上下文越長，模型會自動建立索引並優先檢索較早的對話內容，因而無法引用先前資訊","上下文越長，模型在推論時會逐漸改變其原有的模型參數設定，因而導致記憶混亂","只要對話內容未超過模型可支援的上下文長度，就不會出現遺漏先前資訊的情形"],"a":0,"e":"即使未超過上下文長度上限，上下文過長時，模型對中間或較早資訊的注意力會被稀釋（如 lost in the middle 現象），擷取關鍵資訊的能力下降，因而遺漏先前內容。模型不會自動建立索引檢索早期對話；推論時也不會改變模型參數；未超過上限並不保證不遺漏資訊。","src":"115年第三次 第38題"},{"id":"ai-115-3-39","s":"ai","q":"某手機應用程式提供「舊照片修復」功能，使用者上傳模糊照片後即可產生清晰版本。其模型訓練流程為：先將清晰影像逐步加入隨機雜訊，直到完全變成雜訊影像，再訓練模型學習如何逐步去除雜訊，以還原出清晰影像。請問此功能最主要採用下列哪一種生成式 AI 模型架構？","o":["生成對抗網路(GAN)","卷積神經網路(CNN)","變分自編碼器(VAE)","擴散模型(Diffusion Model)"],"a":3,"e":"先將清晰影像逐步加噪直到變成純雜訊，再訓練模型逐步去噪還原，這正是擴散模型的前向加噪與反向去噪流程。GAN 依靠生成器與鑑別器對抗訓練；VAE 透過編碼器把資料壓縮到潛在空間再解碼；CNN 是基礎網路架構，本身並不定義這種逐步去噪的生成流程。","src":"115年第三次 第39題"},{"id":"ai-115-3-40","s":"ai","q":"使用多種品種的貓影像訓練生成對抗網路(GAN)，希望生成多樣化的貓影像。然後，生成器(Generator)在訓練過程中逐漸只會反覆產生同一隻橘貓的影像，以騙過鑑別器(Discriminator)，導致生成結果缺乏多樣性。請問此現象稱為下列何者？","o":["過擬合(Overfitting)","模式崩潰(Mode Collapse)","梯度爆炸(Exploding Gradient)","梯度消失(Vanishing Gradient)"],"a":1,"e":"生成器只反覆產出同一種騙得過鑑別器的樣本（同一隻橘貓），喪失多樣性，稱為模式崩潰，是 GAN 訓練的經典問題。過擬合是模型過度記憶訓練資料、泛化能力差；梯度爆炸與梯度消失是反向傳播中梯度過大或過小造成訓練不穩或停滯，都不是生成結果缺乏多樣性的現象。","src":"115年第三次 第40題"},{"id":"ai-115-3-41","s":"ai","q":"某製造業廠區計劃導入 AI 影像分析系統，希望統計各產線員工穿戴安全帽與反光背心的整體遵從率，作為職業安全管理改善的參考依據。為兼顧職業安全管理與員工隱私保護，系統在分析及產出報表時不得識別或記錄任何特定員工的身分資訊。下列何種 AI 技術最適合此需求？","o":["採用物件偵測(Object Detection)辨識影像中的安全帽與反光背心，並統計各產線的整體穿戴遵從率","採用人臉辨識(Face Recognition)辨識未穿戴防護具的人員，再彙整各產線的穿戴遵從率","採用步態分析(Gait Analysis)辨識員工身分，再分析各產線的穿戴情形，以利後續改善安全管理","採用行為分析(BehaviorAnalytics)結合個人歷史紀錄，預測員工未來未穿戴防護具的風險，作為改善依據"],"a":0,"e":"只需偵測影像中是否有安全帽、反光背心並統計整體遵從率，用物件偵測即可，不必辨識是誰，兼顧安全管理與隱私。人臉辨識與步態分析都會識別員工身分，違反不得識別個人的要求；結合個人歷史紀錄預測風險，同樣涉及特定員工資料的蒐集與追蹤。","src":"115年第三次 第41題"},{"id":"ai-115-3-42","s":"ai","q":"某客服系統開發團隊希望聊天機器人的回覆風格更貼近人類偏好，因此在模型訓練後期導入人類回饋強化學習(Reinforcement Learning from Human Feedback, RLHF)技術。關於 RLHF 核心作法，下列敘述何者最正確？","o":["蒐集人類對不同模型回覆的偏好評比，建立獎勵模型作為模型優化的依據","蒐集更大量的公開網路文字重新進行預訓練，以提升模型回答的專業度","調整系統提示(System Prompt)，引導模型採用指定的回覆風格","蒐集高品質問答範例，直接進行監督式微調(Supervised Fine-Tuning, SFT)"],"a":0,"e":"RLHF 的核心是蒐集人類對多個回覆的偏好排序，訓練獎勵模型，再以強化學習（如 PPO）依獎勵優化語言模型，使回覆更符合人類偏好。增加語料重新預訓練是擴充知識；調整系統提示只是推論時的提示工程；以範例做監督式微調（SFT）是 RLHF 之前的步驟，並非其核心。","src":"115年第三次 第42題"},{"id":"ai-115-3-43","s":"ai","q":"某企業導入大型語言模型處理超長合約文件(數萬字)，發現輸入越長，運算時間與資源消耗增加得越快，遠超過文件長度增加的比例。下列何者最能解釋此現象發生的主要原因？","o":["長文本包含較多生僻字，系統偵測到新詞時會自動暫停並即時重建底層詞彙表","模型為了確保長文本的生成品質，會隨輸入長度自動動態增加模型的參數數量","自注意力機制在處理文本時，時間複雜度會隨輸入長度呈二次方(平方)快速上升","隨著合約內容變長，模型內部會自動切換為檢索增強生成(RAG)架構，以提升長文本處理效率"],"a":2,"e":"Transformer 的自注意力需計算每個 token 與所有 token 的關聯，時間與記憶體複雜度約為輸入長度的平方，因此文件變長時成本增加遠快於長度成長。模型不會因生僻字暫停重建詞彙表；參數數量在推論時是固定的；模型也不會自動切換為 RAG 架構。","src":"115年第三次 第43題"},{"id":"ai-115-3-44","s":"ai","q":"某軟體公司計劃開發一款手機 App，需要在沒有網路的環境下，也能在手機本機端(邊緣裝置)執行微型大語言模型來提供即時語音翻譯服務。考量到行動裝置的記憶體(RAM)容量限制以及電池續航力，工程師建議在部署前先對模型進行模型量化(Quantization)處理。請問關於此作法所帶來的預期效益與影響，下列敘述何者最正確？","o":["經過量化處理後的模型，在執行時必須即時連回雲端伺服器進行校正，否則手機端將無法獨立運作","能在完全不影響模型原本輸出品質的前提下壓縮模型體積，並降低記憶體需求","模型量化後會自動在邊緣裝置上動態增加參數數量，藉此彌補因為精度降低所帶來的能力損失","能大幅減少模型檔案體積與記憶體佔用量，並加速本機推論回應，但模型輸出品質可能會受到輕微影響"],"a":3,"e":"量化將權重從高精度（如 FP32）轉為低精度（如 INT8、INT4），可大幅縮小模型體積與記憶體占用、加快本機推論，但精度降低可能讓輸出品質輕微下降。量化後的模型可完全離線執行，不需連回雲端校正；「完全不影響品質」過於絕對；量化也不會動態增加參數數量。","src":"115年第三次 第44題"},{"id":"ai-115-3-45","s":"ai","q":"某銀行導入 AI 模型進行貸款核准判斷，主管要求必須具備可解釋人工智慧(XAI)機制，以便在客戶被拒貸時，能向審查人員說明該客戶被判定拒貸的主要原因。下列何者最符合 LIME 的運作方式，以用於提供單一客戶預測結果解釋？","o":["找出與該客戶特徵相近的歷史案例，直接以相同案例的核准結果作為拒貸原因說明","分析所有貸款案件的特徵重要性，建立整體模型的全局解釋，並套用至該客戶","直接分析模型內部參數與運算流程，推導該客戶被拒貸的原因","在該客戶資料附近建立模擬樣本，分析各項特徵對此次預測結果的影響程度"],"a":3,"e":"LIME 在目標樣本附近擾動產生模擬樣本，觀察黑箱模型的預測變化，再以簡單可解釋模型局部近似，找出各特徵對這次預測的影響。直接引用相似案例結果是案例式推理；整體特徵重要性屬全域解釋；分析模型內部參數屬模型特定方法，而 LIME 是與模型無關的局部解釋法。","src":"115年第三次 第45題"},{"id":"ai-115-3-46","s":"ai","q":"某醫院導入 AI 輔助判讀胸部 X 光片，為了讓醫師了解模型依據影像哪些區域做出診斷，工程師規劃於判讀畫面中加入顯著性圖(Saliency Map)作為視覺化說明。關於此項規劃在實務應用上，下列敘述何者最正確？","o":["顯著性圖可提升模型預測結果的可靠性，因此能有效降低 AI 模型誤判的機率","顯著性圖所呈現的熱點區域，可直接作為病灶實際範圍與大小的判定依據，協助醫師進行病灶量測","顯著性圖可呈現模型對預測結果具有較大影響的影像區域，協助醫師理解模型判斷依據並進行視覺化複核","顯著性圖可自動標示病灶邊界，作為醫師進行病灶分割(Segmentation)與面積量測的依據"],"a":2,"e":"顯著性圖以熱點呈現對預測影響較大的影像區域，幫助醫師理解模型依據並進行視覺化複核。它只是解釋工具，不會提升模型本身的準確度或降低誤判率；熱點區域只代表模型關注之處，不等於病灶的實際邊界、範圍或大小，不能用於病灶量測或取代影像分割。","src":"115年第三次 第46題"},{"id":"ai-115-3-47","s":"ai","q":"某跨國企業計劃導入「多語言智慧客服系統」，希望系統既能精準捕捉各國語言的在地化文化與特性，又能共享核心的跨語言語意理解能力，以降低維護多套模型的營運成本。下列哪一種模型方案最適當？","o":["採用具備跨語言參數共享機制的大型多語言模型，必要時搭配多專家混合(MoE)等架構提升不同語言的處理能力","針對每一種目標語言，各自訓練與部署獨立的單語言模型","採用標準、未經調整的通用輕量化模型，在不區分語言差異的情況下統一回應","將所有非主要語言內容先翻譯成單一語言，再交由單語言模型處理，不保留原始語言資訊"],"a":0,"e":"大型多語言模型透過跨語言參數共享學習共通的語意理解，必要時搭配 MoE 讓不同專家處理不同語言特性，可兼顧在地化與降低維護成本。各語言獨立建模維運成本高；未調整的通用輕量模型無法掌握語言差異；一律翻譯成單一語言會流失原文的文化語境與語意。","src":"115年第三次 第47題"},{"id":"ai-115-3-48","s":"ai","q":"某法律事務所導入生成式 AI 協助律師查詢法規與合約內容。系統需要根據使用者提問，即時查詢時常動態更新的外部法規資料及數百頁合約中的相關條文。為了避免每次提問都將數百頁文件全部輸入模型而導致極高的 Token 運算成本與回應延遲，下列何種架構最適合此需求？","o":["將整份文件反覆摘要壓縮，再以摘要內容作為模型回答問題的依據","依文件章節建立固定摘要，每次查詢皆由模型搜尋摘要內容回答問題","每次新增法規或更新合約內容時，重新微調(Fine-tuning)地端模型，使模型學習最新內容","採用檢索增強生成(RAG)架構，將完整文件向量化存於外部資料庫，依查詢內容即時檢索相關片段供模型參考"],"a":3,"e":"RAG 將文件切塊向量化存在外部資料庫，查詢時只檢索相關片段給模型參考，可避免每次輸入整份文件，降低 Token 成本與延遲，且更新資料只需更新資料庫。反覆摘要或固定摘要會遺失條文細節；每次法規更新就重新微調成本高、時效差，不適合經常變動的資料。","src":"115年第三次 第48題"},{"id":"ai-115-3-49","s":"ai","q":"某金融機構計劃開發一套智慧理賠防詐欺與自動化審查系統。該系統的運作流程為：先由模型 A 分析客戶上傳的診斷書與收據影像，評估並輸出該案件屬於「正常理賠」或「疑似詐欺(高風險)」的機率值；確認為正常案件後，再由模型 B 根據診斷書內容進行上下文語意推理，自動撰寫客製化的理賠通知信函與案件摘要報告。下列關於兩個模型的敘述，何者最正確？","o":["模型 A 負責判斷案件風險，屬於鑑別式 AI；模型 B 負責產生通知信與摘要內容，屬於生成式 AI","模型 A 會產生風險分數，因此屬於生成式 AI；模型 B 負責解讀與鑑定內容，因此屬於鑑別式 AI","兩個模型皆採用深度學習技術，因此皆屬於生成式 AI","兩個模型皆以分析資料內容為主，因此皆屬於鑑別式 AI"],"a":0,"e":"模型 A 輸出「正常／疑似詐欺」的機率，屬判斷與分類，是鑑別式 AI；模型 B 根據內容撰寫通知信與摘要，產出新內容，是生成式 AI。產生風險分數不代表是生成式；使用深度學習不等於生成式 AI；B 負責撰寫新文字，也不能歸為以分析為主的鑑別式。","src":"115年第三次 第49題"},{"id":"ai-115-3-50","s":"ai","q":"某金控公司計劃導入「美股即時分析 AI 助理」，該助理須同時滿足兩項需求：第一，回覆內容須遵循固定的合規格式與專業口吻；第二，能提供當日最新股價及財報等即時更新資訊。關於技術團隊對上述需求所提出的技術建議，下列何者最為正確？","o":["對第二項需求，採用 Fine-tuning 比 RAG 更合適，因為可持續將最新資料微調至模型權重，以避免模型產生事實幻覺","針對第一項需求，採用 RAG 比 Fine-tuning 更合適，因為 RAG 可將合規規範文件檢索後提供模型參考，使模型自然維持固定格式","針對第二項需求，採用 RAG 較為合適，因為每日更新的股價與財報若持續透過Fine-tuning 維護，難以兼顧時效性與維護成本","針對第一項需求，採用 Fine-tuning 較為合適，因為微調能改變模型對特定知識的記憶，無法影響模型的輸出格式與口吻"],"a":2,"e":"每日更新的股價與財報變動頻繁，用 RAG 即時檢索最新資料，不必反覆微調模型，兼顧時效與維護成本。微調難以追上每日資料更新，也無法根除幻覺；固定格式與專業口吻屬行為風格，較適合透過微調塑造，而非單靠 RAG 檢索；說微調無法影響格式與口吻也是錯的。","src":"115年第三次 第50題"},{"id":"ai-115-2-01","s":"ai","q":"某地方政府委託資料科學團隊，針對選舉期間的社群媒體貼文進行大規模輿情分析，目標是了解選民對各政策議題的態度傾向。團隊規劃整合多種 AI 技術以提升分析涵蓋率。下列哪一種技術組合最符合上述需求，且不涉及對特定個人的身份辨識？","o":["情感分析結合關鍵詞提取，分析貼文內容的立場與高頻議題詞彙","文本分類結合人臉辨識，辨識發文者身份後再進行政治立場分類","語音辨識結合影像辨識，將選舉造勢影片轉換為可分析的文字資料，並進行內容整理與主題歸納","推薦系統結合社群圖譜分析，針對個別使用者預測其投票選擇"],"a":0,"e":"情感分析可判斷貼文對政策的立場傾向，關鍵詞提取能找出高頻議題，兩者只分析內容本身，不涉及辨識特定個人。結合人臉辨識辨認發文者身分、針對個別使用者預測投票選擇，都侵犯個人隱私；語音與影像辨識處理的是造勢影片，並非針對社群貼文的輿情分析。","src":"115年第二次 第1題"},{"id":"ai-115-2-02","s":"ai","q":"某物流公司正在規劃導入 AI 系統以優化多項業務流程，包含異常包裹偵測、路線自動規劃與倉儲揀貨效率提升。技術團隊在評估過程中，針對不同任務的資料特性與學習目標，討論應採用哪種機器學習方式。請問下列對於各學習方式的敘述，何者有誤？","o":["監督式學習(Supervised Learning)適合用於異常包裹偵測，前提是須備有大量已標註為正常或異常的歷史資料","非監督式學習可(Unsupervised Learning)用於分析倉儲揀貨動線的潛在分群，但無法直接預測特定行為的對錯","強化學習(Reinforcement Learning)適合應用於路線規劃，模型透過反覆嘗試與環境回饋，逐步找出最佳配送策略","非監督式學習(Unsupervised Learning)可用於異常包裹偵測，並能在缺乏標註資料的情況下，準確判斷每筆資料是否屬於特定異常類別"],"a":3,"e":"本題選錯誤敘述。非監督式學習可在缺乏標註時找出偏離常態的資料，但因沒有標籤，無法「準確判斷」每筆資料屬於哪種特定異常類別，該敘述誇大其能力。其餘敘述正確：監督式異常偵測需大量標註資料；非監督可分析揀貨動線分群；強化學習透過環境回饋優化路線規劃。","src":"115年第二次 第2題"},{"id":"ai-115-2-03","s":"ai","q":"某電子製造公司在產線上導入 AI 系統，自動判斷電路板是否存在焊接瑕疵，並取代人工目視檢查。該系統需處理大量產品外觀影像，並在高產量環境下短時間內完成品質判定。下列何者最不符合此應用所展現的 AI 核心技術能力？","o":["自然語言處理(Natural Language Processing)","電腦視覺(Computer Vision)","異常偵測(Anomaly Detection)","診斷性分析(Diagnostic Analytics)"],"a":0,"e":"本題選最不符合者。電路板焊接瑕疵檢
