測是處理產品外觀影像，自然語言處理處理的是文字與語言，與此應用無關。電腦視覺負責影像辨識；異常偵測找出不同於正常品的瑕疵；診斷性分析協助判斷瑕疵原因，皆與此系統的能力相關。","src":"115年第二次 第3題"},{"id":"ai-115-2-04","s":"ai","q":"某金融科技公司的交易系統，在毫秒等級的時間內持續掃描跨市場價格差異、分析大量即時報價，並自動執行交易指令。系統架構師在技術選用評估時，需確認該系統於即時交易決策中最核心依賴的 AI 能力。下列何者最能正確說明其核心 AI 能力？","o":["透過自然語言處理技術分析財經新聞語意，作為輔助性市場情緒指標","快速分析龐大市場數據並在極短時間內識別交易機會，驅動自動化交易決策","運用生成對抗網路模擬極端市場情境，預先產出各類黑天鵝事件的應對策略","透過推薦系統技術，根據投資人歷史交易行為推薦最適合的投資組合標的"],"a":1,"e":"毫秒級套利交易的核心是快速分析大量即時市場數據、在極短時間內識別交易機會並自動下單。新聞語意分析只是輔助性情緒指標，非即時決策核心；以 GAN 模擬極端情境屬事前壓力測試；推薦投資組合是針對投資人的服務，與自動化即時交易無關。","src":"115年第二次 第4題"},{"id":"ai-115-2-05","s":"ai","q":"某地方政府導入 AI 系統審核低收入補助資格。系統已通過內部測試且準確率高，但民間團體指出不同族群核准率差異顯著。政府表示該系統由專業廠商開發，且未接獲大量申訴。依《人工智慧基本法》精神，下列何者為最適當之優先作法？","o":["要求廠商提出無歧視聲明，並持續觀察","提升模型整體準確率，以降低錯誤影響","進行偏誤影響評估並建立可解釋與申訴機制","因尚無大量申訴，暫不調整現行制度"],"a":2,"e":"人工智慧基本法強調公平、透明與可問責；面對族群核准率差異，應主動進行偏誤影響評估，並建立可解釋與申訴機制。只要求廠商聲明無歧視、僅提升整體準確率、或以申訴不多為由不調整，都未正視可能存在的系統性偏誤，也無法保障受影響者的權益。","src":"115年第二次 第5題"},{"id":"ai-115-2-06","s":"ai","q":"某 AI 新創公司申請 AI 系統認證，並聲稱其產品已通過我國「AI 產品與系統評測中心」之生成式 AI 評測。下列何者不屬於該中心之評測項目？","o":["資安(Secure)","公平性(Fair)","效率性(Efficiency)","可靠性(Reliability)"],"a":2,"e":"本題選不屬於者。我國 AI 產品與系統評測中心的生成式 AI 評測項目涵蓋安全性、可解釋性、韌性、公平性、準確性、透明性、問責性、可靠性、隱私與資安等可信任面向，「效率性」不在其中。資安、公平性與可靠性都是評測中心明列的項目。","src":"115年第二次 第6題"},{"id":"ai-115-2-07","s":"ai","q":"某媒體集團計畫自行訓練一套生成式 AI 系統，用於自動產出新聞摘要與評論內容。在專案啟動會議中，法務與技術團隊共同討論如何從訓練階段就降低模型產出有害或偏頗內容的風險，並兼顧內容的多元性與公平性。請問下列哪一項措施最應該在模型訓練階段優先落實？","o":["確保訓練資料來源多元，並經過嚴格的內容清洗與偏見過濾，以減少模型學習到有害或偏頗資訊的風險","完全避免使用任何外部文本資料，以降低模型學習到不當內容的可能性","僅使用公司內部的新聞稿與公告進行訓練，確保資料來源可控且符合企業立場","限制模型僅能產出固定格式的內容，從輸出端約束模型避免生成不當資訊"],"a":0,"e":"要從訓練階段降低有害或偏頗輸出，最根本的是確保訓練資料來源多元，並經內容清洗與偏見過濾。完全不用外部資料或僅用公司內部稿件，會讓資料偏狹、缺乏多元性，反而可能加深立場偏誤；限制輸出格式屬輸出端控制，並非訓練階段的措施。","src":"115年第二次 第7題"},{"id":"ai-115-2-08","s":"ai","q":"某保險公司規劃推出一套 AI 核保輔助系統，針對線上投保申請進行初步風險評估並自動回覆審核結果。系統開發完成後，依據金融機構運用人工智慧技術作業規範，系統在正式與消費者互動前，必須確認相關揭露義務已落實。請問下列何者不屬於該規範要求金融機構必要揭露的事項？","o":["詳細公開本系統所採用的機器學習模型架構與完整訓練資料內容","說明本服務的適用對象與用途範圍，使消費者了解系統的使用限制與服務邊界","說明當消費者對 AI 核保結果有異議時，是否提供人工複核或申訴管道","告知消費者本次核保審查結果係由 AI 系統自動完成，非人工逐案審核"],"a":0,"e":"本題選不屬於必要揭露者。金融業 AI 規範要求向消費者揭露使用了 AI、服務的適用範圍與限制，以及人工複核或申訴管道；但並未要求公開模型架構與完整訓練資料，這些可能涉及營業秘密與個資，也非消費者理解服務所必需。","src":"115年第二次 第8題"},{"id":"ai-115-2-09","s":"ai","q":"某大型醫院導入 AI 輔助診斷系統，用於分析病患的電子病歷與影像資料並提供疾病風險評分。系統上線後，院方陸續收到三類回饋：①放射科醫師反映無法理解系統判斷某病患為高風險的依據與理由；②數位治理委員會發現系統對特定族裔病患的誤診率顯著偏高；③資訊安全部門指出部分病患個資在未告知當事人的情況下被納入模型再訓練。依據 AI 倫理五大核心原則，上述三類問題分別對應哪一項原則的違反？","o":["①違反安全性、②違反問責性、③違反透明性","①違反隱私性、②違反安全性、③違反公平性","①違反公平性、②違反透明性、③違反問責性","①違反透明性、②違反公平性、③違反隱私性"],"a":3,"e":"①醫師看不懂系統判斷高風險的依據，是缺乏可解釋性，違反透明性；②特定族裔誤診率偏高，屬差別待遇，違反公平性；③未告知即把病患個資用於再訓練，違反隱私性。其他配對把無法理解依據歸為安全或公平、把族群誤診歸為問責或透明等，皆對應錯誤。","src":"115年第二次 第9題"},{"id":"ai-115-2-10","s":"ai","q":"某市政府環保局計畫建立空氣品質監測 AI 系統，需整合全市 5 萬個感測器的即時數據(每秒產生大量資料記錄)，並持續接收氣象、交通與工廠排放等資料，且需即時處理持續產生的資料。就大數據特性分析，下列何者最能說明此專案面臨的主要挑戰組合？","o":["Volume 與 Velocity，因為資料量龐大且持續高速產生","Variety 與 Veracity，因為資料來源多元且需確保正確性","Velocity 與 Value，因為需即時判斷資料是否具有分析價值","Volume 與 Value，因為需從大量資料中篩選出有用資訊"],"a":0,"e":"5 萬個感測器每秒產生大量紀錄，對應資料量（Volume）；資料持續湧入且需即時處理，對應速度（Velocity）。題目雖提到多種來源，但敘述重點在資料量與即時性；正確性（Veracity）與價值（Value）在題幹中並非主要描述的挑戰。","src":"115年第二次 第10題"},{"id":"ai-115-2-11","s":"ai","q":"某保險公司建立理賠風險預測模型時，資料科學家在特徵選擇階段提出以「性別」作為預測愛滋病毒感染風險的輸入特徵之一。資料治理委員會在審查特徵清單時，對此提出異議。下列哪一項理由最能說明「以性別預測愛滋病毒感染風險」是不適當的原因？","o":["性別為類別型變數，需進行編碼轉換才能輸入模型，增加前處理複雜度","性別特徵在資料集中可能存在缺失值，影響模型訓練的穩定性","以性別作為感染風險的代理特徵，會強化對特定族群的歧視性標籤，違反公平性原則","性別特徵與感染風險之間的統計相關性有限，可能降低模型預測效能"],"a":2,"e":"以性別作為愛滋病毒感染風險的代理特徵，會把感染風險與特定族群連結，強化歧視性標籤，違反公平性原則，這是倫理層面的根本問題。需要編碼、可能有缺失值都是一般技術問題，可透過前處理解決；統計相關性高低也不是反對使用的核心理由。","src":"115年第二次 第11題"},{"id":"ai-115-2-12","s":"ai","q":"某製造業導入 AI 進行生產排程，需整合 ERP(企業資源規劃系統)訂單資料、設備感測器產生的連續數值紀錄，以及維修技師手寫異常描述(掃描為 PDF)。資料治理主管需判斷三類資料的型態。下列何者最能正確對應其資料型態？","o":["ERP 訂單資料為半結構化、感測器數值為結構化、維修文字描述為非結構化","ERP 訂單資料為結構化、感測器數值為結構化、維修文字描述為非結構化","ERP 訂單資料為結構化、感測器數值為非結構化、維修文字描述為半結構化","三者皆屬結構化資料，因為都可以轉換為數值格式後進行分析"],"a":1,"e":"ERP 訂單是固定欄位的資料表，屬結構化；感測器連續數值紀錄具固定格式（時間、數值），也屬結構化；手寫異常描述掃描成 PDF，沒有固定結構，屬非結構化。ERP 資料並非半結構化；感測器數值也不是非結構化；手寫文字並非能轉成數值就算結構化資料。","src":"115年第二次 第12題"},{"id":"ai-115-2-13","s":"ai","q":"某銀行建立機器學習模型預測客戶的貸款違約風險。資料集中有一個「職業類別」欄位，包含「工程師、教師、業務、自由業」等類別。工程師計劃將此欄位進行編碼處理後直接輸入線性模型。下列哪一種編碼方式最可能導致模型錯誤解讀類別之間的關係？","o":["One-Hot Encoding","Binary Encoding","Target Encoding","Label Encoding"],"a":3,"e":"Label Encoding 會把職業類別轉成 0、1、2、3 等整數，線性模型會誤以為類別間有大小順序與等距關係。One-Hot 以獨立欄位表示各類別、沒有順序問題；Binary Encoding 以二進位拆欄；Target Encoding 以目標平均值編碼，較不會被解讀為人為順序。","src":"115年第二次 第13題"},{"id":"ai-115-2-14","s":"ai","q":"某能源公司以過去三年每小時用電資料建立需求預測模型，並以 5-fold 交叉驗證評估，但上線後誤差偏高。技術主管認為問題出在資料分割方式。下列何者最能說明使用標準 k-fold 交叉驗證的根本問題？","o":["k-fold 交叉驗證需要的計算資源過大，不適合處理三年以上的長期資料","k-fold 交叉驗證會隨機分割資料，使訓練集中可能包含比測試集更晚的時間點，破壞時間依賴性","k-fold 交叉驗證的折數設定過少，應改為 10-fold 以提升驗證穩定性","k-fold 交叉驗證僅適用於分類問題，不適合電力需求這類連續數值預測任務"],"a":1,"e":"標準 k-fold 會打亂資料隨機分割，可能用未來的資料訓練、預測過去，破壞時間依賴並造成資訊洩漏，驗證結果過度樂觀，上線後誤差才會偏高。時間序列應改用滾動或前推式驗證。計算資源、折數多寡都不是根本問題；k-fold 也可用於迴歸任務。","src":"115年第二次 第14題"},{"id":"ai-115-2-15","s":"ai","q":"某醫療院所建置病患再住院風險預測模型，特徵包含「年齡」、「體重」、「血壓數值」及「診斷類別代碼」等，資料科學家考慮是否需對數值特徵進行標準化(Standardization)處理。下列何種模型對特徵尺度最不敏感、最適合在不進行標準化的情況下直接使用上述特徵進行訓練？","o":["線性迴歸(Linear Regression)","支援向量機(Support Vector Machine)","K 近鄰演算法(K-Nearest Neighbors)","決策樹(Decision Tree)"],"a":3,"e":"決策樹依特徵門檻值逐一切分資料，只看數值大小順序，不受量綱影響，因此不需標準化。K 近鄰以距離計算相似度，SVM 依距離找最大間隔，尺度差異會嚴重影響結果；線性迴歸若使用梯度下降或正則化，也會受特徵尺度影響，通常建議標準化。","src":"115年第二次 第15題"},{"id":"ai-115-2-16","s":"ai","q":"某企業集團在多個領域導入 AI 技術，應用於不同業務場景。請問下列哪一項最符合異常檢測(Anomaly Detection)的主要應用目標？","o":["分析客戶的消費行為資料，將客群依偏好進行分群，以制定差異化行銷策略","根據歷史交易與客戶資料，建立模型預測未來可能發生違約的客戶","彙整企業各部門的營運數據，建立儀表板供管理層追蹤關鍵績效指標(KPI)的變化","從設備感測資料中，即時偵測出與正常運作模式顯著偏離的訊號，以預警可能發生的故障"],"a":3,"e":"異常檢測的目標是找出明顯偏離正常模式的資料，例如從感測資料即時偵測異常訊號以預警故障。依偏好分群客戶屬分群分析；預測未來違約屬監督式分類預測；建立儀表板追蹤 KPI 屬描述性分析與商業智慧，都不是以找出異常為主要目標。","src":"115年第二次 第16題"},{"id":"ai-115-2-17","s":"ai","q":"某交通局計劃將公車乘客刷卡資料提供給學術機構進行通勤模式研究，該資料包含卡號、上下車時間、路線編號等欄位，且需保留跨時間追蹤同一乘客行為能力。為保護乘客隱私，下列哪種處理方式最符合個人資料保護法的去識別化要求？","o":["將卡號欄位全部刪除，僅保留上下車時間與路線編號","對卡號進行 MD5 雜湊處理，並保留對照表供查詢","將資料彙總為每日各路線總乘客數統計","將卡號替換為隨機編號，且不保留任何對應關係"],"a":3,"e":"將卡號替換為隨機編號且不保留對應關係，仍可追蹤同一乘客跨時間的行為，又無法還原真實身分，符合去識別化要求。直接刪卡號或彙總為每日總數會失去追蹤個人行為的能力；MD5 雜湊並保留對照表可回推身分，屬可逆的假名化，保護不足。","src":"115年第二次 第17題"},{"id":"ai-115-2-18","s":"ai","q":"某工業感測器回傳溫度時序資料，約 5%出現遺漏值，確認為短暫失聯所致，非設備異常。資料工程師需在不引入虛假異常的前提下進行補值。考量資料具時間連續性，下列何種填補方式最為合適？","o":["將遺漏值全數填補為 0","以前後時間點的觀測值進行線性插補","填補整份資料的平均值","直接刪除包含遺漏值的時間點"],"a":1,"e":"溫度具時間連續性，用前後時間點觀測值線性插補最能貼近實際變化，也不會產生虛假異常。填 0 會造成溫度驟降的假異常；整份資料的平均值忽略當下的局部水準；直接刪除時間點會破壞序列連續性與等間隔特性，影響後續時序分析。","src":"115年第二次 第18題"},{"id":"ai-115-2-19","s":"ai","q":"某溫室農場開發 AI 系統自動識別作物葉片上的害蟲種類，測試結果顯示：在1000 張測試影像中，系統正確識別出 80 隻害蟲，但誤判了 20 張正常葉片為有害蟲，同時漏檢了 10 隻實際存在的害蟲。對於害蟲檢測這個關鍵任務，下列哪個評估指標最需要優先關注？","o":["召回率(Recall)","精確率(Precision)","準確率(Accuracy)","F1 分數(F1-Score)"],"a":0,"e":"害蟲檢測的關鍵是不要漏掉真正的害蟲，漏檢的代價（蟲害擴散）遠高於誤報，因此應優先關注召回率＝TP÷（TP＋FN）＝80÷90≈89%。精確率著重減少誤報；準確率在多數為正常葉片的不平衡資料下容易失真；F1 兼顧兩者，但未突顯降低漏檢的需求。","src":"115年第二次 第19題"},{"id":"ai-115-2-20","s":"ai","q":"某跨國企業需透過網路將各國子公司之敏感資料傳輸至總部進行模型訓練。資訊安全主管要求在傳輸過程中防範中間人攻擊，避免資料遭竊取或竄改。在不影響系統跨國即時傳輸效率之前提下，下列哪一項措施最能有效降低此風險？","o":["在接收端加強存取權限與身分驗證，限制只有授權人員可讀取資料","在資料傳輸過程中進行加密，並確認雙方身分以確保通訊安全","將資料拆分為多個部分分批傳送，降低單次資料外洩風險","改用離線備援方式進行跨國資料交換，以降低網路攻擊風險"],"a":1,"e":"防範中間人攻擊的關鍵是傳輸加密（如 TLS）加上雙方身分驗證，確保資料不被竊聽或竄改，且不影響即時傳輸效率。接收端權限控管保護的是落地後的資料，不是傳輸過程；分批傳送無法防止被攔截；改用離線交換雖可避開網路攻擊，卻犧牲了即時性。","src":"115年第二次 第20題"},{"id":"ai-115-2-21","s":"ai","q":"關於深度學習(Deep Learning)，下列敘述何者最為正確？","o":["深度學習模型通常需要人工設計特徵，以提升模型表現","深度學習主要應用於資料壓縮與特徵轉換，較少用於預測任務","深度學習透過多層神經網路，能自動從大量資料中學習抽象特徵","深度學習模型通常不需要大量資料即可達到良好效果，適合資料量有限的情境"],"a":2,"e":"深度學習以多層神經網路逐層從大量資料中自動學習由低階到高階的抽象特徵，不需大量人工設計特徵。依賴人工特徵設計是傳統機器學習的特性；深度學習廣泛用於分類、預測等任務，不限於資料壓縮；且通常需要大量資料才能發揮效果，資料量少時容易過擬合。","src":"115年第二次 第21題"},{"id":"ai-115-2-22","s":"ai","q":"某企業於不同業務場景導入 AI 應用。下列關於其應用情境與機器學習類型的敘述，何者正確？","o":["客服對話分析中，同時使用少量標註資料與大量未標註資料進行訓練，屬於監督式學習(Supervised Learning)","商品分類系統依據顧客購買行為自動將商品分群，且未使用任何標註資料，屬於監督式學習(Supervised Learning)","自動駕駛系統根據操作結果的回饋持續調整決策策略，屬於非監督式學習(Unsupervised Learning)","使用者行為分析中，依據瀏覽與點擊模式將使用者分群，且未使用標註資料，屬於非監督式學習(Unsupervised Learning)"],"a":3,"e":"依瀏覽與點擊模式分群且未使用標註資料，正是非監督式學習的典型應用。同時使用少量標註與大量未標註資料是半監督式學習，不是監督式；未使用標註資料的商品分群屬非監督式；依操作結果回饋持續調整策略的自動駕駛屬強化學習，並非非監督式學習。","src":"115年第二次 第22題"},{"id":"ai-115-2-23","s":"ai","q":"某房仲業者委託 AI 團隊開發一套房價預測系統，希望根據物件坪數、屋齡、樓層與地段等條件，自動估算每間房屋的成交價格，供業務人員作為議價參考依據。下列哪一種指標最適合在系統上線前評估模型的預測準確程度？","o":["均方誤差(MSE)","精確率(Precision)","F1 分數(F1 Score)","召回率(Recall)"],"a":0,"e":"房價預測的輸出是連續數值，屬迴歸問題，應以均方誤差（MSE）衡量預測值與實際成交價的差距。精確率、召回率與 F1 分數都是分類問題的評估指標，用於判斷類別預測的對錯，無法衡量連續數值預測的誤差大小。","src":"115年第二次 第23題"},{"id":"ai-115-2-24","s":"ai","q":"某電商平台導入強化學習(Reinforcement Learning)技術優化商品推薦策略，AI代理(AI Agent)會根據使用者的點擊與購買行為持續調整推薦內容。技術團隊在討論中發現，系統面臨一個核心挑戰：若 AI Agent 總是推薦過去表現良好的商品，可能會錯失發掘更高潛力商品的機會；但若頻繁嘗試未知商品，又可能影響短期的推薦成效與使用者體驗。請問上述情境敘述的是強化學習中哪一個核心問題？","o":["探索與利用的權衡(Exploration vs. Exploitation)","偏差與變異的權衡(Bias vs. Variance)","梯度爆炸與消失(Vanishing and Exploding Gradients)","過擬合與欠擬合(Overfitting and Underfitting)"],"a":0,"e":"持續推薦已知表現好的商品是「利用」，嘗試未知商品以發掘更高潛力是「探索」；兩者之間的取捨正是強化學習的探索與利用權衡。偏差與變異權衡、過擬合與欠擬合屬模型泛化問題；梯度爆炸與消失屬神經網路訓練穩定性問題，皆與推薦策略的取捨無關。","src":"115年第二次 第24題"},{"id":"ai-115-2-25","s":"ai","q":"某語音辨識系統需分析長時間的語音序列，發現當句子較長時，模型難以保留長時間序列中的前段資訊，導致辨識準確度下降。為改善此問題，下列何種模型最適合？","o":["長短期記憶網路(LSTM)","循環神經網路(RNN)","卷積神經網路(CNN)","生成式對抗網路(GAN)"],"a":0,"e":"LSTM 透過輸入閘、遺忘閘、輸出閘與記憶單元，能選擇性保留長期資訊，解決傳統 RNN 的長期依賴與梯度消失問題，適合長語音序列。傳統 RNN 正是難以保留前段資訊的模型；CNN 擅長局部特徵擷取；GAN 用於生成資料，都不適合解決此問題。","src":"115年第二次 第25題"},{"id":"ai-115-2-26","s":"ai","q":"某大型連鎖超市建置生鮮商品損耗預測模型，以減少報廢損失。資料庫中共有120 萬筆銷售紀錄，但僅有約 8 萬筆資料標記為「正常銷售」或「損耗發生」，其餘資料均未標註。在標註資源有限的情況下，團隊希望提升模型預測表現。請問下列哪一種機器學習方式最適合此情境？","o":["監督式學習(Supervised Learning)，以 8 萬筆已標註資料訓練分類模型，捨棄其餘 112 萬筆無標註資料","半監督式學習(Semi-supervised Learning)，同時利用少量已標註資料學習分類邊界，並從大量無標註資料中學習資料整體分布特性","非監督式學習(Unsupervised Learning)，對全部 120 萬筆資料進行自動分群，再由專家事後人工確認各群所代表的損耗類型","強化學習(Reinforcement Learning)，讓模型在每次預測後依據實際損耗結果作為回饋訊號，持續調整損耗預警策略"],"a":1,"e":"只有約 8 萬筆標註、112 萬筆未標註，最適合半監督式學習：以少量標註學習分類邊界，再利用大量未標註資料掌握整體分布，提升模型表現。只用標註資料會浪費大量資訊；純分群再人工確認效率低且不精確；強化學習用於序列決策，並非處理標註不足的方法。","src":"115年第二次 第26題"},{"id":"ai-115-2-27","s":"ai","q":"某製造業評估在不同場景導入 AI，包含：(甲)依據設備感測器數值判斷是否出現異常；(乙)依據客服對話內容判斷客戶情緒；(丙)依據產品影像輪廓直接進行瑕疵分類。下列哪一種情境最適合以自編碼器(Autoencoder)作為主要模型架構？","o":["甲","乙","丙","甲與丙"],"a":0,"e":"自編碼器以正常資料學習壓縮與重建，遇到異常資料時重建誤差會變大，最適合用於設備感測數值的異常判斷（甲）。客服對話情緒判斷（乙）屬文本分類，適合語言模型；依影像輪廓直接做瑕疵分類（丙）屬監督式影像分類，較適合 CNN，自編碼器並非主要架構。","src":"115年第二次 第27題"},{"id":"ai-115-2-28","s":"ai","q":"某 AI 團隊正在訓練一個深度神經網路，用於辨識工廠產線上的瑕疵零件。工程師發現訓練過程中損失函數震盪幅度大，且不同批次資料造成模型學習方向不穩定。為改善此問題，團隊在各隱藏層加入 Batch Normalization 機制。請問此調整在訓練階段最主要的作用為何？","o":["將輸入影像標準化，使不同類別的特徵分布更加一致","自動調整模型權重初始化方式，以避免訓練初期震盪","增加模型隱藏層的非線性能力，以提升分類精度上限","降低不同批次輸入造成的內部特徵分布變動，使梯度更新更穩定"],"a":3,"e":"Batch Normalization 在各層對小批次的輸出做標準化，降低不同批次造成的內部特徵分布變動（內部共變量偏移），讓梯度更新更穩定、可用較大學習率加速收斂。它作用在隱藏層而非只處理輸入影像；不會改變權重初始化方式；本身也不是用來增加非線性能力。","src":"115年第二次 第28題"},{"id":"ai-115-2-29","s":"ai","q":"某 AI 研究團隊採用 GRPO(Group Relative Policy Optimization)作為一種基於強化學習的模型優化方法，用於提升大型語言模型的表現。請問 GRPO 最適合用來強化模型在哪一類任務上的表現？","o":["判斷客服留言的情緒傾向，將每則訊息快速歸類為正面、負面或中性","將客服電話錄音即時轉換為文字，供後續人工審閱使用","針對數學應用題或邏輯謎題，逐步推導出正確解答","分析商品圖片的外觀特徵，自動辨識類別與品項"],"a":2,"e":"GRPO 是強化學習優化方法，對同一題產生一組回答，以組內相對獎勵比較優劣來更新策略，特別適合答案可驗證的數學、邏輯推理任務，強化模型逐步推導能力（如 DeepSeek-R1）。情緒分類、語音轉文字與商品影像辨識屬感知或分類任務，非 GRPO 的主要強項。","src":"115年第二次 第29題"},{"id":"ai-115-2-30","s":"ai","q":"某法律科技公司開發一套合約風險審查系統，可自動分析合約內容並標示潛在的高風險條款。律師在使用過程中，希望了解模型做出風險判斷的依據，因此系統導入顯著性圖(Saliency Map)作為可解釋 AI 的方法。請問在此自然語言處理(Natural Language Processing, NLP)應用情境中，顯著性圖主要用來標示什麼？","o":["合約中各段落之間的語意相似程度，協助辨識重複或可能矛盾的條款","模型在進行預測時，輸入文字中對結果影響程度較高的文字片段","不同版本合約之間的文字差異，用以標示新增或修改的條款位置","模型在訓練資料中學習到的高頻詞彙，反映常見的風險相關用語"],"a":1,"e":"在 NLP 情境中，顯著性圖會標示輸入文字中對模型預測影響較大的字詞或片段，幫助律師理解模型為何判定某條款高風險。段落語意相似度、合約版本差異比對、訓練資料的高頻詞彙統計，都不是針對單次預測解釋輸入重要性的顯著性圖用途。","src":"115年第二次 第30題"},{"id":"ai-115-2-31","s":"ai","q":"某製造業 AI 品質預測模型採用部分依賴圖(Partial Dependence Plots, PDP)分析特徵影響效果。資料科學家希望了解「溫度特徵」對良品率的整體影響趨勢，但主管進一步詢問，是否能用 PDP 判斷某一筆瑕疵產品批次資料中，溫度是否為主要原因。下列何者最能說明 PDP 在此情境中的限制？","o":["PDP 無法顯示模型的預測準確率","PDP 僅能反映模型輸出結果，無法提供任何特徵影響的資訊","PDP 僅能用於單一特徵分析，無法同時考慮多個特徵的影響","PDP 僅呈現整體趨勢，無法判斷單一批次的原因"],"a":3,"e":"PDP 透過對其他特徵取平均，呈現某特徵對模型預測的整體平均影響趨勢，屬全域解釋，無法說明單一批次中溫度是否為主因；單筆原因應改用 SHAP、LIME 等局部解釋法。PDP 確實提供特徵影響資訊，也可做雙特徵分析；不顯示準確率並非本題的關鍵限制。","src":"115年第二次 第31題"},{"id":"ai-115-2-32","s":"ai","q":"某銀行使用 LIME(Local Interpretable Model-agnostic Explanations)來解釋其信貸審核模型的決策結果。分析師在閱讀解釋報告時，看到系統建立了一個簡化模型來近似原模型在該筆資料附近的行為。下列何者最能說明 LIME 中代理模型(Surrogate model)的意義？","o":["一個全局解釋所有預測的線性代理模型","用於產生擾動資料的資料生成機制","一種獨立訓練的生成式模型，用於輔助預測","用於擬合原黑箱模型在目標實例附近的預測行為"],"a":3,"e":"LIME 的代理模型是在目標樣本附近，用擾動樣本及黑箱模型的預測結果訓練出的簡單可解釋模型（如線性模型），用來局部近似原模型的行為。它只做局部解釋，不是全局代理模型；也不是產生擾動資料的機制，更不是輔助預測的生成式模型。","src":"115年第二次 第32題"},{"id":"ai-115-2-33","s":"ai","q":"小明在 2025 年使用 AI 模型，將自己的照片轉換為公仔風格影像。該模型在維持生成品質的同時，也能在模型規模較大的情況下兼顧運算效率。下列何者最能敘述此模型可能採用的設計方式？","o":["基於單一稠密 Transformer 架構，每次運算都使用全部模型參數","採用稀疏專家混合(Sparse Mixture-of-Experts)架構，每次僅使用部分模型來提升效率","採用生成對抗網路(GAN)，透過兩個模型互相比較來提升影像品質","採用卷積神經網路(CNN)，直接進行影像轉換"],"a":1,"e":"稀疏專家混合（MoE）架構參數量大，但每次推論只啟動部分專家，可兼顧大規模、生成品質與運算效率。稠密 Transformer 每次動用全部參數，成本高；GAN 與 CNN 雖可做影像轉換，但並非針對大模型效率的設計。（註：題幹未說明模型實際架構，答案依「大模型＋效率」推得，帶推測成分。）","src":"115年第二次 第33題"},{"id":"ai-115-2-34","s":"ai","q":"CLIP 與 DINO 皆屬於自監督學習(Self-supervised Learning)模型，但其訓練資料來源有所不同。下列何者最能正確敘述兩者在訓練資料型態上的差異？","o":["皆使用有標註圖像資料進行監督式學習","皆使用未標註圖像資料進行自監督學習","CLIP 使用圖像與文字配對資料，DINO 使用未標註圖像資料","CLIP 使用未標註圖像資料，DINO 使用圖像與文字配對資料"],"a":2,"e":"CLIP 以大量網路上的圖像與文字配對資料，透過對比學習對齊兩種模態；DINO 則只使用未標註的圖像，以自蒸餾方式學習視覺特徵。兩者都不使用人工標註進行監督式學習，訓練資料型態也不同，因此「皆用未標註圖像」與將兩者資料型態對調的說法都不正確。","src":"115年第二次 第34題"},{"id":"ai-115-2-35","s":"ai","q":"某企業導入大型語言模型(LLM)進行長篇法規文件的問答查詢。使用者反映，當問題需整合文件中較不相關的資訊時，模型回答的連貫性與準確性明顯下降。技術團隊認為此現象與模型架構特性有關。下列何者最能說明傳統Transformer 在此情境下的限制？","o":["模型在推理時僅能依賴固定長度的上下文窗口，無法同時處理分散於全文的資訊","模型能記住的內容取決於訓練語料，推理時遇到新內容可能無法應對","Transformer 在長序列處理時效率下降，但仍可完整處理所有輸入內容","每次推理後 Transformer 都需重新訓練才能記住新的資訊"],"a":0,"e":"傳統 Transformer 只能在固定長度的上下文窗口內運作，超出部分會被截斷，分散各處的資訊難以同時納入推理。訓練語料限制屬知識範圍問題；「可完整處理所有輸入」忽略窗口上限；推理後也不需重新訓練。（註：窗口內自注意力其實能關聯任意位置，題幹未說明文件是否超出窗口，前提略有爭議。）","src":"115年第二次 第35題"},{"id":"ai-115-2-36","s":"ai","q":"小明剛加入一間電商公司擔任 AI 專案的業務窗口，在與技術團隊的交接會議中，工程師說明模型訓練時，會持續比對預測值與實際值之間的差距，並透過一套機制逐步調整模型內部參數，直到預測結果趨於穩定為止。請問工程師敘述的是深度學習中哪個元件的功能？","o":["優化器(Optimizer)","資料前處理模組","模型架構","激活函數(Activation Function)"],"a":0,"e":"工程師描述的是依據預測值與實際值的差距（損失），反覆調整模型內部參數直到收斂的機制，這是優化器（如 SGD、Adam）的功能。資料前處理模組負責清理與轉換資料；模型架構決定網路層數與結構；激活函數為神經元引入非線性，都不負責參數更新。","src":"115年第二次 第36題"},{"id":"ai-115-2-37","s":"ai","q":"某醫療 AI 系統使用深度學習模型分析胸腔 X 光影像，判斷患者是否罹患肺炎。醫院評估委員會要求系統必須能夠標示「影像中哪些區域對本次診斷判斷影響最大」，以供放射科醫師進行審核確認。 下列哪一種可解釋 AI 技術最能直接滿足「標示影像中對預測結果影響最大的區域」此一需求？","o":["LIME(Local Interpretable Model-agnostic Explanations)","SHAP(SHapley Additive exPlanations)","部分依賴圖(Partial Dependence Plot, PDP)","顯著性圖(Saliency Map)"],"a":3,"e":"顯著性圖直接以熱點標示影像中對預測影響最大的像素區域，最能滿足放射科醫師審核影像判斷依據的需求。LIME、SHAP 雖可延伸用於影像，但主要是以特徵或超像素貢獻度解釋，未必能直接呈現熱點；PDP 是呈現單一特徵整體效果的全域方法，不適用於標示影像區域。","src":"115年第二次 第37題"},{"id":"ai-115-2-38","s":"ai","q":"某電商平台希望偵測異常評論行為，例如大量重複貼文或疑似機器人生成的評論。由於此類異常樣本難以事先完整標記，系統主要依據大量正常評論的分布來識別偏離行為。下列哪一種機器學習框架最能滿足此系統的設計需求？","o":["非監督式學習(Unsupervised Learning)的關聯規則挖掘，從評論中找出常見字詞組合","監督式學習(Supervised Learning)的二元分類，從已標記資料學習分類模型","半監督式學習(Semi-supervised Learning)的異常偵測，辨識偏離正常分布的評論行為","強化學習(Reinforcement Learning)，透過回饋機制優化評論判斷策略"],"a":2,"e":"異常樣本難以標記，主要以大量正常評論學習正常分布，再找出偏離者，屬以正常資料建模的半監督式異常偵測（新奇偵測）。關聯規則挖掘只找出常見字詞組合；二元分類需大量已標記的異常樣本；強化學習需要環境回饋，都不符合此設計需求。","src":"115年第二次 第38題"},{"id":"ai-115-2-39","s":"ai","q":"在命名實體辨識(Named Entity Recognition, NER)任務中，模型需根據整句文字判斷每個詞的標籤，並考慮詞與詞之間的關聯性。若採用 Conditional Random Field(CRF)作為模型，下列何者最能描述其模型類型？","o":["生成式模型(Generative Model)","無監督模型(Unsupervised Model)","鑑別式模型(Discriminative Model)","自迴歸模型(Autoregressive Model)"],"a":2,"e":"CRF 直接建模給定整句觀測序列下標籤序列的條件機率 P(Y|X)，並考慮相鄰標籤的關聯，屬鑑別式模型。生成式模型（如 HMM）建模的是聯合機率 P(X,Y)；CRF 需標註資料訓練，不是無監督模型；也不是像語言模型那樣逐一依前文生成下一個元素的自迴歸模型。","src":"115年第二次 第39題"},{"id":"ai-115-2-40","s":"ai","q":"某音樂串流平台希望開發一套 AI 系統，能根據平台上累積的大量歌曲資料，自動生成具有不同風格變化的全新旋律，供創作者作為靈感參考。平台技術長在評估方案時強調，系統不能只是播放或拼接既有歌曲片段，也不能僅進行資料的重建，而是要真正學習音樂的結構與風格，並創作出從未出現過的新旋律。請問下列哪一種模型技術最符合此需求？","o":["K-近鄰演算法(K-Nearest Neighbors, KNN)","自編碼器(Autoencoder)","生成對抗網路(GAN)","隨機森林(Random Forest)"],"a":2,"e":"GAN 透過生成器與鑑別器對抗訓練，學習資料的分布與風格，能創作出從未出現過的新旋律，符合「真正生成新內容」的需求。KNN 與隨機森林是分類或迴歸演算法，不具生成能力；一般自編碼器著重壓縮與重建輸入資料，正是題目要排除的「僅進行資料重建」。","src":"115年第二次 第40題"},{"id":"ai-115-2-41","s":"ai","q":"某資安公司正在評估導入機器學習模型來偵測網路流量中的異常連線行為。技術團隊在比較各種演算法時，其中一位工程師建議採用支援向量機(SVM)。請問下列何者最正確敘述支援向量機的特性？","o":["擅長處理大規模非結構化資料，且模型訓練完成後可自動適應新進資料而無需重新建模","透過多個模型的集體決策來提升預測穩定性，在資料量不足時仍能維持一定的準確率","在高維度且樣本數相對有限的情境下表現良好，但當訓練資料量龐大時運算成本會顯著上升","具備強大的特徵自動萃取能力，特別適合影像與語音等需要逐層抽象化處理的複雜任務"],"a":2,"e":"SVM 透過尋找最大間隔超平面並搭配核函數，在高維度、樣本數有限時表現良好；但訓練複雜度約為樣本數的平方到三次方，資料量龐大時運算成本顯著上升。不擅長大規模非結構化資料也無法自動適應新資料；多模型集體決策是集成學習；逐層自動萃取特徵是深度學習的特性。","src":"115年第二次 第41題"},{"id":"ai-115-2-42","s":"ai","q":"下列哪一項是可解釋人工智慧(XAI)領域，LIME(Local Interpretable Model-agnostic Explanations)最可能被用於的情境？","o":["分析即時通訊系統中訊息傳輸效率的瓶頸","建立機制以強化系統中的資料安全與隱私保護","當某筆貸款申請被模型拒絕時，分析該筆資料中各項因素與結果之間的關聯","監控並優化推薦系統的回應速度與系統效能，以提升整體使用體驗"],"a":2,"e":"LIME 是局部解釋方法，用於說明單筆預測結果，例如某筆貸款被拒時分析各項因素對結果的影響。訊息傳輸效率瓶頸、資料安全與隱私保護、推薦系統的回應速度與效能，都屬系統效能或資安議題，與解釋模型預測無關。","src":"115年第二次 第42題"},{"id":"ai-115-2-43","s":"ai","q":"某信用評分公司導入 SHAP(SHapley Additive exPlanations)框架分析機器學習模型的輸出行為。分析師希望了解：「對於某位特定申請人被評為高風險的信用評分，各項輸入特徵分別對這個評分結果貢獻了多少」。下列哪一項最能正確說明 SHAP Shapley 值在此情境中所提供的資訊？","o":["各特徵在模型訓練過程中對結果穩定性的影響程度","此申請人的各項特徵，分別讓風險評分上升或下降的影響程度","各特徵在所有客戶資料中對整體預測準確度的影響程度","各特徵在模型中被使用的頻率"],"a":1,"e":"SHAP 的 Shapley 值源自賽局理論，量化某筆預測中各特徵相對於基準值的貢獻，說明每個特徵讓這位申請人的風險評分上升或下降多少，屬局部解釋。對訓練穩定性的影響、對整體準確度的影響、特徵被使用的頻率，都不是 Shapley 值所提供的資訊。","src":"115年第二次 第43題"},{"id":"ai-115-2-44","s":"ai","q":"某金融集團評估將大型語言模型導入客服與風控系統，團隊採用如 120B 參數等級的超大型語言模型以確保回應品質。請問下列何者最能說明企業在正式環境部署超大型語言模型時，最需要優先考量的因素？","o":["模型參數量龐大，導致每次輸出結果差異極大，難以符合金融業對回應一致性的要求","超大型模型無法支援批次處理，在高併發的客服場景下將造成嚴重的服務瓶頸","推理延遲較高且運算資源消耗龐大，每次請求成本遠高於小型模型，需在模型效能與營運成本之間審慎權衡","模型會依任務複雜度自動調整運算資源配置，因此不需特別考量推理成本"],"a":2,"e":"百億參數級模型推理需大量 GPU 記憶體與運算，延遲較高、單次請求成本遠高於小型模型，企業部署時必須在效能與營運成本之間權衡。參數量大不代表輸出差異極大，一致性可透過溫度等設定控制；大模型仍可批次處理；模型也不會自動調整資源，因此推理成本必須考量。","src":"115年第二次 第44題"},{"id":"ai-115-2-45","s":"ai","q":"某智慧交通系統在城市主要路口安裝監視攝影機，需即時識別畫面中的汽車、機車、公車等不同車輛類型，並統計各路口的車輛流量以支援號誌控制優化。下列哪一種神經網路架構最適合處理此類影像中的物件類型識別任務？","o":["循環神經網路(RNN)，適合處理序列資料","卷積神經網路(CNN)，適合處理影像資料","長短期記憶網路(LSTM)，適合處理長期依賴","多層感知機(MLP)，將輸入資料轉換為數值後進行分類"],"a":1,"e":"辨識監視器畫面中的汽車、機車、公車屬影像辨識任務，CNN 以卷積擷取空間局部特徵，並是 YOLO 等物件偵測模型的基礎，最為適合。RNN、LSTM 適合處理時間序列與長期依賴；MLP 將影像攤平處理，會失去空間結構且參數量龐大，效果不如 CNN。","src":"115年第二次 第45題"},{"id":"ai-115-2-46","s":"ai","q":"AutoSkill 框架的主要目標是什麼？","o":["建立一個降低對大型語言模型(LLM)依賴的自動化系統","透過持續更新模型參數來提升任務表現","將重複的互動經驗轉化為可重複使用的明確技能模組","透過檢索外部知識來改善模型回應品質"],"a":2,"e":"AutoSkill 框架的目標是從 LLM 代理的重複互動經驗中，自動萃取並整理成明確、可重複使用的技能模組，讓之後遇到類似任務時能直接調用、持續累積能力。它不以降低對 LLM 的依賴為目標，也不靠更新模型參數或檢索外部知識，後者是 RAG 的做法。","src":"115年第二次 第46題"},{"id":"ai-115-2-47","s":"ai","q":"某大型語言模型(LLM)在訓練過程中，研究人員發現模型在生成文本時，長期集中產生少數幾種相似的回應形式，缺乏多樣性。下列何者最能說明此現象及其可能原因？","o":["過度擬合(Overfitting)","模式崩潰(Mode Collapse)","梯度消失(Vanishing Gradient)","模型收斂速度(Convergence Rate)"],"a":1,"e":"模型長期只產生少數幾種相似回應、缺乏多樣性，屬模式崩潰，常見於生成模型或強化學習微調後輸出分布過度集中。過度擬合指模型過度記憶訓練資料、泛化差；梯度消失是深層網路訓練時梯度過小導致學習停滯；收斂速度只是訓練快慢，並非一種現象。","src":"115年第二次 第47題"},{"id":"ai-115-2-48","s":"ai","q":"某電商平台建置機器學習模型，用於預測用戶在瀏覽特定商品後的購買機率。模型上線初期表現穩定，但維運團隊在定期審查中發現兩種不同情形：情形甲：模型上線半年後恰逢消費趨勢轉變，過去高購買意願的用戶行為模式(如長時間停留商品頁)不再是強烈的購買訊號，即便輸入特徵分布與訓練期相近，模型預測準確率仍明顯下降。情形乙：平台新增了行動裝置端的入口，新用戶的年齡分布、裝置類型與使用時段特徵與原訓練資料差異顯著，導致模型對這批用戶的預測偏差增大。下列哪一項最能正確對應兩種情形所屬的模型劣化類型？","o":["甲為資料漂移(Data Drift)、乙為概念漂移(Concept Drift)","甲為概念漂移(Concept Drift)、乙為資料漂移(Data Drift)","甲為模型過擬合(Overfitting)、乙為資料漂移(Data Drift)","甲與乙均屬概念漂移(Concept Drift)，因為兩者都導致模型預測準確率下降"],"a":1,"e":"甲：輸入特徵分布與過去相近，但特徵與購買行為的關係改變，屬概念漂移。乙：新用戶的年齡、裝置等輸入特徵分布與訓練資料明顯不同，屬資料漂移。將兩者對調、把甲歸為過擬合，或以準確率下降為由將兩者都歸為概念漂移，都未掌握兩種漂移的差異。","src":"115年第二次 第48題"},{"id":"ai-115-2-49","s":"ai","q":"某資安公司目前以鑑別式 AI 偵測已知網路攻擊。為因應新型變種攻擊，研究人員計劃利用生成式 AI 模擬可能的攻擊流量，並納入防禦模型訓練。下列何者最能說明此做法對鑑別式 AI 防禦模型的主要助益？","o":["生成式 AI 可取代真實攻擊資料，降低蒐集成本","生成式 AI 可直接負責防禦決策，取代原有模型","模擬攻擊資料可使模型自動轉為生成式架構","將模擬攻擊納入訓練，可提升模型對未知攻擊的辨識能力"],"a":3,"e":"以生成式 AI 模擬可能的變種攻擊流量並納入訓練，可擴增資料多樣性，提升鑑別式模型對未知或新型攻擊的辨識與泛化能力。模擬資料只能輔助，無法完全取代真實資料；生成式 AI 並非用來取代防禦決策；加入模擬資料也不會讓模型轉成生成式架構。","src":"115年第二次 第49題"},{"id":"ai-115-2-50","s":"ai","q":"某企業已部署一套預訓練大型語言模型作為內部知識問答系統，主要用於查詢人資、財務與法遵相關的內部規範。由於公司內規每月都會滾動更新，管理層要求系統在文件更新後必須能立即反映最新內容，不能等待模型重新訓練。技術團隊正在評估應採用檢索增強生成(RAG)還是微調(Fine-tuning)來因應此需求。請問下列哪一項評估最為正確？","o":["採用 Fine-tuning 較為適合，只要定期將更新後的內規文件加入訓練資料，模型便能即時反映最新規範內容","採用 RAG 較為適合，將更新後的文件同步至外部知識庫，模型即可在不重新訓練的情況下立即查詢最新內容","採用 Fine-tuning 較為適合，因為模型經過內規語料訓練後，回應品質會優於透過 RAG 生成的答案","兩者皆可達成需求，差異僅在於建置成本高低，與系統能否即時反映更新內容無關"],"a":1,"e":"RAG 將最新文件同步至外部知識庫，查詢時即時檢索，不必重新訓練就能立即反映內規更新，符合「立即生效」的要求。微調需重新訓練，無法即時反映最新內容；微調不必然比 RAG 回應品質更好；兩者在能否即時反映更新上差異明顯，並非只有成本高低之分。","src":"115年第二次 第50題"},{"id":"ai-mock-01","s":"ai","q":"某連鎖藥局累積了三年的顧客來店紀錄，並由門市人員為每筆紀錄標示「有回購」或「未回購」。若要以這批資料訓練模型，預測新顧客是否會回購，最適合採用下列哪一種學習方式？","o":["強化式學習，讓模型與顧客互動並依獎勵逐步調整策略","監督式學習，以已標示的回購結果作為目標變數訓練分類模型","非監督式學習，依顧客特徵自動分群後再推測回購可能性","自監督學習，從未標註紀錄中自行產生預測目標進行訓練"],"a":1,"e":"資料已具備明確的「有回購／未回購」標籤，屬於以標註資料學習輸入與輸出對應關係的監督式分類任務。非監督式學習不使用標籤；強化式學習需代理人與環境互動取得獎勵；自監督學習是從未標註資料自行建構預訓練任務，均不符合此情境。","src":"模擬題・監督式學習","mock":1},{"id":"ai-mock-02","s":"ai","q":"某量販店想從數百萬筆收銀交易中找出「經常被一起購買」的商品組合（例如買啤酒的人常一併購買花生），以規劃商品陳列。交易資料中沒有任何人工標記的目標欄位。下列哪一種方法最合適？","o":["邏輯迴歸，將每項商品是否被購買作為二元目標變數進行預測","卷積神經網路，將交易明細轉為影像後辨識常見的購買型態","線性迴歸，以商品單價預測每張發票的總消費金額與趨勢","關聯規則探勘，以 Apriori 等演算法找出常被一起購買的商品組合"],"a":3,"e":"找出共同出現的商品組合是典型的購物籃分析，屬於非監督式的關聯規則探勘，Apriori 以支持度、信賴度等指標篩選規則。邏輯迴歸與線性迴歸需要目標變數，且目的分別為分類與數值預測；卷積神經網路適合影像等網格資料，並非處理交易項目集合的合理選擇。","src":"模擬題・非監督式學習","mock":1},{"id":"ai-mock-03","s":"ai","q":"某客服中心累積了 50 萬筆客訴文字紀錄，但人力有限，僅有 5,000 筆完成「帳務、物流、品質、其他」的分類標註。團隊希望在不大量增加標註成本下提升分類模型效果，下列做法何者最合理？","o":["改用強化式學習，讓模型逐筆回覆客訴並以顧客滿意度作為獎勵訊號","以已標註資料訓練初始模型，對未標註資料產生高信心的偽標籤後再一併訓練","只使用 5,000 筆已標註資料訓練，未標註資料因無標籤而全部捨棄不用","將全部 50 萬筆資料直接用 K-means 分成四群，並將群編號視為正式類別"],"a":1,"e":"少量標註搭配大量未標註資料是半監督式學習的典型情境，偽標籤（自我訓練）是常見做法，可充分利用未標註資料。只用少量標註資料會浪費資訊；K-means 分群結果不保證對應業務類別；強化式學習需要互動與獎勵設計，與此分類需求不符。","src":"模擬題・半監督式學習","mock":1},{"id":"ai-mock-04","s":"ai","q":"大型語言模型在預訓練階段，常將句子中部分詞彙遮蔽，再讓模型根據上下文預測被遮蔽的詞，或根據前文預測下一個詞。訓練所需的「答案」直接取自原始文本本身，不需人工標註。此種學習方式最常被稱為下列何者？","o":["自監督學習（Self-supervised Learning）","階層式分群（Hierarchical Clustering）","強化式學習（Reinforcement Learning）","監督式學習（Supervised Learning）"],"a":0,"e":"自監督學習從未標註資料中自行建構預測任務，例如遮蔽語言模型或預測下一個詞，標籤來自資料本身，是大型語言模型預訓練的核心方法。強化式學習依賴獎勵訊號；傳統監督式學習需人工標註；階層式分群的目的在將資料分組，並不進行詞彙預測。","src":"模擬題・自監督學習","mock":1},{"id":"ai-mock-05","s":"ai","q":"某電子倉儲導入自主搬運機器人，機器人每次成功將貨物送達指定儲位可得到正分，碰撞貨架則被扣分，並透過反覆嘗試學習最佳行走路線。在強化式學習的架構中，「送達得分、碰撞扣分」最對應下列哪一個要素？","o":["獎勵（Reward），用來回饋行動結果的好壞並引導策略學習","環境（Environment），代表機器人所在倉庫的空間配置本身","狀態（State），用來描述機器人目前所處的位置與周遭環境","動作（Action），代表機器人在每個時間點可選擇的移動方向"],"a":0,"e":"強化式學習由代理人、環境、狀態、動作與獎勵組成，依行動結果給予的正負分數即為獎勵，代理人以最大化累積獎勵為目標調整策略。狀態描述當下情況；動作是代理人可採取的選擇；環境是代理人互動的外部世界，三者都不是對行動好壞的回饋分數。","src":"模擬題・強化式學習","mock":1},{"id":"ai-mock-06","s":"ai","q":"某電信公司規劃四項 AI 應用：甲、判斷來電是否為詐騙電話；乙、依門號使用紀錄預測是否會攜碼轉出；丙、自動撰寫個人化的資費推薦文案；丁、產生合成語音供語音客服使用。下列分類何者正確？","o":["鑑別式 AI：甲、丙；生成式 AI：乙、丁","鑑別式 AI：乙、丁；生成式 AI：甲、丙","鑑別式 AI：甲、丁；生成式 AI：乙、丙","鑑別式 AI：甲、乙；生成式 AI：丙、丁"],"a":3,"e":"鑑別式 AI 著重在輸入資料下判斷類別或預測結果，詐騙判斷與攜碼轉出預測皆屬分類任務。生成式 AI 則學習資料分布以產生新內容，撰寫推薦文案與合成語音都是產出新的文字或聲音。其他組合將文案生成或合成語音誤歸為鑑別式，或將分類預測誤歸為生成式。","src":"模擬題・鑑別式與生成式AI","mock":1},{"id":"ai-mock-07","s":"ai","q":"從機率模型的角度比較鑑別式模型與生成式模型，下列敘述何者最正確？","o":["鑑別式模型只能處理影像資料，生成式模型只能處理文字與語音等序列資料","鑑別式模型直接學習給定輸入下的類別條件機率，生成式模型則學習資料的聯合分布 P(x,y) 或資料分布 P(x)","鑑別式模型一定需要深度神經網路，生成式模型則多半以規則系統實作完成","生成式模型無法用於分類任務，只能產生圖片、文字等新內容而不能做判斷"],"a":1,"e":"鑑別式模型（如邏輯迴歸、SVM）直接建模 P(y|x) 或決策邊界；生成式模型（如單純貝氏、GAN、VAE）學習 P(x) 或 P(x,y)，可用來生成樣本，也可藉貝氏定理進行分類。兩類模型都不受資料型態限制，生成式模型也能分類，且兩者皆不必然使用深度網路或規則系統。","src":"模擬題・鑑別式與生成式AI","mock":1},{"id":"ai-mock-08","s":"ai","q":"某信用合作社要建立貸款核准輔助模型，主管特別要求模型的判斷邏輯必須能以「若年收入大於 X 且負債比小於 Y，則核准」這類規則形式，直接呈現給審查人員與稽核單位閱讀。下列哪一種模型最符合此需求？","o":["主成分分析，可將多個財務特徵壓縮為少數幾個綜合指標","K-means 分群，可將申請人依特徵相似度分成數個不同群組","決策樹，可將判斷過程轉換為一系列可讀的條件分支規則","深層卷積神經網路，可自動學習多層抽象特徵並提高準確率"],"a":2,"e":"決策樹以「條件判斷→分支」的方式建構，每條從根到葉的路徑都能轉為 if-then 規則，屬於本質上可解釋的模型。深層神經網路屬黑箱模型，難以直接呈現規則；K-means 是非監督分群，不輸出核准判斷；主成分分析是降維技術，產生的綜合指標反而更難解讀。","src":"模擬題・分類演算法選擇","mock":1},{"id":"ai-mock-09","s":"ai","q":"某共享機車業者分析全市還車位置座標，希望找出熱門還車區域。資料中的熱區形狀不規則（沿著道路呈長條狀），且有不少零星散落的還車點，團隊也無法事先決定應分成幾群。下列哪一種演算法最合適？","o":["線性迴歸，依座標數值建立直線方程式預測未來的還車位置","單純貝氏分類器，依已標註的熱區類別計算各點所屬的機率","K-means，需事先指定群數並以群中心距離將資料分成球狀群集","DBSCAN，依密度形成任意形狀的群集，並將稀疏點視為雜訊"],"a":3,"e":"DBSCAN 以密度為基礎分群，不需事先指定群數，能找出任意形狀的群集並將低密度點視為雜訊，符合此情境。K-means 需預設群數，且傾向形成球狀群、易受離群點影響；線性迴歸是數值預測方法；單純貝氏分類器屬監督式學習，需要已標註類別。","src":"模擬題・分群演算法選擇","mock":1},{"id":"ai-mock-10","s":"ai","q":"某工廠瑕疵檢測模型在測試資料中，預測為「瑕疵」的樣本共 60 件，其中 45 件確實為瑕疵品；另有 5 件實際瑕疵品被模型判為正常。請問此模型對「瑕疵」類別的精確率（Precision）為多少？","o":["90%","25%","75%","約 81.8%"],"a":2,"e":"精確率＝TP÷(TP＋FP)。預測為瑕疵的 60 件中有 45 件正確，故 TP＝45、FP＝15，精確率＝45÷60＝75%。90% 是召回率，即 45÷(45＋5)；約 81.8% 是精確率與召回率的調和平均數 F1；25% 則是預測為瑕疵中的誤判比例。","src":"模擬題・Precision 計算","mock":1},{"id":"ai-mock-11","s":"ai","q":"某企業郵件系統導入垃圾信過濾模型，被判定為垃圾信的郵件會自動移入垃圾桶且不另行通知。管理部門最擔心重要的客戶或合約郵件被誤判而漏看。此情境下，最應優先提高下列哪一項指標？","o":["「垃圾信」類別的精確率（Precision），降低正常信被誤判為垃圾信的比例","「垃圾信」類別的召回率（Recall），盡可能攔截所有真正的垃圾信件","模型的訓練損失（Training Loss），使訓練資料上的誤差降到最低","整體準確率（Accuracy），使所有郵件分類正確的比例達到最高"],"a":0,"e":"將正常信誤判為垃圾信屬於偽陽性，代價很高時應重視垃圾信類別的精確率，確保被判為垃圾信的郵件確實是垃圾信。提高召回率會攔截更多垃圾信，但可能誤殺更多正常信；整體準確率在類別不平衡時容易失真；訓練損失低不代表在新資料上能控制誤判。","src":"模擬題・評估指標選擇","mock":1},{"id":"ai-mock-12","s":"ai","q":"某銀行比較兩個信用卡盜刷偵測模型，報告中列出模型甲的 ROC 曲線下面積（AUC）為 0.92，模型乙為 0.51。下列解讀何者最正確？","o":["模型乙的 AUC 約為 0.5，代表它恰好有一半的交易會被判定為盜刷","AUC 只適用於迴歸模型，因此兩個分類模型應改用均方誤差進行比較","模型甲在各種門檻值下區分盜刷與正常交易的整體能力較佳，模型乙接近隨機猜測","模型甲在任何門檻值下的精確率都一定高於 92%，且優於模型乙的所有指標"],"a":2,"e":"AUC 衡量模型在所有門檻值下將正例排在負例之前的能力，越接近 1 區分力越好，約 0.5 則接近隨機猜測。AUC 不等於某一門檻下的精確率；它是分類模型的指標而非迴歸指標；AUC 約 0.5 描述的是排序能力，而非判為盜刷的比例。","src":"模擬題・ROC-AUC","mock":1},{"id":"ai-mock-13","s":"ai","q":"某模型對罕見疾病的偵測結果為：精確率（Precision）1.0、召回率（Recall）0.1。若以 F1-score 評估此模型，其數值最接近下列何者？","o":["約 1.00","約 0.55","約 0.10","約 0.18"],"a":3,"e":"F1＝2×P×R÷(P＋R)＝2×1.0×0.1÷1.1，約為 0.18。F1 採用調和平均數，會被較低的指標大幅拉低，因此能反映精確率與召回率失衡的問題。約 0.55 是算術平均數的結果；0.10 與 1.00 分別只是召回率與精確率本身，並非 F1 的計算結果。","src":"模擬題・F1-score","mock":1},{"id":"ai-mock-14","s":"ai","q":"某外送平台預測每筆訂單的送達時間。多數訂單預測誤差只有 1–3 分鐘，但偶有幾筆因大雨塞車誤差高達 40 分鐘。若團隊希望評估指標能「特別反映並懲罰這些大幅誤差」，下列哪一項較合適？","o":["召回率（Recall），因可衡量延遲訂單被成功找出的比例","均方根誤差（RMSE），因誤差先平方再平均，對大誤差較為敏感","準確率（Accuracy），因可計算預測完全正確的訂單比例","平均絕對誤差（MAE），因每筆誤差以絕對值等權重計算"],"a":1,"e":"RMSE 將誤差平方後平均再開根號，大誤差會被放大，因此適合需特別懲罰極端誤差的情境。MAE 對每筆誤差等權重，較不受少數大誤差影響；準確率與召回率屬於分類指標，不適合評估送達時間這類連續數值的迴歸預測。","src":"模擬題・MAE 與 RMSE","mock":1},{"id":"ai-mock-15","s":"ai","q":"某團隊訓練深度神經網路辨識商品圖片，發現訓練準確率接近 100%，驗證準確率卻停在 80% 左右。工程師在全連接層加入 Dropout。下列關於 Dropout 的敘述何者最正確？","o":["訓練時隨機暫時停用部分神經元，降低神經元間的共同依賴以減輕過度擬合","永久移除權重最小的神經元，使模型檔案縮小以便部署到邊緣裝置","推論時隨機刪除部分輸入資料，以加快模型回應速度並減少運算資源","自動增加網路層數與神經元數量，以提升模型對訓練資料的擬合能力"],"a":0,"e":"Dropout 是正則化技術，訓練時以一定機率隨機讓部分神經元輸出為零，迫使網路學習更穩健的特徵，推論時則使用完整網路。它不是推論時刪除輸入；永久移除權重屬於剪枝；增加網路容量反而可能加重過度擬合，與 Dropout 的目的相反。","src":"模擬題・Dropout","mock":1},{"id":"ai-mock-16","s":"ai","q":"某行銷團隊以 300 個特徵建立線性模型預測顧客消費金額，但懷疑其中多數特徵其實與目標無關。團隊希望在訓練過程中自動將不重要特徵的權重壓到零，以達到特徵篩選效果。下列哪一種做法最合適？","o":["採用 L2 正則化（Ridge），其懲罰項會使所有權重恰好等於零以簡化模型","採用 L1 正則化（Lasso），其懲罰項容易使部分權重變為零","移除所有正則化項，讓模型完全依照訓練資料自由學習權重大小","提高學習率並延長訓練輪數，使模型自然忽略不重要的特徵欄位"],"a":1,"e":"L1 正則化以權重絕對值作為懲罰，最佳化時容易讓部分權重恰為零，具有自動特徵選擇效果。L2 正則化以權重平方懲罰，會將權重整體縮小但通常不會變成零；調整學習率與訓練輪數無法系統性篩選特徵；移除正則化則容易在特徵眾多時過度擬合。","src":"模擬題・L1 與 L2 正則化","mock":1},{"id":"ai-mock-17","s":"ai","q":"某團隊觀察模型訓練曲線：訓練損失持續下降，但驗證損失在第 30 輪後開始逐漸上升。下列哪一種處理方式最能直接改善此情形？","o":["繼續訓練至第 200 輪，因訓練損失仍在下降代表模型尚未學習完成","將驗證資料併入訓練資料，使模型看過更多資料後不再出現此現象","採用提前停止（Early Stopping），於驗證損失不再改善時停止訓練","改以測試資料集調整訓練輪數，選出測試表現最好的模型進行上線"],"a":2,"e":"訓練損失下降而驗證損失上升是過度擬合的典型訊號，提前停止可在驗證表現最佳時結束訓練。繼續訓練會使過擬合更嚴重；用測試集調參會造成資料洩漏，使最終評估過度樂觀；併入驗證資料後將失去監控泛化能力的依據。","src":"模擬題・提前停止","mock":1},{"id":"ai-mock-18","s":"ai","q":"某房價預測模型僅使用「坪數」一個特徵與簡單線性迴歸，結果在訓練資料與測試資料上的誤差都很大，且兩者相差不多。依偏差-變異權衡的觀點，下列判斷與改善方向何者最合理？","o":["模型偏差與變異都很低，誤差大是測試資料本身品質不佳所致","模型屬於高偏差的欠擬合，可增加有用特徵或提高模型複雜度","模型屬於資料洩漏問題，應重新切分訓練集與測試集後再訓練","模型屬於高變異的過度擬合，應加強正則化並減少特徵數量"],"a":1,"e":"訓練與測試誤差都高且接近，表示模型過於簡單、無法捕捉資料規律，屬高偏差的欠擬合，應增加特徵或採用較複雜的模型。高變異過擬合的特徵是訓練誤差低、測試誤差高；偏差低時訓練誤差不會很大；資料洩漏通常造成測試表現異常地好，而非兩者皆差。","src":"模擬題・偏差-變異權衡","mock":1},{"id":"ai-mock-19","s":"ai","q":"某醫院建立模型，於病患入院當下預測其是否需要轉入加護病房。候選特徵包含：入院時生命徵象、過去病史、年齡，以及「住院期間使用呼吸器天數」。資料科學家發現加入最後一項後模型準確率大幅提升。下列敘述何者最正確？","o":["該特徵為數值型資料，只要先進行標準化處理即可避免任何偏誤問題","該特徵在預測當下尚無法取得且與結果高度相關，屬於目標洩漏，應予以排除","該特徵應改用 One-hot 編碼轉為類別型，以降低其對模型的影響程度","該特徵大幅提升準確率，代表其預測力強，應優先保留作為核心特徵"],"a":1,"e":"住院期間使用呼吸器天數要在入院之後才會產生，且與轉入加護病房高度相關，屬於目標洩漏。模型離線表現雖佳，上線後在預測當下卻無法取得此資訊。準確率高不代表特徵合理；標準化或改變編碼方式都無法解決「資訊來自未來」的根本問題。","src":"模擬題・目標洩漏","mock":1},{"id":"ai-mock-20","s":"ai","q":"某電力公司預測每小時用電量，將「小時」欄位以 0–23 的整數直接輸入模型。工程師發現模型把 23 點與 0 點視為差距最大的兩個時間，但實際上兩者相鄰。下列哪一種特徵處理最能保留時間的循環特性？","o":["以正弦與餘弦函數轉換小時數值，使 23 點與 0 點在特徵空間中彼此接近","以 Label Encoding 將 24 個小時依序編為 1 到 24 的整數類別","將小時欄位直接刪除，改以日期欄位取代以避免模型產生誤解","將小時數值乘以 60 轉換為分鐘數，使時間刻度更細緻以提升精度"],"a":0,"e":"對具循環性的時間特徵，常以 sin(2π·h/24) 與 cos(2π·h/24) 兩個特徵表示，使首尾時間在空間中相鄰，保留週期關係。換算成分鐘或改用 Label Encoding 仍是線性遞增，無法表達循環；刪除小時欄位會失去日內用電變化的重要資訊。","src":"模擬題・週期性特徵編碼","mock":1},{"id":"ai-mock-21","s":"ai","q":"某健身 App 將會員「每週運動分鐘數」以 Min-Max 正規化縮放到 0 到 1 之間。訓練資料中最小值為 20 分鐘、最大值為 180 分鐘。某會員每週運動 100 分鐘，轉換後的數值為多少？","o":["0.8","0.6","0.5","0.4"],"a":2,"e":"Min-Max 正規化公式為 (x－min)÷(max－min)＝(100－20)÷(180－20)＝80÷160＝0.5。若誤用 x÷(max－min) 會得到約 0.63；0.4、0.6、0.8 等數值都不符合公式結果。實務上 min 與 max 應僅由訓練資料計算，再套用至測試資料。","src":"模擬題・Min-Max 正規化","mock":1},{"id":"ai-mock-22","s":"ai","q":"某人資部門建立員工離職預測模型，資料中「前一份工作年資」欄位有約 75% 為空白，且經訪談確認多為系統早期未蒐集所致，與離職結果無明顯關聯。其餘欄位遺漏情形都很少。下列處理方式何者最合理？","o":["將該欄位所有空白一律填入 0，代表這些員工都沒有任何前份工作經驗","刪除所有含有任何遺漏值的資料列，確保訓練資料完全沒有空白欄位","以該欄位僅有的 25% 資料平均值填滿全部空白，維持欄位完整保留","評估該欄位資訊價值有限後考慮刪除該欄位，避免大量填補值扭曲資料"],"a":3,"e":"當單一欄位遺漏比例極高且與目標關聯性低時，填補值將佔多數而可能扭曲分布，刪除該欄位通常較合理。刪除所有含遺漏值的資料列會損失大量樣本；填 0 會錯誤代表「無工作經驗」；以少量資料的平均值填補 75% 空白會嚴重壓縮變異並引入偏誤。","src":"模擬題・遺漏值處理","mock":1},{"id":"ai-mock-23","s":"ai","q":"某零售集團將各門市的原始交易、會員與網站點擊紀錄，先完整載入雲端資料湖保存，之後再依不同分析需求，在資料平台內進行清理、轉換與彙整。此種資料處理流程最符合下列哪一種模式？","o":["資料視覺化流程，以圖表呈現原始資料作為主要的處理步驟","OLTP（線上交易處理），以即時處理大量交易寫入作為主要目的","ETL（Extract-Transform-Load），先在中介伺服器完成轉換再載入","ELT（Extract-Load-Transform），先載入原始資料再於目標平台內轉換"],"a":3,"e":"先擷取原始資料、載入資料湖，再依需求在平台內轉換，即為 ELT 模式，常見於具備大量運算能力的雲端資料平台。傳統 ETL 是在載入目標系統前先完成轉換；OLTP 指交易型資料庫系統的處理型態；資料視覺化是分析呈現手段，並非資料整合流程。","src":"模擬題・ETL 與 ELT","mock":1},{"id":"ai-mock-24","s":"ai","q":"某地方政府彙整民眾陳情、社群貼文與感測器數據進行城市治理分析，卻發現部分感測器長期故障回傳錯誤數值，社群貼文中也夾雜大量重複轉貼與不實訊息，導致分析結論可信度受到質疑。此專案最主要面臨的是大數據的哪一項特性？","o":["巨量性（Volume），資料總量超出儲存設備容量","速度性（Velocity），資料產生與傳輸的速度過快","真實性（Veracity），資料品質與可信度參差不齊","多樣性（Variety），資料格式與來源的種類繁多"],"a":2,"e":"感測器回傳錯誤數值、社群資料充斥重複與不實訊息，核心問題在資料的準確性與可信度，對應大數據的真實性（Veracity）。速度性關注資料產生與處理的即時性；多樣性指結構化與非結構化等不同格式；巨量性指資料規模龐大，都不是本題描述的主要困境。","src":"模擬題・大數據特性","mock":1},{"id":"ai-mock-25","s":"ai","q":"某連鎖餐飲集團想比較北、中、南、東四個區域門市的「平均客單價分布」，除了觀察各區的中位數與四分位距外，也希望快速看出是否有異常高或異常低的門市。下列哪一種圖表最合適？","o":["盒鬚圖（Box Plot），可並列比較各組中位數、四分位距與離群值","圓餅圖（Pie Chart），可呈現各區域門市數量占全體的比例","雷達圖（Radar Chart），可比較單一門市在多個指標的表現","折線圖（Line Chart），可呈現單一指標隨時間變化的趨勢"],"a":0,"e":"盒鬚圖以中位數、第一與第三四分位數及鬚線呈現分布，並標示離群值，適合多組資料並列比較分布差異。圓餅圖用於呈現組成比例；折線圖適合時間趨勢；雷達圖適合比較多項指標的綜合表現，都無法同時呈現各組分布與離群值。","src":"模擬題・資料視覺化","mock":1},{"id":"ai-mock-26","s":"ai","q":"某分析師發現，各縣市冰淇淋銷售量與溺水事件數量呈高度正相關，於是建議主管「限制冰淇淋銷售以降低溺水事件」。下列評論何者最合理？","o":["應改用圓餅圖重新呈現資料，即可確認兩者之間是否具有因果關係","兩者相關係數很高，即可證明冰淇淋銷售量增加是造成溺水事件的原因","只要增加更多縣市的樣本數，相關係數提高後就能確定其因果方向","相關不代表因果，兩者可能同受氣溫等混淆變數影響，不能據此推論因果關係"],"a":3,"e":"兩變數高度相關，可能是因為共同受第三變數影響，例如夏季高溫同時提高冰品消費與戲水人數，屬於混淆變數造成的假性關聯。相關係數高不能證明因果；更換圖表形式無法釐清因果；增加樣本數只能讓相關估計更穩定，判斷因果需仰賴實驗設計或因果推論方法。","src":"模擬題・相關與因果","mock":1},{"id":"ai-mock-27","s":"ai","q":"某保險公司以 10,000 筆保單資料建立詐欺偵測模型，其中詐欺案件僅占 2%。若採用一般隨機 5-fold 交叉驗證，可能出現某些折中詐欺樣本極少的情況，使評估結果不穩定。下列做法何者最合適？","o":["放棄交叉驗證，改為只做一次隨機 8:2 切分進行評估","把折數增加到 1,000 折，使每一折都只包含極少量的樣本進行測試","採用分層 k-fold 交叉驗證，使每一折的類別比例與整體資料一致","將詐欺樣本全部放入訓練集，測試集只保留正常保單以避免評估波動"],"a":2,"e":"分層 k-fold 會依類別比例切分資料，使每一折的詐欺比例都接近 2%，在類別不平衡時能得到較穩定可信的評估。單次隨機切分的評估變異更大；測試集若沒有詐欺樣本就無法衡量偵測能力；折數過多會讓每折樣本太少，反而使評估更不穩定。","src":"模擬題・分層交叉驗證","mock":1},{"id":"ai-mock-28","s":"ai","q":"某連鎖超市以 2022–2025 年每日銷售資料建立明日銷量預測模型。下列哪一種模型驗證方式最能反映模型上線後的實際表現？","o":["依時間先後切分，以早期資料訓練、晚期資料驗證，或採滾動視窗驗證","將所有日期資料隨機打亂後，再依 8:2 比例切分為訓練集與測試集","以 2025 年資料訓練模型，再用 2022 年資料測試模型的預測效果","使用全部資料訓練後，再以同一批資料計算誤差作為模型的表現"],"a":0,"e":"時間序列預測必須以過去預測未來，應依時間順序切分，或採滾動式（walk-forward）驗證，才能模擬上線情境並避免未來資訊洩漏。隨機打亂會讓訓練集包含比測試集更晚的資料；用未來資料預測過去違反時間順序；以訓練資料評估則無法反映泛化能力。","src":"模擬題・時間序列驗證","mock":1},{"id":"ai-mock-29","s":"ai","q":"某銀行的信用評分模型上線一年後，監控報表顯示近期申請人的年齡與收入分布，和訓練資料相比出現明顯偏移，原因是銀行新推出的數位帳戶吸引大量年輕族群。下列哪一項做法最合適？","o":["因模型已通過上線前驗證，輸入分布改變不會影響預測，無須任何處理","持續監控輸入特徵分布的差異，評估模型表現並視需要以近期資料重新訓練","將年輕申請人的資料從評分流程中排除，讓輸入分布回到訓練時的狀態","立即刪除年齡與收入兩個特徵，避免分布偏移的資料繼續影響模型判斷"],"a":1,"e":"輸入特徵分布隨時間改變屬於資料漂移，可能使模型在新族群上的表現下降，應建立分布監控機制、檢視模型效能，必要時以近期資料重新訓練或校正。上線前驗證無法保證未來表現；刪除重要特徵會損害模型；排除特定族群則可能造成不公平對待。","src":"模擬題・資料漂移","mock":1},{"id":"ai-mock-30","s":"ai","q":"某電商平台的詐騙訂單偵測模型原本表現良好，但近幾個月詐騙集團改變手法，同樣的下單金額與收件地址組合，過去多屬正常訂單，如今卻常是詐騙。下列敘述何者最正確？","o":["這屬於資料漂移，只要輸入特徵分布不變，模型就不需要任何調整","這屬於概念漂移，輸入特徵與目標結果之間的關係已改變，需更新模型","這屬於類別不平衡，只要對詐騙樣本進行過採樣即可恢復原有效能","這屬於過度擬合，只要在訓練時加入 Dropout 就能完全解決問題"],"a":1,"e":"相同的輸入特徵所對應的結果改變，代表 P(y|x) 發生變化，屬於概念漂移，需以新標註資料重新訓練或調整模型。資料漂移指輸入分布改變；過度擬合是訓練階段的泛化問題；類別不平衡處理無法讓模型學到詐騙集團的新規律。","src":"模擬題・概念漂移","mock":1},{"id":"ai-mock-31","s":"ai","q":"某電信公司以 SHAP 分析客戶流失模型。除了查看單一客戶的解釋外，主管更想了解「整體而言，哪些特徵對模型預測影響最大」。下列做法何者最合適？","o":["只挑選一位流失客戶的 SHAP 值，將其排序結果直接視為全體客戶的結論","彙整所有樣本的 SHAP 值，例如計算各特徵的平均絕對 SHAP 值","改用顯著性圖標示影像中重要的像素區域，以呈現整體特徵的重要程度","比較各特徵在原始資料中的平均數大小，平均數越大即代表影響力越大"],"a":1,"e":"SHAP 值可解釋單一預測，也可彙整多筆樣本，以平均絕對 SHAP 值或摘要圖呈現各特徵的整體影響，作為全域解釋。單一客戶的結果不能代表全體；顯著性圖主要用於影像或文字輸入的區域標示；特徵原始數值大小與其對模型輸出的影響是兩回事。","src":"模擬題・SHAP 全域解釋","mock":1},{"id":"ai-mock-32","s":"ai","q":"某地方政府以 AI 評估社會住宅申請案的優先順序，議會要求模型本身就必須容易理解，能直接說明「每增加一位扶養人口，分數提高多少」，而非事後再以其他工具推測。下列哪一種選擇最符合此要求？","o":["採用深層神經網路，再以 LIME 對每筆申請案產生局部的事後解釋","採用生成對抗網路，產生模擬申請案供議員參考模型的判斷方式","採用集成式梯度提升模型，並只公布整體準確率作為模型的說明","採用線性或邏輯迴歸等本質可解釋模型，直接以係數說明各特徵的影響"],"a":3,"e":"線性或邏輯迴歸屬本質可解釋（intrinsically interpretable）模型，係數可直接說明特徵每變動一單位對結果的影響，符合「模型本身易懂」的要求。神經網路搭配 LIME 屬事後解釋；只公布準確率無法說明判斷依據；生成對抗網路用於生成資料，並非可解釋的評分模型。","src":"模擬題・可解釋模型","mock":1},{"id":"ai-mock-33","s":"ai","q":"某銀行的房貸審核模型拒絕了一位申請人，行員希望用客戶容易理解的方式說明：「如果您的負債比從 55% 降到 40% 以下，申請結果就可能改為核准」。此種解釋方式屬於下列何者？","o":["顯著性圖（Saliency Map）","反事實解釋（Counterfactual Explanation）","排列特徵重要性（Permutation Importance）","部分依賴圖（Partial Dependence Plot）"],"a":1,"e":"反事實解釋描述「輸入需要做出哪些最小改變，模型結果就會不同」，以具體可行的建議呈現，適合向被拒絕的申請人說明。部分依賴圖呈現特徵對預測的整體平均趨勢；顯著性圖標示輸入中影響較大的區域；排列特徵重要性衡量特徵對整體模型表現的貢獻。","src":"模擬題・反事實解釋","mock":1},{"id":"ai-mock-34","s":"ai","q":"某研究團隊以深度學習判讀皮膚病灶照片，測試準確率很高。但工程師以顯著性圖（Saliency Map）檢視後發現，模型判定為惡性時，高亮區域常落在照片角落的「尺規標記」，而非病灶本身。下列解讀何者最合理？","o":["高亮區域在尺規位置代表模型已找到比病灶更準確的判斷依據，可直接上線","只要提高模型的準確率，顯著性圖的高亮區域就一定會回到病灶上","模型可能學到與標籤相關的捷徑特徵而非病灶特徵，需檢討資料並重新訓練","顯著性圖只是裝飾性的視覺化效果，與模型實際判斷依據完全沒有關係"],"a":2,"e":"惡性案例照片常附有尺規，模型可能將這種與標籤相關、卻與病理無關的線索當成捷徑，顯著性圖正可協助發現此類問題，應清理資料或調整訓練。這種依據無法泛化，不宜直接上線；顯著性圖反映模型對輸入的敏感區域；單純提高準確率也無法保證模型會改看正確區域。","src":"模擬題・顯著性圖","mock":1},{"id":"ai-mock-35","s":"ai","q":"某科技公司以過去十年的錄取紀錄訓練履歷篩選模型，上線後發現模型對女性求職者的評分普遍偏低。調查顯示，過去該公司技術職錄取者以男性為主。下列敘述何者最能說明此問題的成因？","o":["女性求職者的履歷格式較不統一，導致模型讀取時發生技術性錯誤","模型演算法本身就含有性別歧視規則，與訓練資料的內容並不相關","模型的參數量不足，只要擴大模型規模就能自動消除性別差異問題","訓練資料反映了歷史上的不平等，模型學習並延續了這種歷史偏誤"],"a":3,"e":"模型從反映過去錄取不平等的資料中學習，會將歷史偏誤當成規律並加以延續，即使未直接使用性別欄位，也可能透過相關特徵產生差別待遇。擴大模型規模無法消除資料偏誤；履歷格式並非題述成因；演算法本身通常不含歧視規則，偏誤多源自資料。","src":"模擬題・AI 偏誤","mock":1},{"id":"ai-mock-36","s":"ai","q":"某公營銀行檢視小額信貸模型的公平性，稽核人員比較不同性別申請人「獲得核准的比例」是否相近，作為是否存在差別待遇的初步依據。此種公平性衡量概念最接近下列何者？","o":["人口統計均等，要求不同群體獲得正面結果的比例相近","模型壓縮，要求模型在不同群體使用相同數量的參數進行預測","均方誤差最小化，要求模型對所有申請人的預測誤差平方和最小","資料增強，要求以旋轉、翻轉等方式擴充少數群體的樣本數量"],"a":0,"e":"人口統計均等（又稱統計均等）檢視不同群體獲得正面結果的比例是否相近，是常見的群體公平性指標。均方誤差是迴歸的誤差指標；模型壓縮是縮小模型以利部署的技術；旋轉、翻轉屬影像資料增強手法，三者都不是衡量群體公平性的指標。","src":"模擬題・公平性指標","mock":1},{"id":"ai-mock-37","s":"ai","q":"某醫院導入 AI 判讀電腦斷層影像，系統會標示疑似腫瘤位置並給出風險分數，但每一份報告都必須由放射科醫師逐案確認、修改後才能簽發。此種設計最符合下列哪一種人機協作模式？","o":["全自動化流程（Full Automation），由 AI 直接簽發報告並通知病患","人在迴圈上（Human-on-the-loop），人類僅在系統異常時才介入監督","人在迴圈外（Human-out-of-the-loop），系統完全自主決策不需人介入","人在迴圈內（Human-in-the-loop），由人類對每一項決策進行確認"],"a":3,"e":"每份報告都需醫師逐案確認才能簽發，人類直接參與每一項決策，屬於人在迴圈內。人在迴圈上是由系統自主運作、人類監督並在必要時介入；人在迴圈外與全自動化流程則由系統自行完成決策，均不符合醫師逐案把關的設計。","src":"模擬題・人在迴圈","mock":1},{"id":"ai-mock-38","s":"ai","q":"某中央機關以 AI 協助審查補助申請案。受影響民眾要求機關說明 AI 產出建議所依據的主要因素，以及其在審查流程中扮演的角色。依我國《人工智慧基本法》所揭示的基本原則，此項要求最直接對應下列哪一項？","o":["永續發展與福祉","人類自主","透明與可解釋","資安與安全"],"a":2,"e":"民眾要求了解 AI 建議的依據與其在流程中的角色，核心在於讓 AI 的運作與產出能被理解，最直接對應「透明與可解釋」原則。永續發展與福祉著重社會與環境的整體利益；資安與安全著重系統防護與穩健；人類自主強調 AI 應尊重並支持人的自主決定。","src":"模擬題・人工智慧基本法","mock":1},{"id":"ai-mock-39","s":"ai","q":"金管會發布的「金融業運用人工智慧（AI）指引」提出金融機構運用 AI 應遵循的核心原則。下列何者「不屬於」該指引所列的核心原則？","o":["重視公平性及以人為本的價值觀","落實透明性與可解釋性","以營運效率最大化為優先","保護隱私及客戶權益"],"a":2,"e":"該指引的六項核心原則為：建立治理及問責機制、重視公平性及以人為本的價值觀、保護隱私及客戶權益、確保系統穩健性與安全性、落實透明性與可解釋性、促進永續發展。以營運效率最大化為優先屬經營考量，並非指引所列的核心原則。","src":"模擬題・金融業AI指引","mock":1},{"id":"ai-mock-40","s":"ai","q":"依歐盟《人工智慧法》（EU AI Act）的風險分級架構，下列哪一項 AI 應用最可能被歸類為「高風險」系統？","o":["網站上回答常見問題並告知使用者為 AI 的聊天機器人","企業用於篩選求職者履歷並排序面試名單的 AI 系統","電玩遊戲中控制非玩家角色行為的 AI 程式","電子郵件服務內建的垃圾郵件自動過濾功能"],"a":1,"e":"歐盟 AI 法將用於招募、篩選求職者等就業領域的 AI 列為高風險，須符合風險管理、資料治理與人類監督等義務。垃圾郵件過濾與電玩角色 AI 通常屬最低風險；聊天機器人主要負有告知使用者正與 AI 互動的透明義務，屬有限風險。","src":"模擬題・歐盟AI法風險分級","mock":1},{"id":"ai-mock-41","s":"ai","q":"某醫療機構想將加密後的病患檢驗數據交由雲端服務商計算統計結果，但要求雲端業者在整個運算過程中都無法看到明文資料，計算結果解密後仍須正確。下列哪一種技術最符合此需求？","o":["同態加密（Homomorphic Encryption），可直接對密文進行運算","資料去識別化，移除姓名與身分證字號等欄位後以明文上傳雲端運算","傳輸層加密（TLS），保護資料在網路傳輸過程中不被竊聽或竄改","資料增強，以合成樣本取代真實數據後再交由雲端業者進行計算"],"a":0,"e":"同態加密允許在密文上直接運算，解密後的結果與對明文運算相同，雲端業者全程看不到原始資料。去識別化後仍以明文運算，業者看得到資料內容；TLS 只保護傳輸過程，到達伺服器後仍需解密；資料增強是擴充訓練樣本的技術，無法保證計算結果正確。","src":"模擬題・同態加密","mock":1},{"id":"ai-mock-42","s":"ai","q":"多家銀行合作訓練洗錢偵測模型，採用聯邦學習（Federated Learning）架構。下列關於此架構運作方式的敘述何者最正確？","o":["各銀行以自有資料在本地訓練，只將模型參數或更新量傳送至中央彙整","由中央伺服器向各銀行即時查詢個別客戶資料，再以查詢結果訓練模型","各銀行將客戶交易明細加密後集中上傳到中央伺服器統一進行訓練","各銀行各自訓練獨立模型且彼此完全不交換任何資訊與模型參數"],"a":0,"e":"聯邦學習讓資料保留在各機構本地，只上傳模型參數或梯度更新，由中央伺服器彙整成全域模型後再下發，以降低原始資料外流風險。集中上傳明細仍屬資料集中化；中央即時查詢個別資料違反資料不出本地的設計；完全不交換資訊則無法達成協同訓練。","src":"模擬題・聯邦學習","mock":1},{"id":"ai-mock-43","s":"ai","q":"相較於將影像所有像素攤平後輸入全連接神經網路，卷積神經網路（CNN）處理影像時具有明顯優勢。下列何者最能說明其主要原因？","o":["CNN 完全不需要訓練資料，只要設定好卷積核大小即可直接辨識物件","CNN 依時間順序逐一處理像素並保留隱藏狀態，適合長序列的建模","卷積核以局部連接與權重共享掃描影像，能擷取空間特徵並大幅減少參數量","CNN 會將影像轉換為文字描述後再分類，因此更能理解影像語意內容"],"a":2,"e":"CNN 的卷積核只連接局部區域，並在整張影像共用同一組權重，能有效擷取邊緣、紋理等空間特徵，且參數量遠少於全連接網路。CNN 不會先把影像轉成文字；它仍需資料訓練才能學到卷積核權重；依序處理並保留隱藏狀態則是循環神經網路的特性。","src":"模擬題・CNN","mock":1},{"id":"ai-mock-44","s":"ai","q":"Transformer 的自注意力機制會同時計算序列中所有詞彙之間的關聯，本身並不包含詞彙的先後順序資訊。為了讓模型區分「狗咬人」與「人咬狗」的差異，Transformer 通常會加入下列哪一項設計？","o":["位置編碼（Positional Encoding），將位置資訊加入詞彙的表示中","Dropout，在訓練時隨機停用部分神經元以避免模型過度擬合訓練資料","遺忘閘（Forget Gate），控制前一時間點的記憶要保留多少到下一步","池化層（Pooling Layer），將相鄰詞彙的表示取最大值以縮減序列長度"],"a":0,"e":"自注意力對輸入順序不敏感，因此 Transformer 會加入位置編碼，讓每個詞的表示帶有位置資訊，模型才能分辨語序差異。池化層常見於 CNN，用於縮減維度；Dropout 是正則化技術；遺忘閘是 LSTM 的閘控結構，三者都不是用來提供語序資訊。","src":"模擬題・Transformer","mock":1},{"id":"ai-mock-45","s":"ai","q":"某遊戲公司以生成對抗網路（GAN）產生新的角色頭像。下列關於 GAN 中生成器與鑑別器分工的敘述，何者最正確？","o":["生成器嘗試產生逼真的假影像，鑑別器判斷輸入影像是真實資料或生成結果","生成器負責將影像壓縮為潛在向量，鑑別器再將潛在向量還原為原始影像","生成器與鑑別器都負責產生影像，最後由人工挑選品質較好的一組輸出","鑑別器先為影像加入雜訊，生成器再逐步去除雜訊還原出清晰影像"],"a":0,"e":"GAN 由生成器與鑑別器對抗訓練：生成器試圖產生足以騙過鑑別器的樣本，鑑別器則學習分辨真實與生成資料，兩者在競爭中共同進步。壓縮再還原是自編碼器的編碼器與解碼器分工；加噪再去噪是擴散模型的機制；GAN 也不依賴人工挑選輸出。","src":"模擬題・GAN","mock":1},{"id":"ai-mock-46","s":"ai","q":"某科技論壇討論「通用人工智慧（AGI）」與目前多數 AI 應用的差異。下列哪一項描述最符合 AGI 的概念？","o":["專門針對單一任務設計，例如只會下圍棋或只會辨識車牌號碼的系統","依照專家撰寫的大量 if-then 規則，在特定領域提供建議的專家系統","只能依固定流程自動執行重複性操作，例如自動填寫表單的流程機器人","能像人類一樣在多種不同領域中理解、學習並靈活解決新問題的智慧系統"],"a":3,"e":"AGI 指具備跨領域理解、學習與推理能力，能像人類一樣面對新情境並遷移知識的智慧系統，目前仍屬發展目標。專注單一任務的圍棋或車牌辨識系統屬弱 AI；規則式專家系統侷限於特定領域；流程自動化機器人只依固定步驟執行，均不具通用智慧。","src":"模擬題・通用人工智慧","mock":1},{"id":"ai-mock-47","s":"ai","q":"哲學家 Searle 提出「中文房間」思想實驗：一位不懂中文的人在房間內依照規則手冊操作符號，對外回覆的中文卻讓房外的人以為他懂中文。此思想實驗主要用來質疑下列哪一種觀點？","o":["電腦的運算速度必須超越人腦，才能在對話表現上與人類相互比較","AI 系統必須使用神經網路架構，才能正確處理中文等非拉丁語系語言","規則手冊的內容越多越完整，房間內的人就越不可能產生任何錯誤回覆","只要外在行為與人類無法區分（如通過圖靈測試），就代表系統真正理解語意"],"a":3,"e":"中文房間指出，單純依規則操作符號即可產生看似理解的輸出，但操作者並不理解語意，藉此質疑「通過圖靈測試等行為表現即等於真正理解」的觀點。此實驗與運算速度、模型架構或規則手冊的完整度無關，重點在區分符號操作與真正的理解。","src":"模擬題・中文房間與圖靈測試","mock":1},{"id":"ai-mock-48","s":"ai","q":"某律師事務所希望 AI 系統能從大量合約文件中，自動找出並標示「當事人名稱、簽約日期、金額、地點」等關鍵資訊，再匯入資料庫供律師查詢。此功能主要屬於下列哪一項技術？","o":["影像分割（Image Segmentation）","命名實體辨識（Named Entity Recognition）","推薦系統（Recommender System）","語音合成（Text-to-Speech）"],"a":1,"e":"命名實體辨識是自然語言處理任務，用於從文字中找出人名、組織、日期、金額、地點等特定實體並加以分類，符合從合約擷取關鍵資訊的需求。影像分割屬電腦視覺的像素級分類；語音合成是將文字轉為語音；推薦系統用於預測使用者偏好，都不符合此需求。","src":"模擬題・NLP 應用","mock":1},{"id":"ai-mock-49","s":"ai","q":"某公司以大型語言模型撰寫產品說明，發現模型有時會自信地寫出不存在的產品規格或引用根本不存在的研究報告。下列敘述何者最正確？","o":["此現象稱為幻覺，可透過檢索增強生成提供可靠資料來源並搭配人工查核來降低","此現象稱為模式崩潰，只要提高生成溫度參數就能讓內容變得正確","此現象稱為過度擬合，只要減少模型訓練輪數即可完全消除錯誤內容","此現象代表模型已被植入惡意程式，應立即停用並重新安裝作業系統"],"a":0,"e":"大型語言模型依機率生成文字，可能產出流暢卻與事實不符的內容，稱為幻覺；結合檢索增強生成提供可查證的資料來源，並加入人工審核，可有效降低風險。這與訓練輪數造成的過度擬合無直接關係，也不是惡意程式；提高溫度反而會增加輸出隨機性。","src":"模擬題・LLM 幻覺","mock":1},{"id":"ai-mock-50","s":"ai","q":"某企業想讓開源大型語言模型學會公司內部的客服回覆風格，但 GPU 資源有限，無法對數十億個參數進行全參數微調。團隊決定採用 LoRA（Low-Rank Adaptation）。下列敘述何者最正確？","o":["將模型所有參數重新隨機初始化後，以公司客服資料從頭開始完整訓練","不更新任何參數，只在每次提問時把公司所有客服紀錄放入提示詞中","凍結原模型權重，只訓練額外加入的低秩矩陣，大幅減少需更新的參數量","移除模型中一半的網路層數，使模型變小後再進行全參數微調訓練"],"a":2,"e":"LoRA 屬參數高效微調方法，凍結預訓練模型原有權重，在特定層加入可訓練的低秩分解矩陣，只更新少量參數即可讓模型適應新任務，大幅降低運算與記憶體需求。從頭訓練成本最高；只放入提示詞屬提示工程而非微調；刪減層數會破壞模型原有能力。","src":"模擬題・LoRA 微調","mock":1}],"gen":[{"id":"gen-114-4-01","s":"gen","q":"在 Low Code 平台的開發應用設計中，關於「模型(Model)」，下列敘述何者最符合實際情況？","o":["模型僅扮演設計視覺化的輔助工具，對應用邏輯的影響有限","模型是用來抽象描述資料結構、業務流程與介面邏輯的核心元素，影響應用的設計與維護","模型僅依循 UML(Unified Modeling Language)等傳統建模方式，缺乏針對 Low Code 環境的延展性","模型在 Low Code 平台中已被自動程式碼生成全面取代，實際價值有限"],"a":1,"e":"Low Code 平台以「模型」抽象描述資料結構、業務流程與介面邏輯，平台再依模型產生應用，因此模型是設計與維護的核心。說它「僅是視覺化輔助」「已被自動程式碼生成取代」都低估其角色；說它「僅依循 UML、缺乏延展性」也不符合 Low Code 平台自訂建模的實況。","src":"114年第四次 第1題"},{"id":"gen-114-4-02","s":"gen","q":"企業在導入生成式 AI 平台時，往往需要利用分散於不同部門或機構中的大量敏感文本資料。若希望在確保隱私的前提下，仍能讓模型持續優化並降低資料外洩風險，下列哪一種方法最適合？","o":["同態加密(Homomorphic Encryption)","安全多方計算(Secure Multi-party Computation)","零知識證明(Zero-knowledge Proofs)","聯邦學習(Federated Learning)"],"a":3,"e":"聯邦學習讓各部門或機構的資料留在原地，只交換模型參數或梯度來共同訓練，兼顧隱私與模型持續優化，最符合題意。同態加密、安全多方計算是保護運算過程的密碼技術，成本高且不是直接的分散式訓練框架；零知識證明用於驗證命題真偽，與模型訓練無關。","src":"114年第四次 第2題"},{"id":"gen-114-4-04","s":"gen","q":"某社交平台嘗試結合自動提示工程(Automatic Prompt Engineer, APE)與圖提示(Graph Prompting)，讓 AI 協助分析使用者之間的互動關係。在這個過程中，下列何者為最可能遇到的挑戰？","o":["圖結構轉換為文字提示時，可能導致部分關聯資訊遺失","APE 在圖資料上無法產生任何提示內容","圖轉文字後能完整保留所有上下文，對推理不造成影響","Graph Prompting 僅能處理線性路徑，限制多分支探索"],"a":0,"e":"把圖結構（節點、邊、多層關係）轉成線性文字提示時，常會遺漏或扭曲部分關聯資訊，是 APE 結合圖提示時最常見的挑戰。「APE 無法產生任何提示」過於絕對；「圖轉文字能完整保留上下文」與事實相反；「Graph Prompting 只能處理線性路徑」也錯，圖本身就能表達多分支關係。","src":"114年第四次 第4題"},{"id":"gen-114-4-05","s":"gen","q":"在超長上下文任務中使用自動提示工程(Automatic Prompt Engineer, APE)時，可能面臨的最大限制是什麼？","o":["迭代優化難以因應上下文的不斷變動，導致調整失效","模型的記憶容量有限，無法完整保留所有長篇資訊","提示內容難以有效分解，無法支援複雜任務拆解","回饋機制通常僅針對局部片段，難以全面評估最終輸出品質"],"a":3,"e":"APE 依賴回饋分數來迭代挑選提示；在超長上下文任務中，評估往往只能針對局部片段，難以全面衡量整體輸出品質，使優化方向失準。「迭代難以因應上下文變動」「提示難以分解」並非核心限制。（註：「模型記憶容量有限、無法保留長篇資訊」同樣是超長上下文的典型限制，與官方答案相比爭議性高。）","src":"114年第四次 第5題"},{"id":"gen-114-4-06","s":"gen","q":"某設計團隊計畫在短時間內完成一款行動應用程式，必須同時達到高度個人化體驗、快速生成介面與行銷內容自動產出等需求。若結合 No Code/Low Code 平台與生成式 AI 技術，以下哪一種整合策略最能符合目標？","o":["使用生成式 AI 自動產生 API 呼叫與元件配置，並由開發者手動整合至 No Code 平台流程","透過生成式 AI 在 No Code 平台中自動建立介面模板，並結合使用者數據即時生成個人化功能與行銷推播內容","在 No Code 平台中導入生成式 AI，快速建立跨專案可重用的通用模組，專注於提升開發速度","在 No Code 平台中完全依賴生成式 AI 自動產生所有應用功能與流程，不經人工設計或驗證"],"a":1,"e":"題目要求同時滿足個人化、快速生成介面與行銷內容自動產出，「自動建立介面模板並結合使用者數據即時生成個人化功能與推播內容」一次涵蓋三項需求。「開發者手動整合 API」速度不足；「通用可重用模組」只顧開發速度、缺乏個人化；「完全依賴 AI、不經人工驗證」則有品質與風險疑慮。","src":"114年第四次 第6題"},{"id":"gen-114-4-07","s":"gen","q":"某團隊希望讓 AI 自動查詢 GitHub 上的程式碼庫，並生成摘要給使用者參考。開發者決定透過 Model Context Protocol(MCP)來實現，AI需先發出請求，再經由 MCP 架構逐步完成查詢與回傳。在此情境下，MCP 運作流程的正確順序為何？","o":["MCP Server→AI Host→MCP Client→資料查詢→結果回傳 AI Host","MCP Client→AI Host→MCP Server→資料查詢→結果回傳 AI Host","AI Host→MCP Client→ MCP Server→資料查詢→結果回傳 AI Host","AI Host→MCP Server→MCP Client→資料查詢→結果回傳 AI Host"],"a":2,"e":"MCP 架構中，AI Host（如應用程式或 IDE）內建 MCP Client，由 Client 依協定向 MCP Server 發出請求，Server 再存取 GitHub 等外部資源查詢資料，結果回傳給 Host。其他排序把 Server 或 Client 放在起點，或讓 Host 跳過 Client 直接找 Server，都不符合「Host→Client→Server」的角色分工。","src":"114年第四次 第7題"},{"id":"gen-114-4-08","s":"gen","q":"在 Agent-to-Agent(A2A)架構中，不同代理人之間會分工合作。一般而言，下列敘述何者最符合 Client Agent 與 Remote Agent 的互動流程？","o":["Remote Agent 主動分派任務給 Client Agent","由人工事先設定 Client Agent 與 Remote Agent 處理任務的先後順序","Client Agent 發起任務，Remote Agent 執行並回傳結果","Client Agent 與 Remote Agent 同時處理任務並同步處理結果"],"a":2,"e":"A2A 協定中，Client Agent 負責發起並委派任務，Remote Agent 接收任務後執行並回傳結果或產出物。「Remote Agent 主動分派任務」顛倒了角色；「由人工事先設定順序」不符合代理自主協作的設計；「兩者同時處理並同步結果」也不是標準的請求與回應互動模式。","src":"114年第四次 第8題"},{"id":"gen-114-4-09","s":"gen","q":"在導入生成式 AI 的應用規劃中，上下文工程(Context Engineering)的核心目的為何？","o":["縮短模型訓練時間","優化提示與上下文","增加模型參數數量","優化 Fine-tuning 正確率"],"a":1,"e":"上下文工程的核心是設計並管理送入模型的提示、背景資料、記憶與工具資訊，讓模型在推論時獲得最合適的上下文。它不涉及「縮短訓練時間」或「增加模型參數」，也不是「提升 Fine-tuning 正確率」的訓練技術，而是在不改動模型權重的前提下優化輸入。","src":"114年第四次 第9題"},{"id":"gen-114-4-10","s":"gen","q":"某公司在導入生成式 AI 協助撰寫內部報告時，測試人員刻意在輸入的上下文中放入互相矛盾的資訊(例如：同一位員工在不同段落被描述為「入職三年」與「入職五年」)。在這種情況下，最常見的模型行為會是什麼？","o":["永遠選擇第一段資訊作為答案依據","可能生成幻覺或隨機採信其中一方的內容","拒絕回答，並要求提供更一致的輸入","自動判斷並只選擇正確的資訊"],"a":1,"e":"LLM 沒有可靠的事實查核機制，面對矛盾的上下文時，常會隨機採信其中一方，甚至混合拼湊出幻覺內容。模型並不會固定「選第一段」，也很少主動「拒答並要求一致輸入」；「自動判斷並只選正確資訊」更高估模型能力，因為模型無從得知哪一段才是事實。","src":"114年第四次 第10題"},{"id":"gen-114-4-11","s":"gen","q":"Agentic AI 在解決方案圖譜(Solution Graph)上尋找最佳解決路徑時，通常會使用什麼樣的搜尋策略？","o":["使用廣度優先、深度優先或最佳優先等演算法進行探索","每一步都隨機選擇動作，反覆嘗試直到找到一條可行路徑","只執行事先假定的一條路徑，失敗就停止","完全依靠 LLM 一次性推斷最優完整路徑"],"a":0,"e":"Agentic AI 在解決方案圖譜上規劃路徑時，常借用廣度優先、深度優先或最佳優先等經典搜尋演算法，有系統地探索並評估各節點。「每步隨機選擇」效率極差；「只走一條預設路徑、失敗即停止」缺乏彈性；「完全依靠 LLM 一次推斷完整路徑」則忽略了逐步探索與回溯的必要。","src":"114年第四次 第11題"},{"id":"gen-114-4-12","s":"gen","q":"某企業考慮將開源大型語言模型(GPT-OSS)自行部署在本地伺服器，以取代雲端服務。下列何者最能代表本地部署對企業的實際好處？","o":["可以達到無運算成本，因為本地部署模型不會產生額外的資源消耗","模型的預測能力會比在雲端運行時更精度，因為本地環境更加可靠","可確保輸入模型的敏感資料不會傳輸給第三方，提升資料隱私和自主控制","以上皆是"],"a":2,"e":"本地部署最主要的價值在於敏感資料不必傳給第三方雲端服務，企業可自主掌控資料與模型，提升隱私與合規性。本地部署仍需硬體、電力與維運，並非「無運算成本」；模型預測能力取決於模型本身，不會因部署在本地而「更精準」，因此「以上皆是」也不成立。","src":"114年第四次 第12題","fix":1},{"id":"gen-114-4-13","s":"gen","q":"關於 GitHub Copilot，下列敘述何者正確？","o":["GitHub Copilot 基於程式碼片段查詢工具，透過後端搜尋大型程式碼資料庫提供建議","GitHub Copilot 僅適用於 GitHub 上的開源專案，無法在私有程式碼庫或本地環境中提供程式碼補全建議","GitHub Copilot 利用靜態分析技術分析程式碼，根據邏輯流程推導下一步應寫的程式碼","GitHub Copilot 由 OpenAI 的 Codex 模型提供技術支援，可即時在開發者編輯程式碼時給出整行或整個函式建議"],"a":3,"e":"GitHub Copilot 最初由 OpenAI Codex 模型驅動，能在開發者撰寫程式時即時建議整行或整個函式。它是生成式模型，並非「後端搜尋程式碼資料庫」或「靜態分析推導」；也能用於私有專案與本地環境，不限 GitHub 開源專案。（註：Copilot 現已改用 GPT-4 系列、Claude 等多種模型，Codex 的描述屬早期事實。）","src":"114年第四次 第13題"},{"id":"gen-114-4-14","s":"gen","q":"某電商公司導入 Agentic AI 來處理客服工作。測試發現 Agent 在回答產品 FAQ 時經常出錯，且無法幫客戶修改訂單。這種情況最可能是因為缺少下列哪兩項工具或技術？","o":["API 調用(API Calling)＋ 任務規劃器(Task Planner)","向量資料庫檢索(Vector Retrieval)＋API 調用(API Calling)","向量資料庫檢索(Vector Retrieval)＋任務規劃器(Task Planner)","任務規劃器(Task Planner)＋溫度參數(Temperature)設定"],"a":1,"e":"FAQ 回答錯誤，代表缺乏向量資料庫檢索來取得正確的產品知識；無法修改訂單，代表缺乏 API 調用來操作訂單系統，兩者正好對應兩個症狀。任務規劃器負責拆解多步驟任務，並非此處主因；溫度參數只影響生成隨機性，既無法補足知識，也無法執行操作。","src":"114年第四次 第14題"},{"id":"gen-114-4-15","s":"gen","q":"某客服自動回應系統希望根據不同客戶群體調整回覆風格。在兼顧即時性與效果的前提下，下列哪一種方案最適合？","o":["直接微調預訓練模型針對每個客戶群體分別訓練不同風格模型","利用控制變量(Control Tokens)或風格標籤在同一模型內動態調整風格","利用生成對抗網路(GAN)生成不同風格文本，並透過人工篩選最終答案","採用規則式替換方法，替換回覆詞彙以符合不同風格要求。"],"a":1,"e":"在同一模型中使用控制標記或風格標籤，可依客群即時切換回覆風格，不需另外訓練，兼顧即時性與效果。「為每個客群各自微調模型」成本高、維護困難；「GAN 生成再人工篩選」無法即時回應；「規則式替換詞彙」過於僵硬，無法真正改變語氣與表達。","src":"114年第四次 第15題"},{"id":"gen-114-4-16","s":"gen","q":"在建置多代理大型語言模型(Multi-agent LLMs)系統時，如果沒有清楚定義每個代理的任務啟動條件和角色分工，最可能出現什麼問題？","o":["回覆內容前後不連貫，系統邏輯斷裂","不同代理的答案互相衝突，無法判斷最終決策","系統陷入無限對話循環，導致資源耗盡","多個代理重複做同樣的任務，造成效率低落"],"a":3,"e":"若未清楚定義各代理的啟動條件與角色分工，多個代理可能同時被觸發、做同樣的工作，造成重複執行與資源浪費，這是分工不明最直接的後果。回覆不連貫、答案衝突或無限循環雖然也可能發生，但較常源於協調機制或終止條件設計不良，而非角色定義本身。","src":"114年第四次 第16題"},{"id":"gen-114-4-17","s":"gen","q":"某公司部署結合 Fine-tuning 與檢索增強生成(RAG)的語言模型系統作為內部文件助理。系統需同時確保回覆語氣一致、能即時查詢每日新增文件、維持效能穩定，並避免頻繁重新訓練。在長期維護與效能平衡下，下列哪一種策略最合適？","o":["每週重新 Fine-tune 模型，將新文件整合進模型知識，逐步取代 RAG模組","完全依靠基礎模型與 RAG，不進行 Fine-tune，僅透過提示設計控制語氣","每日進行增量 Fine-tune，讓模型即時學習新文件內容，避免依賴檢索","保留語氣相關 Fine-tuning，僅透過檢索系統更新文件內容，不頻繁改動模型"],"a":3,"e":"語氣屬於相對穩定的風格，適合以 Fine-tuning 固化；每日新增的文件則交給 RAG 即時檢索，不需頻繁重新訓練，兼顧一致性、即時性與維護成本。每週或每日重新 Fine-tune 成本高、易不穩定，也有遺忘風險；完全不微調、只靠提示控制語氣，則一致性較難保證。","src":"114年第四次 第17題"},{"id":"gen-114-4-18","s":"gen","q":"某客服系統在回覆「訂單取消政策」時，即使生成溫度固定為 0.6，回覆品質仍常出現差異。調查顯示，檢索到的政策內容有時是最新版本，有時則是過時文件，此外 Prompt 約束不足，微調語料也有模糊描述。若要優先改善品質波動，應先解決下列哪一項問題？","o":["調整溫度參數，降低生成隨機性","加強 Prompt 設計，限制模型表達方式","優化微調語料，減少含糊描述","提升檢索系統品質，確保取得的政策內容正確且最新"],"a":3,"e":"品質波動的根源是檢索有時取到過時政策，導致事實層面就出錯；只要輸入內容錯誤，其他調整都無法根治，因此應優先提升檢索品質、確保內容最新。降低溫度只減少隨機性；強化 Prompt 與優化微調語料雖有幫助，但屬次要問題，無法解決資料版本錯誤。","src":"114年第四次 第18題"},{"id":"gen-114-4-19","s":"gen","q":"某醫院導入了一套智慧系統，由三個模組構成：語音辨識(ASR) → 語言模型生成(LLM) → 查詢醫療資料庫 API。近期發現部分查詢結果錯誤，例如醫師詢問「術後復健流程」時，系統卻誤判為要查詢「術前注意事項」，因此查詢到錯誤的文件。經檢查已排除語音辨識的錯誤，下列何者最可能是造成查詢錯誤的來源？","o":["醫療資料庫 API 對應規則設計不清，造成意圖映射模糊","LLM 的 Prompt 缺乏明確指示，導致語意分類判斷錯誤","查詢 API 回傳速度過慢，影響系統處理正確性","LLM 未經醫療領域微調，難以正確理解專業性詞彙"],"a":1,"e":"已排除語音辨識錯誤後，把「術後復健」誤判為「術前注意事項」屬於意圖分類錯誤，最可能是 LLM 的 Prompt 缺乏明確的分類指示。API 對應規則是在意圖確定後才作用；回傳速度慢不會改變查詢內容；未經醫療微調雖可能有影響，但「術前、術後」並非艱深術語，不是最可能的原因。","src":"114年第四次 第19題"},{"id":"gen-114-4-20","s":"gen","q":"某醫院正在規劃一個 AI 專案，目的是協助醫師從胸腔 X 光影像中判斷是否存在肺炎徵兆，團隊卻誤將生成式 AI 模型運用於影像診斷。下列哪一項最可能成為主要風險？","o":["模型在生成報告時語句流暢，但僅在文字表達上有差異，對診斷結果沒有重大影響","模型若資料不足，僅會降低生成報告的完整性，而非影響判斷病灶的正確性","模型偏向生成內容而非分類，但此差異僅影響效率，不會造成誤診風險","模型可能生成與實際影像不符的診斷結論，導致誤判並引發醫療與法律風險"],"a":3,"e":"影像診斷本質上是分類或判讀任務，生成式模型可能「憑空」產生與影像不符的結論（幻覺），造成誤診並衍生醫療與法律責任，這是主要風險。其他說法都低估了風險：聲稱「只影響文字表達」「只降低報告完整性」「只影響效率」，都忽略了生成錯誤直接影響診斷正確性。","src":"114年第四次 第20題"},{"id":"gen-114-4-21","s":"gen","q":"某公司開發的智慧車載語音助理，可透過語音辨識(ASR)辨識駕駛語音，再由 LLM 生成回答並查詢車載 API。測試中發現：ASR 對汽車專業術語辨識錯誤率高；LLM 的回覆常不精確；系統回覆延遲雖存在但仍可接受。若目標是「優先提升準確性與回答品質」，下列改進步驟的最合理執行順序為何？\n1. 擴充並標註汽車領域語音資料，微調 ASR 模型2. 微調 LLM 並加入檢索增強(RAG) 3. 優化系統架構，引入批次推論降低延遲4. 動態調整生成溫度，平衡準確度與多樣性","o":["1 → 2 → 4 → 3","2 → 1→ 3 → 4","1 → 3 → 2 → 4","3 → 1 → 2 → 4"],"a":0,"e":"目標是優先提升準確性：先改善上游的 ASR 專業術語辨識（輸入錯誤，後續全錯），再微調 LLM 並加入 RAG 提升回答品質，接著調整生成溫度細修，最後才處理尚可接受的延遲。先做架構優化或先處理 LLM 的排序，都違反「先準確、後效能」與「先上游、後下游」的原則。","src":"114年第四次 第21題"},{"id":"gen-114-4-22","s":"gen","q":"一家顧問公司使用生成式 AI 協助撰寫數據分析報告。雖然模型在測試中表現優異，但其生成的報告多半僅遵循固定段落結構，替換數值或關鍵詞即可完成，卻未能展現針對不同專案的多樣化推理與分析。下列何者為造成這種現象的最合理解釋？","o":["模型在生成過程中缺乏對字體與排版的優化能力，因此無法展現分析邏輯","測試資料涵蓋過多統計圖表，導致模型無法專注於文字內容的多樣化表達","模型過度依賴訓練語料中的常見報告範式，導致生成結果以樣板化結構取代真正的推理","模型因無法正確辨識報告中的頁碼與標題層級，才出現樣板化的結果"],"a":2,"e":"生成內容只是套固定段落、替換數值，代表模型過度依賴訓練語料中的常見報告範式，以樣板結構取代真正的推理分析。字體排版、頁碼標題辨識屬於格式層面，與推理能力無關；測試資料含過多圖表也無法解釋這種普遍的樣板化現象。","src":"114年第四次 第22題"},{"id":"gen-114-4-23","s":"gen","q":"在應用零樣本提示(Zero-Shot Prompting)時，下列哪一種情境最可能因缺乏示範而失敗，出現語意錯誤或結構錯誤的輸出？","o":["要求模型判斷一段影評文字的情感傾向","要求模型將一段新聞摘要濃縮為一句話","要求模型將一段繁體中文翻譯成英文","要求模型從表格中擷取所有城市的最高氣溫"],"a":3,"e":"從表格擷取特定欄位需要理解表格結構並輸出精確格式，缺乏示範時容易出現欄位對應錯誤或格式不一致，最需要少樣本範例。情感判斷、摘要濃縮、中翻英都是模型在預訓練中大量接觸的常見任務，零樣本通常就能有不錯的表現。","src":"114年第四次 第23題"},{"id":"gen-114-4-24","s":"gen","q":"某保險公司計畫導入生成式 AI 的內部合約查詢系統，協助業務員與法務部門快速解讀保單條款與理賠規範。高層特別強調客戶資料隱私與合規風險控管，即使需要投入較多資源，也必須確保資料不會外洩。在此情況下，下列哪一種策略最符合公司的資料安全與合規優先考量？","o":["導入開源模型並由 IT 團隊自建，後續再逐步補強隱私與合規控管","在需求確認階段即納入法遵與稽核單位，設定準確率 KPI，並透過MVP 驗證成效","優先使用雲端大型 API 模型快速部署，並根據使用數據持續調整","投入資源自訓並私有化部署 LLM，並同步建立自動化風控機制"],"a":3,"e":"題目強調隱私與合規優先、願意投入較多資源，自訓並私有化部署 LLM，再搭配自動化風控機制，最能確保資料不外洩。「開源自建、之後再補合規」順序錯誤；「雲端 API 快速部署」有資料外送風險；「設定準確率 KPI 並以 MVP 驗證」著重成效評估，並未正面處理資料安全。","src":"114年第四次 第24題"},{"id":"gen-114-4-25","s":"gen","q":"某新創公司開發一套圖像描述生成系統，能根據輸入的照片自動產生說明文字。為了讓產生的描述文字能與圖片資訊精準對應，下列哪一種設計思路最關鍵？","o":["強化語言模型的句法與流暢性，確保生成文字更自然易讀","在生成過程中結合圖片特徵與語言建模，讓模型同時利用影像內容與文字資訊","調整生成策略(如 Beam Search 或溫度參數)，以提升輸出文字的合理性","專注於文字序列上下文的建模，只提升文字間的連貫性"],"a":1,"e":"圖像描述屬於多模態任務，關鍵在於生成時同時利用影像特徵與語言建模（例如透過視覺編碼器加上跨模態注意力），讓文字與圖片內容精準對齊。只強化句法流暢度、只建模文字上下文，或只調整 Beam Search、溫度等解碼策略，都沒有引入影像資訊，無法確保描述與圖片相符。","src":"114年第四次 第25題"},{"id":"gen-114-4-26","s":"gen","q":"某電商平台希望生成的商品描述在風格與用詞上保持一致性，但不需要新增專業知識。下列哪種方法最適合？","o":["擴充語料庫並微調模型，使風格統一","增加提示詞複雜度，引導模型風格一致","降低生成溫度，以減少隨機性並提升風格一致性","使用全連接神經網路對生成結果後期篩選"],"a":2,"e":"降低生成溫度可減少隨機性，讓用詞與風格更穩定，而且不需新增知識或重新訓練，成本最低。「擴充語料並微調」適用於需要學習新知識或深度客製的情境，成本較高；「增加提示詞複雜度」未必帶來一致性；「以全連接網路後期篩選」繞路且不實際。（註：一般實務常以提示範例或風格指引來統一風格，溫度主要影響穩定性而非風格本身，本題答案有討論空間。）","src":"114年第四次 第26題"},{"id":"gen-114-4-27","s":"gen","q":"某企業已建置 AI 語音記錄系統，並希望整合生成式 AI 進行「會議即時摘要」功能，下列哪一種策略最能提升摘要的語意品質與使用價值？","o":["使用語音轉文字模型即時輸出逐字稿並轉入 GPT 摘要","將語音逐段切分並建立關鍵字索引，以利摘要模型從中擷取核心內容生成會議重點","將語音轉文字後標註發言角色與主題邊界，結合語意分群進行動態摘要","將所有語音內容儲存為完整紀錄，提供事後人工摘要比對用"],"a":2,"e":"會議摘要要有語意品質，需要知道「誰說了什麼、討論到哪個主題」；標註發言角色與主題邊界，再結合語意分群動態摘要，最能產出結構清楚、具使用價值的重點。逐字稿直接丟給 GPT 缺乏結構；關鍵字索引只能擷取片段；事後人工摘要則失去「即時」的意義。","src":"114年第四次 第27題"},{"id":"gen-114-4-28","s":"gen","q":"某公司正在開發一個智慧客服系統，負責回覆顧客關於退換貨、優惠活動與商品建議等問題。研發團隊嘗試使用不同的提示設計方式來提升模型效能。下列哪一個提示最符合「少樣本提示(Few-Shot Prompting)」的設計原則？","o":["「請回答顧客詢問：如何申請退貨？」","「以下是兩組客服對話範例，請依照相同風格回覆新的顧客問題」","「請逐步分析顧客投訴的原因，並依照推理過程生成合適回覆」","「請以正式的語氣回覆顧客的提問」"],"a":1,"e":"少樣本提示的關鍵是在提示中提供少量範例，讓模型模仿其格式與風格，「提供兩組客服對話範例再回覆新問題」正符合此原則。直接提問、只指定正式語氣都屬於零樣本提示；「逐步分析並依推理過程生成」則是思維鏈（CoT）的做法。","src":"114年第四次 第28題"},{"id":"gen-114-4-29","s":"gen","q":"某投資公司導入生成式 AI，用於即時分析股市波動並提供市場背景資訊。若希望 AI 能兼顧「即時性」與「可靠性」。下列哪一項設計最能有效提升 AI 在即時股市分析上的表現？","o":["將 AI 系統連結至公司內部歷史交易資料庫，以便快速調用既有的案例參考","調整模型的回應邏輯，讓 AI 優先輸出最新市場行情，而不是完整的背景分析","建立與外部即時行情來源同步的查詢模組，確保 AI 能即時擷取最新金融數據","增加訓練資料中模擬的金融危機與市場異常案例，以提升 AI 在特殊情境下的表現能力"],"a":2,"e":"股市分析要求即時性與可靠性，必須讓 AI 連接外部即時行情來源，查詢最新且正確的金融數據。內部歷史交易資料庫缺乏即時性；「優先輸出最新行情」只是調整呈現順序，模型本身仍無最新資料；增加模擬危機訓練資料只能提升特殊情境表現，無法解決即時資訊的問題。","src":"114年第四次 第29題"},{"id":"gen-114-4-30","s":"gen","q":"某大型物流公司計畫導入 AI 系統，以改善客服與配送作業的效率。專案團隊規劃了以下四個步驟，請問正確的執行順序為何？\n1. 建立符合公司服務流程的 AI 對話邏輯與應答範本，確保顧客體驗一致2. 明確定義導入 AI 的目標並設定關鍵績效指標(KPI) 3. 蒐集與清理過往客服紀錄與配送相關資料，作為模型訓練素材4. 評估並選擇合適的 AI 技術供應商或開源方案，確立技術方向與架構","o":["2 → 3 → 4 → 1","3 → 2 → 1 → 4","2 → 1 → 3 → 4","1 → 4 → 3 → 2"],"a":0,"e":"AI 導入應先「定義目標與 KPI」確立方向，再「蒐集與清理資料」掌握可用素材，接著「評估並選擇技術方案」，最後依選定的技術「建立對話邏輯與應答範本」。其他排序不是在目標未明前就先處理資料或範本，就是把目標設定放到最後，都違反先規劃、後執行的原則。","src":"114年第四次 第30題"},{"id":"gen-114-4-31","s":"gen","q":"某跨國電商企業導入生成式 AI，協助處理顧客服務請求，並根據顧客歷史訂單提供個人化建議。資安與法遵部門擔心 AI 在回覆時可能洩漏顧客個資，若要在導入初期優先避免觸法風險，下列哪一項措施最符合要求？","o":["在加密環境下導入完整的顧客訂單與行為資料，並透過嚴格存取控管降低洩漏風險","實施資料最小化與去識別化，確保 AI 在訓練與生成過程中不直接處理或暴露敏感個資","強化模型的回覆審查流程，透過自動過濾與人工抽查結合，降低個資外洩的機率","設定 AI 的角色與回覆範圍，讓其專注於客服相關內容，避免回答其他敏感議題"],"a":1,"e":"避免觸法最根本的做法是從源頭減少個資：落實資料最小化與去識別化，讓 AI 在訓練與生成時不直接接觸可識別資訊。在加密環境中導入完整資料仍處理了大量個資；回覆審查屬事後補救；限制回覆範圍只是控管主題，模型仍可能接觸並洩漏個資。","src":"114年第四次 第31題"},{"id":"gen-114-4-32","s":"gen","q":"某國際銀行導入生成式 AI，用於彙整不同國家金融監管機構的合規規範，建立跨國合規知識庫。由於各國條文表述方式不同，且監管要求具有高度專業性與隱含邏輯，若要確保知識庫在後續查詢與生成報告時能維持正確性與一致性，下列哪一項 AI 能力最為關鍵？","o":["具備跨語言專業術語對齊與條文語意抽取能力，能正確辨識不同國家規範間的對應與差異","能自動最佳化文件檢索效率，縮短跨國法規查詢的延遲時間，提升合規部門使用體驗","能將合規文件轉換為多種輸出形式(如簡報、摘要或法規清單)，以符合不同決策層級需求","具備根據歷史案例生成合規解釋的能力，協助新進員工快速理解法規在實務上的應用"],"a":0,"e":"跨國合規知識庫的正確性與一致性，取決於能否對齊各國專業術語並抽取條文語意，正確辨識不同法規之間的對應與差異。提升檢索效率只改善速度；轉換成簡報、摘要等多種輸出屬於呈現層面；依歷史案例生成解釋偏向教育用途，都不是確保知識正確的核心能力。","src":"114年第四次 第32題"},{"id":"gen-114-4-33","s":"gen","q":"在企業導入 MLOps(Machine Learning Operations)的過程中，除了模型部署與維運挑戰外，仍可能面臨其他推動上的困難。下列何者為No Code 平台最能有效解決的挑戰？","o":["自動化大量資料的標註與前處理，以降低數據準備成本","提升運算基礎設施的可擴展性，以因應大規模服務需求","透過可視化建模介面，降低技術門檻並促進跨部門協作","提供進階特徵工程能力，優化高維度數據的處理效率"],"a":2,"e":"No Code 平台最大的優勢是以視覺化介面降低技術門檻，讓業務與技術人員都能參與，進而促進跨部門協作。大量資料標註與前處理、基礎設施擴展性、進階特徵工程等，屬於資料工程或雲端架構層面的問題，並非 No Code 平台的強項。","src":"114年第四次 第33題"},{"id":"gen-114-4-34","s":"gen","q":"某醫療機構計畫導入生成式 AI 協助撰寫病歷摘要。在技術測試階段，為確保系統能安全應用於臨床，最應優先關注下列哪一項指標？","o":["資料儲存與存取架構的完整性，確保長期運作過程中的數據可追溯性","生成內容的醫療準確性與臨床一致性，避免出現錯誤或誤導性資訊","模型在不同病例語境下的泛化能力，確保不因個別樣本而偏差","系統回應時間的穩定性，以支援醫療場域中可能的即時需求"],"a":1,"e":"病歷摘要直接影響臨床判斷，安全應用的首要指標是醫療準確性與臨床一致性，避免出現錯誤或誤導性資訊。資料可追溯性、泛化能力與回應時間都很重要，但在測試階段若內容不正確，其他指標再好都可能造成醫療傷害，因此優先順序較低。","src":"114年第四次 第34題"},{"id":"gen-114-4-35","s":"gen","q":"在即時客服系統的效能測試中，若針對延遲測試(Latency Testing)進行評估，下列哪一項指標最能反映系統是否符合用戶即時互動需求？","o":["AI 模型在同一分鐘內可完成的回覆訊息數量","客戶從輸入問題到收到第一個完整回應所需的時間","客服系統能連續提供服務的運行時長","AI 產生回答時用詞的多樣性與表達創意程度"],"a":1,"e":"延遲測試衡量的是「從使用者送出請求到收到回應」所需的時間，最能反映即時互動體驗。「每分鐘可完成的回覆數量」是吞吐量指標；「連續運行時長」屬於可用性或穩定性測試；「用詞多樣性與創意」是內容品質指標，三者都不是延遲。","src":"114年第四次 第35題"},{"id":"gen-114-4-36","s":"gen","q":"某航空公司導入生成式 AI 聲控客服，提供航班與票務查詢。有人員透過惡意提示，試圖讓系統洩漏內部安檢流程。在此情境中，下列何者為降低提示攻擊(Prompt Injection)風險的最佳策略？","o":["導入輸入檢測與回應審核流程，防止敏感指令被執行","限制 AI 可回應的主題範圍，使系統僅回答非敏感的航班與票務查詢，避免處理內部或敏感流程資訊","隨機變化回覆內容，讓攻擊者難以預測回應行為以增加攻擊難度","擴充與更新航班與票務資料來源，以提升模型的知識正確性與覆蓋率"],"a":0,"e":"防範提示攻擊最直接有效的做法，是在輸入端偵測惡意指令，並在輸出端審核回應，形成雙層防線。「限制回應主題範圍」有幫助，但攻擊者仍可能透過注入繞過限制；「隨機變化回覆」無法阻止資訊外洩；「擴充資料來源」只改善知識正確性，與攻擊防護無關。","src":"114年第四次 第36題"},{"id":"gen-114-4-37","s":"gen","q":"在機器學習模型的實務應用中，常會出現數據漂移(Data Drift)的情況。此現象主要是指下列哪一種情況？","o":["訓練時使用的資料分佈，與部署後實際輸入資料的統計特徵隨時間逐漸出現差異，導致模型表現衰退","在資料前處理過程中，因特徵刪減或缺失補值不當，造成樣本資訊量下降","模型對訓練數據擬合過度，在未知數據上泛化能力不足","後端資料庫因欄位定義或結構調整，導致特徵提取流程與原始設計不一致"],"a":0,"e":"數據漂移指部署後實際輸入資料的統計分佈隨時間偏離訓練資料，導致模型表現逐漸衰退。前處理不當造成資訊量下降屬於資料品質問題；對訓練資料擬合過度、泛化不足是過擬合；資料庫欄位結構調整造成特徵不一致則屬於系統或管線錯誤，都不是漂移。","src":"114年第四次 第37題"},{"id":"gen-114-4-38","s":"gen","q":"某銀行導入生成式 AI 放貸審核系統，用於分析申貸人條件並生成初步審核意見。測試過程中發現，模型對不同族群的核准率存在顯著差異，可能引發演算法偏見問題。為降低此風險，下列哪一項措施最合適？","o":["提升模型運算速度與效能，以確保在大量申請中快速回應","全面移除與申貸人身份相關的敏感屬性，避免模型因變數影響而產生偏差","導入資料與結果的公平性檢測流程，並依合規規範調整模型或決策邏輯","減少訓練樣本數量，降低偏見被放大的可能性"],"a":2,"e":"降低演算法偏見應建立公平性檢測流程，定期檢查資料與結果在各族群間的差異，再依合規要求調整模型或決策邏輯。提升運算速度與偏見無關；單純移除敏感屬性仍可能因郵遞區號等代理變數保留偏差；減少訓練樣本反而會降低代表性，讓偏差更嚴重。","src":"114年第四次 第38題"},{"id":"gen-114-4-39","s":"gen","q":"在提示工程(Prompt Engineering)的應用中，Chain-of-Thought (CoT)與 Tree of Thoughts(ToT)各適用於不同的推理情境，請問以下兩個情境，分別最適合採用哪一種方法？情境一：電商公司開發客服助理，用來協助客戶查詢退款流程與相關規範情境二：活動策劃團隊使用 AI 協助規劃多場跨部門行銷活動，需要同時考量預算、場地、時程與人力資源，並比較不同方案的可行性。","o":["情境一採用 CoT，情境二採用 ToT","情境一採用 ToT，情境二採用 CoT","情境一與情境二都適合 CoT","情境一與情境二都適合 ToT"],"a":0,"e":"情境一的退款流程查詢屬於單一路徑、按步驟說明的問題，適合用 CoT 逐步推理；情境二需同時權衡預算、場地、時程、人力，並比較多個方案，適合用 ToT 探索多條推理路徑後評估擇優。把兩者對調，或兩者都用同一種方法，都無法對應各自的推理需求。","src":"114年第四次 第39題"},{"id":"gen-114-4-40","s":"gen","q":"在生成式 AI 的提示工程中，Graph Prompting 在處理複雜關係資料時，為何通常比 Chain-of-Thought(CoT)更有效？","o":["Graph Prompting 幾乎不需要推理，只依靠圖結構即可得出結論","Graph Prompting 僅需單次提示，即可避免多輪推理的誤差累積","Graph Prompting 的生成速度通常更快，因此效率更高","Graph Prompting 能捕捉非線性結構與上下文關聯，適合處理網絡化資訊"],"a":3,"e":"Graph Prompting 以節點與邊表達實體及其關係，能捕捉非線性結構與上下文關聯，適合處理社群、知識圖譜等網絡化資訊；CoT 則是線性推理鏈。說它「幾乎不需推理」「只需單次提示」或「生成速度較快」，都不是它優於 CoT 的真正原因。","src":"114年第四次 第40題"},{"id":"gen-114-4-41","s":"gen","q":"在少樣本提示(Few-shot Prompting)僅能提供 1–2 個範例的情況下，若遇到領域偏移(Domain Shift)，下列何者為模型最可能面臨的核心挑戰？","o":["範例數量過少，無法涵蓋新領域的多樣性，導致模型泛化不足","範例表徵有限，模型容易依賴單一樣本特性而降低適應力","範例覆蓋不足，使模型難以抽取跨領域的穩定模式","範例資訊過於稀缺，模型缺乏應對不同輸入情境的能力"],"a":0,"e":"只有 1–2 個範例時遇到領域偏移，核心問題在於範例數量過少，無法涵蓋新領域的多樣性，導致模型泛化不足。其餘說法（依賴單一樣本特性、難以抽取跨領域模式、缺乏應對不同情境的能力）都是此問題衍生的表現，而非根本原因。（註：四個選項語意高度重疊，鑑別度不高。）","src":"114年第四次 第41題"},{"id":"gen-114-4-43","s":"gen","q":"在評估大型語言模型，例如 7B、13B、175B 參數規模時，模型規模對基準測試(Benchmark)結果的影響，下列哪一種說法最為恰當？","o":["小模型在正確調整下能超越大模型，因此模型大小並不重要","大模型在多數情境下表現較好，但在特定任務上略遜於小模型","模型規模與基準測試結果完全無關，影響主要來自測試設計","模型越大，Benchmark 結果可能提升，但幅度取決於訓練數據品質與資源配置"],"a":3,"e":"一般而言，模型規模越大，Benchmark 分數越可能提升，但提升幅度仍取決於訓練資料品質、訓練資源與調校方式。說「模型大小不重要」或「與結果完全無關」都過於武斷；「大模型在特定任務上略遜於小模型」只描述個別現象，並非整體規律。","src":"114年第四次 第43題"},{"id":"gen-114-4-44","s":"gen","q":"在 AI 應用設計中，Model Context Protocol(MCP)與檢索增強生成(RAG)都能擴展模型的能力，但兩者的核心差異主要為下列何者？","o":["MCP 擴展模型工具，但主要用於補足訓練資料不足","MCP 能標準化連接資源，但仍需依賴向量資料庫","RAG 常用於擴展知識庫內容，而 MCP 更著重於動態工具與 API 呼叫的整合","RAG 透過統一協議，提升回答相關性"],"a":2,"e":"RAG 主要透過檢索外部文件來擴充模型可用的知識內容；MCP 則是標準化協定，著重讓模型動態連接工具、API 與系統並執行操作。MCP 的目的不在補足訓練資料，也不必依賴向量資料庫；「統一協議」是 MCP 的特徵而非 RAG，因此其他說法皆張冠李戴。","src":"114年第四次 第44題"},{"id":"gen-114-4-45","s":"gen","q":"下列哪一個資料集專門設計用於測試大型語言模型在多領域、多任務語言理解中，涵蓋人文、科學與社會科學等領域，而非專門用於數學推理或中文專業知識？","o":["MMLU","GSM8K","MATH","C-Eval"],"a":0,"e":"MMLU（Massive Multitask Language Understanding）涵蓋人文、社會科學、STEM 等 57 個學科，專門測試多領域、多任務的語言理解能力。GSM8K 是小學程度的數學應用題；MATH 是競賽等級數學推理；C-Eval 則是中文多學科知識評測，都不符合題目描述。","src":"114年第四次 第45題"},{"id":"gen-114-4-46","s":"gen","q":"某智慧工廠導入生成式 AI，協助產線工程師即時產生維修指引與操作建議。下列哪一項並非團隊在系統設計中加入 Guardrails(防護機制)的主要目的？","o":["檢查工程師輸入內容，避免觸發錯誤或危險需求","過濾與驗證 AI 輸出的維修指引，確保符合安全標準","確保生成的操作建議符合法規與產業安全規範","完整重建並追蹤 AI 模型的全部推理過程"],"a":3,"e":"Guardrails 的目的是檢查輸入、過濾並驗證輸出，確保內容安全且符合法規與產業規範。「完整重建並追蹤模型全部推理過程」屬於可解釋性或可觀測性的範疇，目前技術也難以做到，並非 Guardrails 的主要目的。其餘三項都是典型的防護機制功能，因此不是答案。","src":"114年第四次 第46題"},{"id":"gen-114-4-47","s":"gen","q":"某顧問公司導入生成式 AI，協助團隊快速檢索並摘要長篇的法規文件。為了改善檢索結果常出現不相關或過於分散內容的問題，下列何者為團隊決定對文件進行文本切分(Chunking)的主要目的？","o":["讓模型在回答時能加快推理速度","提高檢索相關性與降低長上下文噪音","降低系統記憶體和硬體資源的負擔","使模型在生成回覆時更具創造性與多樣化"],"a":1,"e":"將長篇文件切成語意完整的小段落，可讓向量檢索更精準地比對到相關片段，減少不相關內容混入，並降低長上下文帶來的噪音。推理速度或記憶體負擔的改善只是附帶效果，並非主要目的；切分也與提升生成的創造性或多樣性無關。","src":"114年第四次 第47題"},{"id":"gen-114-4-48","s":"gen","q":"某開發團隊在建置企業內部知識檢索系統時，選擇採用多向量檢索器(Multi-vector Retriever)，下列何者為協助提升系統查詢的完整性與精準度的主要方式？","o":["支援同時處理多種資訊表示，提升跨文本型態的檢索效果","透過多向量壓縮與共享權重方式，降低檢索過程的運算與儲存成本","以切分並過濾文件片段，減少上下文長度帶來的 Token 負擔","透過調整生成階段的溫度參數，使模型在回覆時更穩定一致"],"a":0,"e":"多向量檢索器會為同一份文件建立多種表示（例如摘要、原文片段、假設性問題、表格或圖片描述），並分別建立向量，提升跨文本型態檢索的完整性與精準度。它反而會增加儲存量，而非「壓縮降低成本」；切分片段是 Chunking 的範疇；溫度參數則屬於生成階段，與檢索無關。","src":"114年第四次 第48題"},{"id":"gen-114-4-49","s":"gen","q":"在 Agentic AI 的架構中，解決方案圖譜(Solution Graph)常被用來輔助代理的任務執行，其主要作用為何？","o":["透過圖形結構完全取代大型語言模型的推理，讓代理只依靠圖演算法完成任務","僅用於保存代理的輸出結果，方便後續檢視與審計，而不影響實際推理流程","將代理限制在既定流程內，避免其產生偏離設計腳本的行為","作為代理在執行過程中的參考框架，用於組織決策步驟並支援任務推理"],"a":3,"e":"解決方案圖譜為代理提供任務分解與決策步驟的參考框架，協助其組織推理並規劃執行路徑。它不會「完全取代 LLM 推理」，也不只是「保存輸出供審計」；若把代理「限制在既定流程內」，等於變回固定腳本，失去 Agentic AI 的自主規劃特性。","src":"114年第四次 第49題"},{"id":"gen-114-4-50","s":"gen","q":"小明想開發一個部落格寫作工具，讓用戶輸入文章開頭後，系統自動幫忙寫出後續內容，例如輸入「今天去了台北木柵動物園...」，系統就能續寫。若要實現這樣的功能，最適合選擇下列哪一類任務？","o":["序列到序列建模(Sequence-to-Sequence Modeling)，透過輸入序列產生新的輸出序列","遮罩語言建模(Masked Language Modeling)，補齊文字中缺失的詞語或片段","生成式語言建模(Text Generation)，依據上下文持續產生新的內容","文本分類(Text Classification)，針對輸入文本判斷情感、主題或標籤《以下空白》"],"a":2,"e":"續寫文章是典型的生成式語言建模：依前文上下文逐字預測並持續產生新內容，GPT 類模型就是以此為核心。序列到序列建模偏向翻譯、摘要等「輸入轉換為另一個輸出」的任務；遮罩語言建模用於補齊缺字（如 BERT）；文本分類只輸出標籤，不會生成內容。","src":"114年第四次 第50題"},{"id":"gen-115-1-01","s":"gen","q":"某零售企業導入生成式 AI 商品推薦系統。測試結果顯示，在購物行為、偏好設定與價格區間相同的情況下，不同客戶族群收到的推薦商品類型仍出現明顯差異，且差異方向不易以既有行銷策略解釋。若在模型架構與推論設定皆未調整情形下，專案目標是優先降低可能的模型偏差風險，下列何者最合理？","o":["重新檢視訓練資料的樣本分布與代表性","限制推薦結果僅顯示高銷量商品","降低模型參數規模以簡化決策邏輯","提高推薦結果的隨機性以增加多樣性"],"a":0,"e":"在相同條件下推薦結果卻因族群不同而出現難以解釋的差異，且模型架構與推論設定都未變動，最可能是訓練資料的樣本分布不均或代表性不足所致，應優先檢視資料。「只推高銷量商品」迴避問題又損害個人化；「降低參數規模」無法消除資料偏差；「提高隨機性」只是掩蓋偏差而非修正。","src":"115年第一次 第1題"},{"id":"gen-115-1-02","s":"gen","q":"在進行大型語言模型 (LLM) 企業專屬知識的 Fine-tuning 時，若內部 GPU 運算資源與記憶體嚴重受限，下列哪一種參數高效微調(PEFT, Parameter Efficient Fine-Tuning)技術最能在維持模型效能的前提下，顯著降低需更新的參數數量？","o":["知識蒸餾(Knowledge Distillation)","提示詞工程(Prompt Engineering)","梯度凍結(Gradient Freezing)","低秩適配(Low-Rank Adaptation)"],"a":3,"e":"LoRA（低秩適配）凍結原始權重，只在特定層加入低秩矩陣進行訓練，能大幅減少需更新的參數量與記憶體需求，是代表性的 PEFT 技術。知識蒸餾是訓練小模型模仿大模型，屬於模型壓縮；提示詞工程不更新參數；梯度凍結只是概念性做法，並非題目所指的標準 PEFT 方法。","src":"115年第一次 第2題"},{"id":"gen-115-1-03","s":"gen","q":"某企業規劃透過 Low-Code 平台建置可視化儀表板，以支援營運數據的即時監控與分析判讀。若企業特別關注儀表板顯示結果的穩定性與分析可信度，下列何者最應優先確認？","o":["是否具備穩定的資料串接能力與即時更新機制","是否提供自動化決策建議與預測分析模組","是否支援彈性介面設計與多角色權限管理","是否整合流程觸發與跨系統通知功能"],"a":0,"e":"儀表板的穩定性與可信度取決於資料來源：必須先確認具備穩定的資料串接與即時更新機制，顯示的數字才正確可靠。自動化決策建議與預測模組屬於加值功能；介面設計與權限管理關乎使用體驗與安全；流程觸發與通知則是自動化功能，都不是確保分析可信度的首要條件。","src":"115年第一次 第3題"},{"id":"gen-115-1-04","s":"gen","q":"某企業導入生成式 AI 客服系統後發現，系統整體運作穩定，且在單位時間內可處理大量對話請求。部分使用者仍反映在互動過程中回覆出現卡頓感，經初步排除網路連線與前端介面效能問題後，若專案團隊希望針對此現象進行效能測試，下列何者最符合測試重點？","o":["評估系統長時間運作的穩定程度","測量系統單位時間的總處理量","比較不同回覆內容的語言品質","分析單次互動回覆的反應速度表現"],"a":3,"e":"系統吞吐量充足、運作穩定，網路與前端也已排除，使用者感受到的「卡頓」指向單次回覆的反應速度，應聚焦延遲測試（例如首字回應時間）。長時間穩定度屬於耐久測試；單位時間總處理量是吞吐量，題目已表示沒問題；語言品質則不屬於效能測試範疇。","src":"115年第一次 第4題"},{"id":"gen-115-1-05","s":"gen","q":"某企業導入生成式 AI 系統，希望自動產出客服回覆與內部文件摘要。系統需能理解使用者輸入的完整語句內容，並在回覆中維持語意連貫，即使對話內容較長仍能保持上下文一致性。基於上述需求，下列何種模型架構最為適合？","o":["卷積神經網路(Convolutional Neural Network, CNN)","遞迴神經網路(Recurrent Neural Network, RNN)","基於 Transformer 架構的自迴歸模型(Autoregressive Model)","生成對抗網路(Generative Adversarial Network, GAN)"],"a":2,"e":"Transformer 透過自注意力機制捕捉長距離語意關聯，以自迴歸方式逐字生成，能在長對話中維持上下文一致，是 GPT 等文字生成模型的主流架構。CNN 擅長影像的局部特徵；RNN 處理長序列時容易遺忘早期資訊；GAN 主要用於影像生成，不適合文字理解與長篇生成。","src":"115年第一次 第5題"},{"id":"gen-115-1-06","s":"gen","q":"OpenAI 已為 Sora 生成的影片提供多種出處證明機制，以降低誤導性或欺騙性內容帶來的風險。下列何者不屬於目前 OpenAI 官方為 Sora 內容提供的出處證明工具？","o":["所有資產上內嵌的 C2PA(Content Credentials)元數據","預設可見的動態浮水印","用於追蹤生成內容的內部反向影像與音訊搜尋工具","平台對外開放的實時來源驗證介面"],"a":3,"e":"OpenAI 官方說明 Sora 的出處機制包括：所有資產內嵌 C2PA 元數據、預設可見的動態浮水印，以及內部反向影像與音訊搜尋工具。官方並未提供「對外開放的實時來源驗證介面」，因此此項不屬於官方工具。其餘三項皆為官方明確列出的機制。","src":"115年第一次 第6題"},{"id":"gen-115-1-07","s":"gen","q":"某企業導入 No-Code/Low-Code 平台，讓各部門能自行建立資料分析與流程應用。隨著使用範圍擴大，管理層開始關注資料權限、存取紀錄與合規要求。依資料治理觀點，下列何者最合理描述此類平台對企業治理機制的典型影響？","o":["平台內建角色權限與資料存取控管機制，有助治理制度落實","平台強化部門自主性，通常使既有治理流程難以延續","平台主要支援應用快速開發，資料治理仍需完全仰賴外部系統","平台透過自動化設定機制，可顯著降低治理與合規管理需求"],"a":0,"e":"成熟的 No-Code/Low-Code 平台通常內建角色權限、資料存取控管與稽核紀錄，有助企業落實資料治理。「使既有治理流程難以延續」過於負面；「治理需完全仰賴外部系統」低估了平台功能；「可顯著降低治理與合規需求」則錯誤，治理責任不會因工具而消失。","src":"115年第一次 第7題"},{"id":"gen-115-1-08","s":"gen","q":"某製造企業規劃於設備端建置邊緣運算(Edge Computing)架構，並以 No-Code/Low-Code 平台開發即時監控應用。測試顯示，系統在雲端環境執行順暢，但部署至邊緣裝置後出現回應延遲與效能下降。依此情境判斷，下列何者最合理解釋該現象？","o":["邊緣運算架構可降低系統對效能的需求","No-Code/Low-Code 平台僅能在雲端環境執行","雲端部署通常比邊緣部署更容易出現延遲","邊緣裝置通常受限於運算能力與可用資源"],"a":3,"e":"邊緣裝置的 CPU、記憶體與儲存資源通常遠少於雲端伺服器，同一應用部署到邊緣後，自然容易出現延遲與效能下降。邊緣運算並不會「降低效能需求」；No-Code/Low-Code 平台並非「僅能在雲端執行」；邊緣部署的本意是降低網路延遲，說雲端「更容易延遲」與本情境的現象相反。","src":"115年第一次 第8題"},{"id":"gen-115-1-09","s":"gen","q":"某企業使用生成式 AI 進行文字分類，初期僅根據既有業務資料設計少量樣本提示(Few-shot Prompting)。當模型應用至新市場資料時，團隊發現分類結果明顯不穩定，且原先提供的範例並未涵蓋新市場常見的表達方式。依此情境判斷，下列何者最可能為主要原因？","o":["模型容易對單一範例產生過度記憶","少量範例難以涵蓋新情境的資料差異","Prompt 設計無法引導模型擷取共通特徵","模型推理能力不足以完成分類任務"],"a":1,"e":"少樣本提示仰賴範例引導，當新市場的表達方式未出現在範例中，模型缺乏參考依據，分類自然變得不穩定，主因是少量範例無法涵蓋新情境的資料差異。「過度記憶單一範例」「Prompt 無法引導擷取共通特徵」並非題目描述的核心；模型原本在既有資料上表現正常，也代表推理能力足夠。","src":"115年第一次 第9題"},{"id":"gen-115-1-10","s":"gen","q":"某企業建置檢索增強生成(Retrieval-augmented generation, RAG)系統支援內部知識查詢。隨著使用量提升，團隊發現模型回覆品質穩定，但推論延遲與運算成本逐漸增加。專案規劃在維持回覆品質前提下進行效能優化。在此情境下，若採用知識蒸餾(Knowledge Distillation)，下列敘述何者最為合理？","o":["將檢索資料轉換為結構化規則以取代模型","僅透過增加檢索文件數量改善效能","停用生成模型以避免延遲問題","使小型模型學習大型模型行為，以降低推論成本"],"a":3,"e":"知識蒸餾是讓小型「學生模型」學習大型「教師模型」的輸出行為，在盡量保留品質的同時降低推論成本與延遲。把檢索資料轉成規則以取代模型並不是蒸餾；增加檢索文件數量反而會加重運算負擔；停用生成模型則無法維持回覆品質，違反題目前提。","src":"114年第四次 第42題、115年第一次 第10題"},{"id":"gen-115-1-11","s":"gen","q":"某零售企業規劃提升門市數據應用能力，目標包括：門市主管可自行調整分析畫面與檢視指標呈現，以及由行銷部門建立銷售預測模型，以支援補貨與促銷規劃。企業在選型時以工具的主要功能定位與典型用途作為評估依據。依此需求判斷，下列哪一項 AI 工具使用規劃最合理？","o":["以 AutoML 作為分析介面調整平台，No-Code 平台用於模型訓練","以 No-Code 平台支援分析與介面調整，AutoML 負責模型建立","僅導入 No-Code 平台，同時滿足高階模型建立與分析需求","僅導入 AutoML，以兼顧介面調整與模型訓練"],"a":1,"e":"No-Code 平台的定位是讓非技術人員自行調整分析畫面與指標呈現；AutoML 的定位則是自動化建立與調校機器學習模型，適合銷售預測。把兩者角色對調不符合工具定位；只導入其中一種工具，也無法同時滿足介面調整與預測建模兩種需求。","src":"115年第一次 第11題"},{"id":"gen-115-1-12","s":"gen","q":"下列何者最能正確說明 Model Context Protocol(MCP)與檢索增強生成(Retrieval-Augmented Generation, RAG)在功能定位上的主要差異？","o":["MCP 主要用於降低模型訓練成本；RAG 主要用於提升推論速度","MCP 著重模型與外部工具或系統互動；RAG 著重補充模型知識來源","RAG 必須依賴向量資料庫；MCP 不需任何外部整合","RAG 屬標準化通訊協議；MCP 屬資料檢索技術"],"a":1,"e":"MCP 是標準化協定，著重讓模型與外部工具、系統互動並執行操作；RAG 則透過檢索外部文件來補充模型的知識來源。兩者都與降低訓練成本、提升推論速度無關；RAG 不一定要用向量資料庫，MCP 本身就是為外部整合而設計；「RAG 是通訊協議、MCP 是檢索技術」則把兩者顛倒了。","src":"115年第一次 第12題"},{"id":"gen-115-1-13","s":"gen","q":"某企業建置文件型知識查詢系統，將大量長篇內部文件轉換為可供生成式 AI 使用的知識來源。在測試過程中，團隊發現若直接以整份文件進行檢索，模型回覆常包含無關內容，且引用段落不夠精準。團隊評估後，決定導入 Chunking 機制的主要目的為何？","o":["透過縮短輸入長度，加速模型推理流程","提升檢索結果的語意對齊程度，並降低長文件帶來的干擾","減少模型執行時的記憶體使用量，以提升系統穩定性","讓模型在生成回覆時具備更高的創意發揮空間"],"a":1,"e":"Chunking 把長文件切成語意完整的段落，讓檢索能精準比對到相關片段，提升語意對齊程度，並減少整份長文件帶來的無關內容干擾，正好解決題目所述的引用不精準問題。加速推理、減少記憶體使用只是附帶效果；切分也與提升創意發揮無關。","src":"115年第一次 第13題"},{"id":"gen-115-1-14","s":"gen","q":"某企業導入大型語言模型(LLM)分析內部報表，使用者經常提供 Excel 匯出的表格資料(如銷售數據與統計表)。測試時發現，模型對原始表格解析效果不穩定。為提升模型理解與回應品質，下列哪一種上下文工程(Context Engineering)作法較為適當？","o":["將表格內容轉換為結構化 JSON 或 Markdown table","在維持原始表格呈現方式下，補充欄位與數據說明","將表格資料隨機切割後分段輸入","直接提供原始表格內容以保留完整資訊"],"a":0,"e":"Excel 原始表格匯出後常失去欄位對應關係，轉換成 JSON 或 Markdown table 等結構化格式，能明確保留欄位與數值的對應，讓 LLM 更容易解析。維持原始格式、只補充說明仍未解決結構混亂；隨機切割會破壞表格完整性；直接提供原始內容正是目前效果不穩定的原因。","src":"115年第一次 第14題"},{"id":"gen-115-1-15","s":"gen","q":"在生成式 AI 應用設計中，情境感知代理(Context-aware Agent)的核心特性為何？","o":["能依任務需求即時重新訓練模型參數以優化結果","僅依使用者當前輸入指令執行任務，不保留歷程資訊","具備跨模態處理能力，可同時理解文字與影像內容","能利用對話歷史、任務狀態調整行為與決策"],"a":3,"e":"情境感知代理的核心在於能利用對話歷史、任務狀態與環境資訊，動態調整行為與決策。它不需要即時重新訓練模型參數；「不保留歷程、只看當前指令」正好與情境感知相反；跨模態處理是多模態模型的特性，與情境感知是不同概念。","src":"115年第一次 第15題"},{"id":"gen-115-1-16","s":"gen","q":"某企業建置 Agentic AI 系統處理跨部門複雜任務，團隊以解決方案圖譜(Solution Graph)作為規劃框架。下列何者為 Solution Graph 的主要功能？","o":["取代語言模型推理機制，改以圖形搜尋完成決策","作為任務知識庫，用於儲存 AI 已完成案例以供檢索","限制代理(Agent)僅能依固定流程執行，以降低行為不確定性","定義代理(Agent)可參考的任務分解與決策路徑結構"],"a":3,"e":"解決方案圖譜定義代理可參考的任務分解與決策路徑結構，作為規劃複雜任務的框架。它不會「取代語言模型推理」，也不是單純「儲存已完成案例」的知識庫；若「限制代理只能依固定流程執行」，就失去了代理自主規劃與調整的能力。","src":"115年第一次 第16題"},{"id":"gen-115-1-17","s":"gen","q":"某企業提供大型語言模型(LLM)API 服務，需支援高併發請求與流量波動，同時要求服務不中斷並具備故障容忍能力。若以高可用性與可擴展性為主要設計原則，下列哪一種部署方式較為適當？","o":["採用單一高效能虛擬機(VM)集中部署，以提升資源使用效率","建立多個模型服務實例並透過負載分散機制提供服務","將推論任務改由用戶端設備分擔，以降低伺服器負載壓力","使用 FTP 協議傳輸請求與回應，以減少服務通訊負擔"],"a":1,"e":"建立多個模型服務實例並透過負載平衡分散請求，即使單一實例故障，其他實例仍可繼續服務，也能依流量水平擴展，同時滿足高可用性與可擴展性。單一 VM 有單點故障風險；把推論交給用戶端受限於裝置效能且難以控管；FTP 並不是適合 API 服務的通訊協定。","src":"115年第一次 第17題"},{"id":"gen-115-1-18","s":"gen","q":"關於 ChatGPT、Anthropic Claude、GitHub Copilot 等 AI 程式碼輔助工具的運作原理，下列敘述何者正確？","o":["這些工具基於大型語言模型，經由大量程式碼與文本訓練，透過預測下一個符號來生成程式碼，但不保證產生程式碼的正確性","GitHub Copilot 會在提供程式碼建議前執行並驗證該程式碼，確保其執行結果正確無誤","Anthropic Claude 的程式碼建議並非即時生成，而是從事先整理的已知解答資料庫中檢索而得","ChatGPT 內建完整的編譯器，可在輸出程式碼前自動編譯並更正所有語法與邏輯錯誤"],"a":0,"e":"這些工具都基於大型語言模型，從大量程式碼與文本中學習，透過預測下一個 Token 來生成程式碼，因此可能產生錯誤，不保證正確。Copilot 不會在建議前「執行並驗證」程式碼；Claude 是即時生成，而非從「已知解答資料庫」檢索；ChatGPT 也沒有內建編譯器自動修正所有錯誤。","src":"115年第一次 第18題"},{"id":"gen-115-1-19","s":"gen","q":"某新創公司採用 MVP(Minimum Viable Product)策略，導入 Vibe Coding 以加速開發，雖然初期能快速產出可運作功能，但技術主管提醒，在正式上線前仍可能存在程式碼品質與安全風險。下列哪一項措施最合理，以降低品質與安全問題？","o":["直接沿用 AI 生成程式碼至正式環境，以降低開發成本","持續優化提示詞，即可避免大部分品質問題","將生成程式碼納入審查、重構與安全測試流程","限制開發者修改 AI 生成之程式碼架構，以維持一致性"],"a":2,"e":"Vibe Coding 產出的程式碼可能隱含品質缺陷與安全漏洞，上線前應納入程式碼審查、重構與安全測試流程，才能有效控管風險。直接沿用到正式環境風險極高；只靠「優化提示詞」無法保證品質；「限制開發者修改架構」反而會阻礙問題修正。","src":"115年第一次 第19題"},{"id":"gen-115-1-20","s":"gen","q":"在規劃生成式 AI 解決方案時，下列何種應用場景最適合採用 GPT-Realtime 類型模型？","o":["需長時間批次處理的大規模報表生成任務","即時資料查詢與結構化資訊檢索系統","即時語音客服與互動式 AI 代理","以高一致性為優先的法規文件自動摘要"],"a":2,"e":"GPT-Realtime 類模型專為低延遲的即時語音互動設計，可直接處理語音輸入與輸出，最適合即時語音客服與互動式 AI 代理。批次報表生成與法規摘要不需要即時性；結構化資訊檢索屬於資料庫或 RAG 的範疇，不需要即時語音模型。","src":"115年第一次 第20題"},{"id":"gen-115-1-21","s":"gen","q":"關於 2025 年 OpenAI 提供的 AgentKit，下列何者最能描述其主要用途？","o":["建立強化式學習(Reinforcement Learning)訓練所需的互動式模擬環境","提供代理(Agent)模型的大規模預訓練與權重優化機制","「Agent-to-Agent」的代理通訊協議","支援 Agents 的建構、工具整合與任務流程開發"],"a":3,"e":"OpenAI 於 2025 年推出的 AgentKit 是一套代理開發工具組，包含視覺化流程建構器（Agent Builder）、工具與連接器整合、對話介面元件與評估功能，用於建構與部署 Agents。它不是強化學習模擬環境，也不提供模型預訓練；「Agent-to-Agent」通訊協議則是 Google 提出的 A2A。","src":"115年第一次 第21題"},{"id":"gen-115-1-22","s":"gen","q":"所有在 Gemini 應用程式透過 Veo 生成的影片，皆採用何種技術措施來協助企業用戶應對 AI 生成內容可能帶來的不實資訊風險？","o":["嚴格限制所有用戶每日的影片生成次數與使用時間","在所有生成影片的開頭與結尾處強制加入明顯的 AI 標示警語","要求所有影片輸出時必須附帶至少 10 秒的免責聲明片段","使用 SynthID 技術在每一幀(frame)影片中嵌入不可見的數位浮水印"],"a":3,"e":"Google 在 Gemini 應用程式中以 Veo 生成的影片，都會透過 SynthID 在每一幀嵌入人眼不可見的數位浮水印，用以識別 AI 生成內容。限制每日生成次數、在影片開頭結尾加警語，或附加 10 秒免責聲明片段，都不是 Google 採用的技術措施。","src":"115年第一次 第22題"},{"id":"gen-115-1-23","s":"gen","q":"某保險公司想建立智慧理賠系統，包含兩個功能：(1)自動判斷理賠案件是否為詐欺案件 (2)自動生成理賠調查報告。請問這兩個功能分別屬於哪種 AI 技術類型？","o":["(1)鑑別式 AI (2)生成式 AI","(1)生成式 AI (2)鑑別式 AI","兩者都是鑑別式 AI","兩者都是生成式 AI"],"a":0,"e":"判斷理賠案件「是否為詐欺」是對輸入資料進行分類，屬於鑑別式 AI；自動「生成調查報告」是產生新內容，屬於生成式 AI。將兩者對調，或把兩項功能歸為同一類，都混淆了「分類判斷」與「內容生成」這兩種本質不同的任務。","src":"115年第一次 第23題"},{"id":"gen-115-1-24","s":"gen","q":"某大型製造工廠導入生成式 AI 系統來優化能源消耗，每日需處理約 10 萬筆設備數據並生成能源優化建議。系統每月 API 調用成本約 15 萬元，內部維護人力成本8 萬元，基礎設施成本 5 萬元。該工廠評估導入效益時，下列哪一項總體擁有成本(Total Cost of Ownership, TCO)分析最完整？","o":["主要以 API 調用成本 15 萬元作為 TCO 評估基礎","以 API 調用成本 15 萬元及維護人力成本 8 萬元進行整體估算","綜合 API 調用、維護人力與基礎設施等直接成本進行評估，共約 28 萬元","除直接成本外，並考量訓練、系統整合與資安合規等相關支出"],"a":3,"e":"TCO 應涵蓋系統完整生命週期的所有成本：除 API、人力、基礎設施等直接成本外，還包括模型訓練、系統整合、資安合規、教育訓練等間接支出。只算 API 成本、只算 API 加人力，或只算三項直接成本（28 萬元），都遺漏了重要的隱性成本，評估不夠完整。","src":"115年第一次 第24題"},{"id":"gen-115-1-25","s":"gen","q":"某機構計畫導入生成式 AI 旅遊資訊服務對話系統自動生成多語言對話。目前每月需人工翻譯 600 則訊息，每則成本 50 元；若改用 ChatGPT API，每則訊息需 2000 Tokens，而 Token 成本 0.8 元/1000 Tokens，但需額外投入系統整合費用 20 萬元。關於投資報酬率(Return on Investment, ROI)評估，下列何者最為正確？","o":["每月節省成本 29,040 元，系統整合成本約 7 個月回收","每月節省成本 30,000 元，系統整合成本約 7 個月回收","每月節省成本 28,040 元，系統整合成本約 8 個月回收","每月節省成本 25,000 元，系統整合成本約 8 個月回收"],"a":0,"e":"人工翻譯每月 600 × 50 = 30,000 元；API 每則 2,000 Tokens × 0.8 元／1,000 Tokens = 1.6 元，每月 600 × 1.6 = 960 元。每月節省 30,000 − 960 = 29,040 元，整合費 200,000 ÷ 29,040 ≈ 6.9，約 7 個月回收。「節省 30,000 元」忽略了 API 成本，其餘數字皆計算錯誤。","src":"115年第一次 第25題"},{"id":"gen-115-1-26","s":"gen","q":"某支付平台為了強化洗錢行為檢測，計劃導入生成式 AI 技術來輔助分析可疑交易模式。該平台擁有大量歷史交易記錄和已知洗錢案例資料，希望 AI 能自動生成可疑交易的特徵描述報告。下列哪一種生成式 AI 技術最適合此需求？","o":["使用 Midjourney 生成交易流程圖像","採用 Few-shot Learning 訓練圖像識別模型","運用 RAG 檢索增強生成技術結合歷史案例資料庫","直接使用 ChatGPT 的基礎模型進行分析"],"a":2,"e":"以 RAG 結合歷史交易與已知洗錢案例資料庫，模型能檢索相似案例作為依據，生成有根據的可疑交易特徵報告。Midjourney 是圖像生成工具，與文字報告無關；圖像識別模型不適用於交易資料；直接使用 ChatGPT 基礎模型則缺乏平台內部資料，容易產生幻覺。","src":"115年第一次 第26題"},{"id":"gen-115-1-27","s":"gen","q":"某紡織公司希望建立自動化品質檢測流程，既有的 AI 系統檢測到布料瑕疵時，需自動拍照存檔、發送通知給品管人員。該公司具有一定開發人力，希望快速建置此工作流程，並保有彈性調整空間，下列哪一種解決方案最適合？","o":["使用 n8n 建立工作流(Workflow)，整合 AI 檢測 API、檔案系統、通訊軟體","委外開發客製化程式，完全符合公司需求規格","採購現成的品質管理軟體，直接導入使用","使用 Excel 巨集搭配人工作業處理檢測結果"],"a":0,"e":"n8n 是開源的工作流自動化工具，能以節點串接 AI 檢測 API、檔案系統與通訊軟體，建置快速，又允許撰寫程式碼調整，適合具備一定開發人力、重視彈性的團隊。委外開發耗時且費用高；現成軟體彈性不足；Excel 巨集搭配人工作業既不自動化，也難以擴充。","src":"115年第一次 第27題"},{"id":"gen-115-1-28","s":"gen","q":"某市政府交通局計劃導入生成式 AI 技術來自動生成公車到站時間預測的文字報告，每日需處理約 50 萬筆交通資料並生成 1000 份報告。在評估導入成本時，團隊希望進行 Token Economics 分析(指模型推理與生成過程中，Token 使用量及其費用)。下列何者不屬於 Token Economics 的考量範圍？","o":["每次 API 呼叫所需的輸入 Token 數量","生成報告內容所消耗的輸出 Token 費用","AI 模型訓練階段使用 Token 數量所需的 GPU 記憶體成本","模型推理過程中的 Token 使用量統計"],"a":2,"e":"Token Economics 關注的是推論階段的 Token 使用量與費用，例如輸入 Token、輸出 Token 費用與推理過程的用量統計。「模型訓練階段的 GPU 記憶體成本」屬於訓練基礎設施成本，不在本題定義的推論 Token 費用範圍內，因此是答案。其餘三項皆屬 Token Economics 的考量。","src":"115年第一次 第28題"},{"id":"gen-115-1-29","s":"gen","q":"某農業合作社希望建立一套自動化工作流程，當農民透過手機 APP 回報田間病蟲害照片時，系統能自動通知相關專家、建立案件紀錄並排程現場訪查。該合作社IT 資訊人力有限，僅有一位具備基礎程式概念的人員。下列哪一種開發方式最適合此需求？","o":["採用傳統程式開發，從零開始撰寫完整系統","使用純粹的 No-Code 平台，完全不需要任何程式技能","使用 Low-Code 平台，結合視覺化拖拉與少量程式碼","直接購買現成的農業管理軟體，不進行客製化"],"a":2,"e":"IT 人力有限、僅有一位具基礎程式概念的人員，Low-Code 平台以視覺化拖拉為主，必要時可搭配少量程式碼處理通知、案件建立與排程整合，最為合適。傳統開發負擔過重；純 No-Code 平台可能難以處理客製整合；現成軟體不客製化，則無法符合合作社的特定流程。","src":"115年第一次 第29題"},{"id":"gen-115-1-30","s":"gen","q":"某市政府環保局想建立一個垃圾分類查詢系統，讓民眾輸入物品名稱後自動判斷分類。由於垃圾種類繁多，但每種分類的訓練範例有限，工程師決定採用少樣本學習(Few-shot Learning)技術。下列何者為少樣本學習(Few-shot Learning)的主要特徵？","o":["需重新蒐集大規模標註資料，以確保模型具備穩定表現","透過少量任務示例，引導模型適應新情境或新分類需求","不需任何範例輸入，即可完成新任務推論","僅適用於自然語言處理任務，對其他模態效果有限"],"a":1,"e":"少樣本學習的特徵是僅需少量任務示例，就能引導模型適應新情境或新分類。「需重新蒐集大規模標註資料」與少樣本的概念相反；「不需任何範例」是零樣本學習；少樣本學習也廣泛應用於影像、語音等多種模態，並不限於自然語言處理。","src":"115年第一次 第30題"},{"id":"gen-115-1-31","s":"gen","q":"某有機農場累積了十年的病蟲害防治紀錄文件，包含不同作物的病害症狀描述、防治方法和效果評估。農場主人希望建立一個 AI 助手，能根據農民描述的作物症狀，快速提供相關的防治建議和歷史案例。下列哪一種技術最適合解決這個需求？","o":["直接使用 ChatGPT 的預訓練知識回答農業問題","將所有文件內容加入 ChatGPT 的系統提示詞中","採用 RAG 技術，將農場文件建立向量資料庫，結合大語言模型生成回答","使用少樣本學習(Few-shot Learning)，在提示詞中提供 3-5 個病害案例"],"a":2,"e":"十年累積的大量文件適合以 RAG 建立向量資料庫，依農民描述檢索相關病害案例，再由 LLM 生成建議，兼顧專屬知識與回答品質。ChatGPT 的預訓練知識不包含農場專屬紀錄；把所有文件塞進系統提示詞會超出上下文長度；提示中只放 3–5 個案例，涵蓋範圍又遠遠不足。","src":"115年第一次 第31題"},{"id":"gen-115-1-32","s":"gen","q":"隨著企業加速導入 AI，No-Code/Low-Code 平台逐漸成為模型開發與產品化的常見工具。相較於傳統自行撰寫程式的建模流程，下列何者最能正確描述此類平台在模型訓練機制上的典型特性？","o":["透過視覺化介面與標準化流程，協助完成模型訓練與調校","主要提供既有模型推論能力，通常不支援重新訓練","著重資料處理與轉換，模型訓練仍需外部工具完成","多數僅適用於特定大數據框架(如 Spark)的訓練流程"],"a":0,"e":"No-Code/Low-Code 的 AI 平台通常以視覺化介面與標準化流程（如 AutoML 精靈），協助使用者完成資料準備、模型訓練與調校。說它「只提供推論、不支援重新訓練」「訓練仍需外部工具」都低估了平台功能；「僅適用於 Spark 等特定框架」也與一般平台的通用設計不符。","src":"115年第一次 第32題"},{"id":"gen-115-1-33","s":"gen","q":"某醫療院所希望改善行政效率，規劃讓各科室人員可自行建立行政回報與內部申請表單，並導入 AI 功能以自動判讀與分類填寫內容(如問題類型或需求性質)，同時需兼顧流程調整彈性與降低系統開發維運負擔。下列哪一種技術組合最適合？","o":["Low-Code 平台 × 預訓練語言模型 API","No-Code 平台 × 規則式自動化(Rule-based Automation)","傳統程式開發 × 自建深度學習模型","試算表工具 × 手動資料標記分析"],"a":0,"e":"各科室要能自行建立表單，並保留流程調整彈性，適合使用 Low-Code 平台；自動判讀與分類填寫內容需要語意理解，串接預訓練語言模型 API 即可，不必自建模型，降低開發維運負擔。規則式自動化難以理解自由文字；傳統開發加自建模型成本過高；試算表加手動標記則不具自動化。","src":"115年第一次 第33題"},{"id":"gen-115-1-34","s":"gen","q":"某企業導入 No-Code/Low-Code 平台開放各部門自行開發應用。半年後發現：出現多個功能相近系統、資料欄位定義不一致，且部分應用未經審核即上線，並伴隨權限與維運管理混亂。下列何者最可能為根本問題？","o":["缺乏統一的開發與上線管理機制","平台提供過高的應用設計自主性","部門未建立共用的資料分析呈現標準","系統整合與自動化能力尚未完善"],"a":0,"e":"系統重複建置、欄位定義不一致、未經審核即上線、權限混亂，這些問題共同指向缺乏統一的開發與上線管理機制（治理框架）。平台自主性高本身並非問題，問題在於缺乏管控；缺少資料呈現標準、整合能力不足都只能解釋部分現象，不是根本原因。","src":"115年第一次 第34題"},{"id":"gen-115-1-35","s":"gen","q":"在生成式 AI 文字生成模型設計中，Encoder–Decoder 與 Decoder-only 為常見架構。下列何者最能正確說明兩者在資訊處理與生成機制上的核心差異？","o":["Encoder–Decoder 透過編碼與解碼階段處理序列，Decoder-only 則以單一模型完成處理","Encoder–Decoder 區分輸入理解與內容生成階段，Decoder-only 以單一模型同時處理上下文與生成","Decoder-only 架構主要依賴外部知識檢索，Encoder–Decoder 則不需要","Encoder–Decoder 架構僅適用於翻譯任務，Decoder-only 架構較適合對話任務"],"a":1,"e":"Encoder–Decoder 由編碼器理解輸入、解碼器生成輸出，兩個階段分工明確；Decoder-only 則以單一模型將上下文與生成內容放在同一序列中處理。「以單一模型完成處理」的描述不夠精確；Decoder-only 並不依賴外部檢索；Encoder–Decoder 也不限於翻譯，摘要等任務同樣適用。","src":"115年第一次 第35題"},{"id":"gen-115-1-36","s":"gen","q":"某連鎖零售企業使用生成式 AI 協助規劃門市補貨策略。決策時需同時考量多項彼此相關的因素，例如：庫存水位、促銷活動、區域銷售差異與物流限制。專案團隊發現，AI 雖能逐步說明推論過程，但對於多條件之間的相互影響掌握不足，導致建議結果偶有偏差。若希望透過提示工程(Prompt Engineering)改善此問題，下列哪一種策略最為適合？","o":["Chain of Thought，要求模型逐步展開推論","Tree of Thoughts，增加多種推論路徑探索","Graph Prompting，以結構化方式呈現條件與關聯","Zero-shot Prompting，避免範例影響模型判斷"],"a":2,"e":"問題癥結在於多條件之間的相互影響未被掌握。Graph Prompting 以節點與邊結構化呈現庫存、促銷、區域、物流等因素及其關聯，最能幫助模型理解交互作用。CoT 已在使用卻仍有偏差；ToT 著重探索多條路徑，而非釐清條件關係；Zero-shot 則與改善多因素推理無關。","src":"115年第一次 第36題"},{"id":"gen-115-1-37","s":"gen","q":"某電商平台導入生成式 AI 客服助理，用於自動回覆顧客詢問。營運需求包含：需即時反映每日更新的促銷活動與商品資訊，同時維持品牌一致的回覆語氣，且企業希望避免因模型重新訓練所造成的成本增加與系統不穩定。在此情境下，下列哪一種技術策略最合理？","o":["僅進行 Fine-tuning，使模型同時學習品牌語氣與即時促銷內容","僅導入 RAG 更新促銷資訊，期望模型直接從檢索內容學習品牌語氣","透過 Prompt Engineering 控制回覆風格，並以 RAG 引入最新商品與活動資訊","持續進行增量 Fine-tuning，以確保活動資訊同步更新"],"a":2,"e":"以 Prompt Engineering 控制品牌語氣，再以 RAG 即時引入每日更新的促銷與商品資訊，完全不需重新訓練，同時兼顧即時性、一致性與成本。只做 Fine-tuning 或持續增量微調，都會帶來訓練成本與不穩定；只用 RAG 卻期待模型從檢索內容學會品牌語氣，則難以穩定控制風格。","src":"115年第一次 第37題"},{"id":"gen-115-1-38","s":"gen","q":"某企業規劃導入生成式 AI 助理，在正式全面部署前進行概念驗證(PoC)，下列何者最不適合作為此階段的主要工作？","o":["驗證模型在實際使用情境下的回覆品質與穩定性","測試 AI 功能與業務需求的匹配程度","制定跨部門使用規範，與長期治理框架","評估系統整合可行性與技術限制"],"a":2,"e":"PoC 階段的重點是驗證可行性，例如回覆品質、與業務需求的匹配度、系統整合的技術限制。「制定跨部門使用規範與長期治理框架」屬於正式導入或全面推廣階段的工作，在 PoC 階段投入過早，因此最不適合。其餘三項都是 PoC 應執行的驗證工作。","src":"115年第一次 第38題"},{"id":"gen-115-1-39","s":"gen","q":"某企業規劃導入生成式 AI 客服系統，需處理顧客查詢並引用歷史交易資料。法遵部門在風險評估中指出，系統若不當處理顧客個人資料，可能引發合規與法律責任。若專案初期希望從資料層面降低敏感資訊暴露風險，下列敘述何者最為合理？","o":["強化模型輸出審查與遮罩機制，以過濾可能出現的敏感資訊","設定 AI 回覆範圍與角色權限，限制其存取特定類型資料","將資料集中於加密儲存環境，並加強系統存取控管","僅提供必要資料或數據欄位與去識別化策略，減少模型接觸可識別個資"],"a":3,"e":"從資料層面降低暴露風險，最根本的做法是資料最小化：只提供必要欄位，並搭配去識別化，讓模型盡量不接觸可識別個資。輸出審查與遮罩屬於事後控管；設定回覆範圍與角色權限屬於存取或應用層控管；加密儲存保護的是靜態資料，模型處理時仍會接觸完整個資。","src":"115年第一次 第39題"},{"id":"gen-115-1-40","s":"gen","q":"某企業導入大型語言模型(LLM)進行客服自動化，並已透過 Fine-Tuning 學習企業標準問答範例，但在實務運作中仍出現回應策略未符合服務優先順序及語氣與品牌風格不一致的情況，因此技術團隊建議再導入 Reinforcement Fine-tuning (RFT)機制進行優化，其主要目的為何？","o":["擴展模型的知識涵蓋範圍與資料記憶能力","透過 reward 訊號調整模型回應策略與行為偏好","提升模型推論速度與降低回應延遲","降低 prompt 設計複雜度並取代訓練流程"],"a":1,"e":"強化微調（RFT）透過 reward 訊號評分模型的回應，引導模型調整回應策略與行為偏好，適合修正服務優先順序與品牌語氣不一致等問題。擴展知識涵蓋範圍較適合 RAG 或一般微調；RFT 不以提升推論速度為目的，也無法取代提示設計或訓練流程。","src":"115年第一次 第40題"},{"id":"gen-115-1-41","s":"gen","q":"企業在評估 AI 決策模型是否存在資料分布偏差時，下列何者最屬於偏見檢測(Bias Detection)而非偏見緩解(Bias Mitigation)措施？","o":["比較不同資料分布的模型預測結果分布與錯誤率","重新加權訓練樣本以平衡資料分布代表性","在推論階段加入輸出過濾規則","調整模型決策閾值(Decision Threshold)以降低預測差異"],"a":0,"e":"偏見檢測是「發現與量測」偏差，例如比較不同群體的預測結果分布與錯誤率差異。重新加權訓練樣本屬於前處理的緩解措施；加入輸出過濾規則、調整決策閾值則屬於後處理的緩解措施，都是在發現偏差後進行修正，而非檢測。","src":"115年第一次 第41題"},{"id":"gen-115-1-42","s":"gen","q":"某企業希望利用含敏感資訊的資料進行 AI 模型訓練，但政策要求原始資料不得外洩，且資料可集中於安全環境中處理。同時，企業希望在資料使用過程中，即使資料處於加密狀態，仍能完成模型計算。在此需求下，下列哪一種技術最為適合？","o":["聯邦學習(Federated Learning)","同態加密(Homomorphic Encryption)","零知識證明(Zero-knowledge Proof)","資料匿名化(Data Anonymization)"],"a":1,"e":"同態加密允許直接對加密資料進行運算，結果解密後與明文運算相同，正好符合「資料處於加密狀態仍能完成模型計算」的需求，且資料可集中於安全環境處理。聯邦學習適用於資料分散、不集中的情境；零知識證明用於驗證而非計算；資料匿名化並不是加密運算。","src":"115年第一次 第42題"},{"id":"gen-115-1-43","s":"gen","q":"某金融服務公司規劃導入生成式 AI，在評估模型部署方式時，基於內部控制與治理要求，企業考慮將大型語言模型建置於公司可管理環境，而非直接採用外部雲端服務。下列何者最能合理說明此部署決策的潛在優勢？","o":["有助提升模型回覆穩定性並降低隨機性影響","可降低敏感資料需傳輸至外部服務的風險","可直接減少模型訓練與維運所需資源投入","可避免模型輸出偏差與幻覺(Hallucination)問題"],"a":1,"e":"將 LLM 部署於企業可管理的環境，敏感資料不必傳送至外部雲端服務，可降低外洩風險並提升治理控制力。部署位置不會改變模型的隨機性，也無法避免偏差與幻覺；自建環境通常還需要更多硬體與維運投入，並不會「直接減少資源投入」。","src":"115年第一次 第43題"},{"id":"gen-115-1-44","s":"gen","q":"某智慧製造廠導入語音互動 AI 助理，作業人員可透過語音查詢設備狀態與操作指引。系統流程包含語音轉文字、語言模型生成回覆，以及即時查詢內部系統資料。測試結果顯示：語音轉文字在專業設備術語上錯誤率偏高；語言模型回覆偶有內容不夠精準；系統整體回應速度略慢但仍在可接受範圍。若專案目標為優先確保正確執行指令，下列改進措施的執行順序何者最合理？","o":["優化語言模型 → 強化語音模型 → 優化系統效能 → 調整生成參數","強化語音模型 → 優化語言模型與知識補充 → 調整生成參數 → 優化系統效能","優化系統效能 → 強化語音模型 → 優化語言模型與知識補充 → 調整生成參數","強化語音模型 → 優化系統效能 → 優化語言模型與知識補充 → 調整生成參數"],"a":1,"e":"目標是優先確保正確執行指令：應先強化語音模型（上游辨識錯誤會使後續全錯），再優化語言模型並補充知識，接著調整生成參數細修，最後處理尚可接受的系統效能。先優化語言模型或先處理效能的排序，都違反「先上游、後下游」與「先正確、後速度」的原則。","src":"115年第一次 第44題"},{"id":"gen-115-1-45","s":"gen","q":"某企業導入生成式 AI 助理，協助內部人員撰寫專案建議與分析報告。團隊希望透過思維鏈(Chain of Thought, CoT)提示設計提升模型輸出的邏輯性與推理透明度，下列何者最符合該提示策略？","o":["「請直接給出最終建議，不需顯示分析過程。」","「以下提供兩份分析報告範例，請依相同格式產出新報告。」","「請將任務拆為三個步驟：資料整理 → 重點摘要 → 建議產出。」","「請逐步說明你的判斷依據與推理過程，最後再給出結論。」"],"a":3,"e":"思維鏈提示的核心是要求模型逐步說明判斷依據與推理過程，最後再給出結論，以提升邏輯性與透明度。「直接給出最終建議」正好相
